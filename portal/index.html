.sv-acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.sv-pick{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.sv-pick a{padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;background:var(--card);box-shadow:var(--shadow);text-decoration:none;font-weight:800;font-size:.8125rem;color:var(--muted)}
.sv-pick a.on{background:var(--inv);color:var(--inv-ink)}
.sv-gantt{position:relative;margin:16px 0 4px;height:58px}
.sv-gantt .ru{position:absolute;inset:0 0 auto;height:18px}
.sv-gantt .ru span{position:absolute;transform:translateX(-50%);font-size:.6875rem;font-weight:800;color:var(--muted);white-space:nowrap}
.sv-gantt .ru span:first-child{transform:none}.sv-gantt .ru span:last-child{transform:translateX(-100%)}
.sv-gantt .bl{position:absolute;left:0;right:0;top:20px;height:34px;border-radius:12px;overflow:hidden;background:var(--card2)}
.sv-gantt .b{position:absolute;top:0;bottom:0;background:var(--cc);border-right:2px solid #fff;color:#fff;font-size:.6875rem;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.sv-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sv-row{display:grid;grid-template-columns:104px 1fr;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:0 10px 24px -20px rgba(90,60,90,.6);border:1px solid var(--line)}
.sv-tm{display:flex;flex-direction:column;justify-content:center;padding:10px 12px;background:var(--cs);border-left:6px solid var(--cc)}
.sv-tm b{font-family:var(--font-title);font-weight:900;font-size:1.375rem;line-height:1.1;color:var(--cc)}
.sv-tm small{font-size:.75rem;font-weight:800;color:var(--muted)}
.sv-tx{padding:10px 14px;min-width:0}
.sv-tx .tg{display:inline-block;font-size:.6875rem;font-weight:800;color:#fff;background:var(--cc);border-radius:999px;padding:1px 8px;margin-bottom:4px}
.sv-tx h3{margin:0;font-family:var(--font-title);font-weight:900;font-size:1.0625rem;line-height:1.35}
.sv-tx p{margin:4px 0 0;font-size:.9375rem;font-weight:700;color:var(--ink2);line-height:1.55}
.sv-tx p span{display:block}
.sv-gantt .b.clip{font-size:0!important}
.sv-row.now{box-shadow:0 0 0 3px var(--cc)}
@media (max-width:420px){.sv-row{grid-template-columns:84px 1fr}.sv-tm{padding:10px 8px}.sv-tm b{font-size:1.0625rem}.sv-head h1{font-size:1.375rem}}
@media print{
  .sv .back,.sv .sv-acts,.sv .sv-pick{display:none!important}
  .sv{display:flex;flex-direction:column;min-height:268mm}
  .sv-head{border-radius:12px;padding:7pt 12pt;box-shadow:none;display:flex;align-items:center;justify-content:space-between;gap:8pt}
  .sv-head small{display:none}
  .sv-head h1{font-size:15pt;margin:0}
  .sv-facts{gap:3pt;flex-wrap:nowrap;justify-content:flex-end}
  .sv-facts span{white-space:nowrap}
  .sv-facts .ic{display:none}
  .sv-facts span{font-size:8.5pt;padding:1.5pt 7pt}
  .sv-gantt{margin:6pt 0 0;height:34pt}
  .sv-gantt .ru span{font-size:7.5pt}
  .sv-gantt .bl{top:12pt;height:20pt;border-radius:7px}
  .sv-gantt .b{font-size:7.5pt}
  .sv-list{flex:1;gap:2.5pt;margin-top:5pt}
  .sv-row{flex:1 0 auto;grid-template-columns:24mm 1fr;border-radius:8px;box-shadow:none;break-inside:avoid}
  .sv-tm{padding:2pt 8pt;border-left-width:4pt}
  .sv-tm b{font-size:12pt}.sv-tm small{font-size:7.5pt}
  .sv-tx{padding:2pt 10pt;display:flex;flex-direction:column;justify-content:center}
  .sv-tx .tg{display:none}
  .sv-tx h3{font-size:10.5pt;line-height:1.25}
  .sv-tx p{font-size:8.6pt;margin-top:.5pt;line-height:1.35}
  .sv-tx p span{display:inline}.sv-tx p span+span::before{content:" ／ ";color:var(--muted)}
  .sv-row.now{box-shadow:none}
}

/* 印刷用「当日のしおり」 */
.svp{display:none}
@media print{
  .sv > .sv-head,.sv > .sv-gantt,.sv > .sv-list,.sv > .sv-var{display:none!important}
  .svp{display:flex;flex-direction:column;min-height:268mm;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .svp .ic{width:100%;height:100%}
  .svp-head{position:relative;display:grid;grid-template-columns:1fr auto auto;align-items:end;gap:12pt;padding:9pt 0 9pt;border-bottom:1pt solid #D9CFDF}
  .svp-head::before{content:"";position:absolute;left:0;right:0;top:0;height:3.5pt;border-radius:3pt;background:linear-gradient(90deg,var(--c1),var(--c2))}
  .svp-ttl{min-width:0;padding-top:6pt}
  .svp-ttl small{display:block;font-size:8pt;font-weight:800;letter-spacing:.3em;color:var(--muted)}
  .svp-ttl h1{margin:2pt 0 5pt;font-family:var(--font-title);font-weight:900;font-size:21pt;line-height:1.2;letter-spacing:.02em}
  .svp-facts{display:flex;flex-wrap:wrap;gap:3pt 12pt;font-size:9pt;font-weight:800;color:var(--ink2)}
  .svp-facts span{display:inline-flex;align-items:center;gap:4pt}
  .svp-facts .ic{width:10pt;height:10pt;color:var(--c1)}
  .svp-art{width:38pt;height:38pt;color:var(--c1);opacity:.9;align-self:center}
  .svp-art .art{width:100%;height:100%}
  .svp-date{text-align:center;padding-left:12pt;border-left:1pt solid #D9CFDF;line-height:1}
  .svp-date small{display:block;font-size:7.5pt;font-weight:800;letter-spacing:.2em;color:var(--muted)}
  .svp-date b{display:block;font-family:var(--font-title);font-weight:900;font-size:28pt;letter-spacing:-.01em;margin:2pt 0}
  .svp-date b i{font-style:normal;font-size:18pt;color:var(--muted);margin:0 1pt}
  .svp-date b.sm{font-size:12pt}
  .svp-date span{font-size:8.5pt;font-weight:800;color:var(--ink2)}
  .svp-keys{display:flex;gap:5pt;margin:8pt 0 2pt;align-items:stretch}
  .svp-kh{flex:none;display:grid;place-items:center;text-align:center;font-size:8pt;font-weight:900;line-height:1.35;padding:0 6pt;border-radius:7pt;background:var(--inv);color:var(--inv-ink)}
  .svp-keys > div{flex:1;min-width:0;border:1.2pt solid var(--cc);border-radius:8pt;padding:4pt 8pt 5pt;background:var(--card)}
  .svp-keys span{display:flex;align-items:center;gap:3pt;font-size:7.5pt;font-weight:900;color:var(--cc)}
  .svp-keys span .ic{width:9pt;height:9pt}
  .svp-keys > div b{display:block;font-family:var(--font-title);font-weight:900;font-size:16pt;line-height:1.1}
  .svp-keys > div b small{font-size:7.5pt;color:var(--muted);margin-left:2pt}
  .svp-keys em{display:block;font-style:normal;font-size:8pt;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .svp-list{display:flex;flex-direction:column;gap:3pt;margin-top:6pt}
  .svp-sec h3{display:flex;align-items:center;gap:6pt;margin:3pt 0 2pt;font-family:var(--font-title);font-weight:900;font-size:11pt}
  .svp-sec h3 span{width:14pt;height:14pt;border-radius:50%;display:grid;place-items:center;background:var(--inv);color:var(--inv-ink);font-size:8pt}
  .svp-sec h3::after{content:"";flex:1;border-bottom:.8pt dotted #CFC5D6}
  .svp-r{position:relative;display:grid;grid-template-columns:15mm 15pt 1fr;gap:7pt;align-items:start;padding:2.2pt 6pt 2.2pt 0;break-inside:avoid}
  .svp-r::before{content:"";position:absolute;left:calc(15mm + 7pt + 7.5pt);top:0;bottom:0;border-left:1pt solid #E2D9E7}
  .svp-sec .svp-r:first-of-type::before{top:7pt}.svp-sec .svp-r:last-child::before{bottom:auto;height:7pt}
  .svp-t{text-align:right;line-height:1.1;padding-top:1pt}
  .svp-t b{display:block;font-family:var(--font-title);font-weight:900;font-size:11pt}
  .svp-t small{display:block;font-size:7pt;font-weight:800;color:var(--muted);margin-top:1pt}
  .svp-dot{position:relative;z-index:1;width:15pt;height:15pt;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.1pt solid var(--cc);color:var(--cc);padding:2.6pt}
  .svp-x{min-width:0}
  .svp-x h4{margin:0;font-weight:800;font-size:10pt;line-height:1.3}
  .svp-x p{margin:.5pt 0 0;font-size:8.2pt;font-weight:700;color:#5A5061;line-height:1.4}
  .svp-x p span{display:inline}.svp-x p span+span::before{content:" ／ ";color:#B5AABD}
  .svp-r{isolation:isolate}
  .svp-r.key::after{content:"";position:absolute;z-index:-1;left:calc(15mm + 14pt);right:0;top:0;bottom:0;background:var(--cs);border-radius:0 8pt 8pt 0}
  .svp-r.key .svp-t b{font-size:13pt;color:var(--cc)}
  .svp-r.key .svp-dot{background:var(--cc);color:#fff;width:17pt;height:17pt;margin-left:-1pt;margin-top:-1pt}
  .svp-r.key h4{font-size:11pt;font-weight:900}
  .svp-move{display:flex;align-items:center;gap:6pt;margin:2pt 0 2pt calc(15mm - 4pt);padding:4pt 9pt;border:1pt dashed var(--cc);border-radius:9pt;font-size:8.5pt;font-weight:700;color:var(--ink2);break-inside:avoid}
  .svp-move b{font-family:var(--font-title);font-weight:900;font-size:11pt;color:var(--cc)}
  .svp-move .ic{flex:none;width:13pt;height:13pt;color:var(--cc)}
  .svp-move strong{font-weight:900;color:var(--ink);font-size:9.5pt}
  .svp-foot{flex:1 1 0;display:flex;gap:8pt;margin-top:6pt;min-height:16mm;overflow:hidden}
  .svp-memo{flex:1;position:relative;border:1pt solid #DDD3E2;border-radius:9pt;padding:4pt 9pt 0;display:flex;flex-direction:column;overflow:hidden}
  .svp-memo b{flex:none;font-size:7.5pt;font-weight:900;color:var(--muted);height:8pt}
  .svp-lines{position:absolute;left:9pt;right:9pt;top:12pt;bottom:3pt;overflow:hidden}
  .svp-lines i{display:block;height:15pt;border-bottom:.7pt solid #E6DEEA}
  .svp-qr{flex:none;display:flex;flex-direction:column;align-items:center;gap:2pt;font-size:6.2pt;font-weight:800;color:var(--muted);text-align:center;line-height:1.3}
  .svp-qr svg{width:15mm;height:15mm}
  .svp.roomy .svp-list{flex:1;margin-top:10pt}
  .svp.roomy .svp-sec{flex:1;display:flex;flex-direction:column}
  .svp.roomy .svp-r{flex:1 0 auto;grid-template-columns:19mm 20pt 1fr;gap:9pt;padding:5pt 8pt 5pt 0;max-height:30mm}
  .svp.roomy .svp-r::before{left:calc(19mm + 9pt + 10pt)}
  .svp.roomy .svp-sec .svp-r:first-of-type::before{top:12pt}.svp.roomy .svp-sec .svp-r:last-child::before{height:12pt}
  .svp.roomy .svp-r.key::after{left:calc(19mm + 19pt)}
  .svp.roomy .svp-t b{font-size:14pt}.svp.roomy .svp-t small{font-size:8.5pt}
  .svp.roomy .svp-r.key .svp-t b{font-size:16pt}
  .svp.roomy .svp-dot{width:20pt;height:20pt;padding:3.6pt}
  .svp.roomy .svp-r.key .svp-dot{width:22pt;height:22pt}
  .svp.roomy .svp-x h4{font-size:13pt}.svp.roomy .svp-r.key h4{font-size:14pt}
  .svp.roomy .svp-x p{font-size:10pt;margin-top:2pt}
  .svp.roomy .svp-keys > div b{font-size:20pt}
  .svp.roomy .svp-foot{flex:none;height:42mm}
  .svp.dense .svp-r{padding-top:1.2pt;padding-bottom:1.2pt}
  .svp.dense .svp-x h4{font-size:9.5pt}
  .svp.dense .svp-x p{font-size:7.6pt;line-height:1.32}
  .svp.dense .svp-t b{font-size:10pt}
  .svp.dense .svp-r.key .svp-t b{font-size:12pt}
  .svp.dense .svp-r.key h4{font-size:10.5pt}
  .svp.dense .svp-head{padding:7pt 0 7pt}
  .svp.dense .svp-ttl h1{font-size:19pt}
  .svp.dense .svp-keys{margin-top:6pt}
  .svp.dense .svp-list{margin-top:3pt;gap:1pt}
}
/* しおりの色使い：前の印刷（グラデーションの見出し・色付きの時刻の帯）に合わせる */
@media print{
  .svp-head{padding:10pt 14pt;border:none;border-radius:12px;background:linear-gradient(130deg,var(--c1),var(--c2));color:#fff;align-items:center}
  .svp-head::before{display:none}
  .svp-ttl{padding-top:0}
  .svp-ttl small{color:rgba(255,255,255,.92)}
  .svp-ttl h1{color:#fff}
  .svp-facts{gap:3pt 5pt}
  .svp-facts span{color:#fff;background:rgba(255,255,255,.24);border-radius:999px;padding:1.5pt 8pt}
  .svp-facts .ic{color:#fff}
  .svp-date{border-left:1pt solid rgba(255,255,255,.55);color:#fff}
  .svp-date small,.svp-date span,.svp-date b i{color:rgba(255,255,255,.92)}
  .svp-qr{background:var(--card);border-radius:8pt;padding:4pt 4pt 3pt;color:var(--muted)}
  .svp-qr svg{width:13mm;height:13mm}
  .svp-art{color:#fff}
  .svp-kh{background:linear-gradient(160deg,var(--c1),var(--c2))}
  .svp-keys > div{background:var(--cs);border-color:var(--cc)}
  .svp-keys > div b{color:var(--cc)}
  .svp-sec h3 span{background:linear-gradient(130deg,var(--c1),var(--c2))}
  .svp-list{gap:2.5pt}
  .svp-sec{display:flex;flex-direction:column;gap:2.5pt}
  .svp-r{grid-template-columns:22mm 1fr;gap:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
  .svp-r::before,.svp-r.key::after,.svp-dot{display:none}
  .svp-t{display:flex;flex-direction:column;justify-content:center;text-align:left;padding:2.5pt 8pt;background:var(--cs);border-left:4pt solid var(--cc)}
  .svp-t b{color:var(--cc)}
  .svp-x{display:flex;flex-direction:column;justify-content:center;padding:2.5pt 10pt}
  .svp-r.key{border:1.2pt solid var(--cc)}
  .svp-r.key .svp-t{background:var(--cc)}
  .svp-r.key .svp-t b,.svp-r.key .svp-t small{color:#fff}
  .svp-move{margin:0;background:var(--cs);border:1pt solid var(--cc)}
  .svp.dense .svp-r{padding:0}
  .svp.dense .svp-list,.svp.dense .svp-sec{gap:2pt}
  .svp.dense .svp-t,.svp.dense .svp-x{padding-top:1.4pt;padding-bottom:1.4pt}
  .svp.roomy .svp-r{grid-template-columns:28mm 1fr;padding:0}
  .svp.roomy .svp-list,.svp.roomy .svp-sec{gap:5pt}
  .svp.roomy .svp-t{padding:6pt 12pt}.svp.roomy .svp-x{padding:6pt 14pt}
  .svp-r{align-items:stretch}
  .svp-head,.svp.dense .svp-head{padding:8pt 12pt 8pt 14pt}
  .svp-facts{flex-wrap:nowrap}
  .svp-facts span{white-space:nowrap;font-size:8.5pt}
  .svp.dense .svp-ttl h1{font-size:18pt;margin:1pt 0 4pt}
  .svp.dense .svp-date b{font-size:24pt}
  .svp.dense .svp-keys{margin:5pt 0 0}
  .svp.dense .svp-keys > div{padding:3pt 8pt 4pt}
  .svp.dense .svp-keys > div b{font-size:14pt}
  .svp.dense .svp-list,.svp.dense .svp-sec{gap:1.6pt}
  .svp.dense .svp-sec h3{margin:2pt 0 1pt;font-size:10pt}
  .svp.dense .svp-t,.svp.dense .svp-x{padding-top:1pt;padding-bottom:1pt}
  .svp.dense .svp-move{padding:2.5pt 9pt}
  .svp.dense .svp-foot{min-height:9mm;margin-top:4pt}
}
/* 印刷用「横長」：A4横の別ページ。印刷ボタンで縦（しおり）/横を切り替え（body[data-pmode]） */
.svh{display:none}
@page wide{size:A4 landscape;margin:9mm 11mm}
@media print{
  body[data-pmode="h"] .svp{display:none!important}
  body[data-pmode="h"] .sv{min-height:0!important;display:block!important}
  body[data-pmode="h"] .svh{display:flex}
  .svh{page:wide;height:190mm;flex-direction:column;overflow:hidden;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .svh-hd{border-radius:14px;padding:3.5mm 6mm;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:space-between;gap:6mm}
  .svh-hd h1{font-family:var(--font-title);font-weight:900;font-size:18pt;margin:0;line-height:1.2;white-space:nowrap}
  .svh-hd .meta{display:flex;gap:2mm;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .svh-hd .meta span{font-size:9.5pt;font-weight:800;padding:1mm 3.5mm;border-radius:999px;background:rgba(255,255,255,.22);white-space:nowrap}
  .svh-hd .meta span.k{background:var(--card);color:var(--ink)}
  .svh-gantt{position:relative;margin:3mm 0 0;height:16mm;flex:none}
  .svh-gantt .ru{position:absolute;left:0;right:0;top:0;height:5mm}
  .svh-gantt .ru span{position:absolute;transform:translateX(-50%);font-size:8.4pt;font-weight:800;color:var(--muted)}
  .svh-gantt .ru span:first-child{transform:none}
  .svh-gantt .bl{position:absolute;left:0;right:0;top:5.5mm;height:10mm;border-radius:8px;overflow:hidden;background:var(--card2)}
  .svh-gantt .b{position:absolute;top:0;bottom:0;background:var(--c);border-right:1.5pt solid #fff;color:#fff;font-size:8.6pt;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
  .svh-flow{flex:1;display:grid;gap:3.5mm;margin-top:3mm;min-height:0}
  .svh-ph{display:flex;flex-direction:column;gap:2mm;min-height:0;min-width:0}
  .svh-ph-h{display:flex;align-items:baseline;justify-content:space-between;gap:2mm;padding:0 1mm 1mm;border-bottom:2pt solid var(--pc)}
  .svh-ph-h b{font-family:var(--font-title);font-weight:900;font-size:12.5pt;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .svh-ph-h span{font-size:8.6pt;font-weight:800;color:var(--muted);white-space:nowrap}
  .svh-it{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;border-radius:10px;padding:1.4mm 3mm;background:color-mix(in srgb,var(--c) 8%,#fff);border-left:2mm solid var(--c)}
  .svh-it.food{background:color-mix(in srgb,var(--c) 14%,#fff)}
  .svh-it .t{display:flex;align-items:baseline;gap:2mm;flex-wrap:wrap}
  .svh-it .t b{font-family:var(--font-title);font-weight:900;font-size:13pt;color:var(--c);line-height:1.1}
  .svh-it .t small{font-size:8.4pt;font-weight:800;color:var(--muted)}
  .svh-it h3{margin:.6mm 0 0;font-family:var(--font-title);font-weight:900;font-size:11.5pt;line-height:1.3}
  .svh-it p{margin:.5mm 0 0;font-size:8.4pt;line-height:1.42;font-weight:700;color:var(--ink2)}
  .svh-it p span{display:block}
  .svh-it p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:10;overflow:hidden}
  .svh-it p span b{color:var(--c);font-family:var(--font-title);font-weight:900}
  .svh-foot{flex:none;margin-top:2.5mm;display:flex;justify-content:space-between;align-items:center;gap:4mm;font-size:8.6pt;font-weight:700;color:var(--muted)}
  .svh-foot .qr svg{width:12mm;height:12mm;display:block}
  .svh.big .svh-it{padding:3mm 5mm}
  .svh.big .svh-it .t b{font-size:19pt}.svh.big .svh-it .t small{font-size:10.5pt}
  .svh.big .svh-it h3{font-size:16pt;margin-top:1.2mm}
  .svh.big .svh-it p{font-size:11pt;margin-top:1mm}
}
/* スケジュール: 各チーム */
.sv-teams-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:24px 0 10px}
.sv-teams-h h2{margin:0;font-family:var(--font-title);font-weight:900;font-size:1.375rem}
.sv-teams-h span{font-size:.8125rem;font-weight:700;color:var(--muted)}

/* ---------- タスク管理 ---------- */
.tk-need{display:flex;gap:12px;align-items:flex-start}.tk-need .ic{width:24px;height:24px;color:var(--peach);flex:none}.tk-need p{margin:4px 0 0;font-size:.875rem;color:var(--ink2)}
.tk-sum{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:16px;align-items:center;padding:16px 20px;margin-top:16px}
.tk-num{display:flex;flex-direction:column;align-items:center;min-width:56px}.tk-num b{font-family:var(--font-title);font-size:1.75rem;font-weight:900;line-height:1}.tk-num span{font-size:.75rem;font-weight:800;color:var(--muted);margin-top:4px}
.tk-num.late b,.tk-num.late span{color:#D2364F}
.tk-prog{display:flex;flex-direction:column;gap:6px;min-width:0}.tk-prog span{font-size:.75rem;font-weight:800;color:var(--muted)}
.tk-prog i{display:block;height:10px;border-radius:999px;background:var(--card2);overflow:hidden}.tk-prog em{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .4s ease-out}
@media (max-width:520px){.tk-sum{grid-template-columns:repeat(3,1fr);gap:12px}.tk-prog{grid-column:1/-1}}
.tk-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px 0 0;padding:2px}
.tk-chips::-webkit-scrollbar{display:none}
.tk-chips button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.8125rem;font-weight:800;cursor:pointer}
.tk-chips button i{width:10px;height:10px;border-radius:50%;background:var(--dot)}
.tk-chips button small{font-size:.6875rem;font-weight:900;background:var(--peach);color:#fff;border-radius:999px;padding:1px 7px}
.tk-chips button.on{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.tk-add{margin-top:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tk-add>input,.tk-row.editing>input{width:100%;font:inherit;font-size:1rem;font-weight:800;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink)}
.tk-add-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.tk-add-row label,.tk-note{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:800;color:var(--muted);min-width:0}
.tk-add-row select,.tk-add-row input,.tk-note textarea{font:inherit;font-size:.875rem;font-weight:700;min-height:44px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);min-width:0;width:100%}
@media (max-width:560px){.tk-add-row{grid-template-columns:1fr 1fr}.tk-add-row label:first-child{grid-column:1/-1}}
.tk-quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tk-quick span{font-size:.75rem;font-weight:800;color:var(--muted)}
.tk-quick button:not(.btn){min-height:36px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.75rem;font-weight:800;cursor:pointer}
.tk-quick button.on{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.tk-quick .btn{margin-left:auto;min-height:44px}
.tk-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:20px 0 4px}
.tk-whos{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tk-whos span{font-size:.75rem;font-weight:800;color:var(--muted);margin-right:2px}
.tk-whos button{min-height:36px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.75rem;font-weight:800;cursor:pointer}
.tk-whos button.on{background:var(--sky-soft);border-color:var(--sky);color:var(--ink)}
.tk-group{margin-top:16px}
.tk-group h3{display:flex;align-items:center;gap:8px;margin:0 0 8px 4px;font-family:var(--font-title);font-size:.9375rem;font-weight:900}
.tk-group h3 small{font-size:.75rem;font-weight:900;background:var(--card2);color:var(--muted);border-radius:999px;padding:1px 8px}
.tk-group.late h3{color:#D2364F}.tk-group.late h3 small{background:#FDE2E6;color:#D2364F}
.tk-group.today h3{color:var(--peach)}
.tk-row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;margin-bottom:8px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);border-left:4px solid var(--dot,var(--line));animation:fadeUp .3s ease-out both}
.tk-row.done{opacity:.6}
.tk-row.done .tk-main b{text-decoration:line-through;color:var(--muted)}
.tk-chk{width:36px!important;height:36px!important;border-radius:12px!important}
.tk-row.done .tk-chk{background:var(--mint);border-color:var(--mint)}
.tk-chk:hover{border-color:var(--mint)}
.tk-main{flex:1;min-width:0;cursor:pointer}
.tk-main b{display:block;font-size:.9375rem;font-weight:900;line-height:1.4;word-break:auto-phrase}
.tk-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:.75rem;font-weight:800;color:var(--muted)}
.tk-meta span,.tk-meta a{display:inline-flex;align-items:center;gap:3px}
.tk-meta .ic{width:13px;height:13px}
.tk-ev i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.tk-due.late{color:#D2364F}.tk-due.today{color:var(--peach)}.tk-due.soon{color:color-mix(in srgb,var(--peach) 70%,var(--ink))}
.tk-src{color:var(--lav);text-decoration:none}
.tk-note-s{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-edit{flex:none;width:40px;height:40px;border-radius:12px;border:none;background:var(--card2);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.tk-edit .ic{width:18px;height:18px}
.tk-row.editing{flex-direction:column;align-items:stretch;padding:16px;border-left-width:4px}
.tk-ed-act{display:flex;gap:8px;align-items:center}.tk-ed-act span{flex:1}
.tk-empty{margin-top:16px;text-align:center;padding:32px}

/* ---------- ホームの準備の状況・打ち合わせの入力補助 ---------- */
.hm-tk{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.hm-sum{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:16px;align-items:center}

.hm-t{flex:1;min-width:0;text-decoration:none;color:var(--ink)}
.hm-t b{display:block;font-size:.9375rem;font-weight:900;line-height:1.4;word-break:auto-phrase}
.hm-t small{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;font-size:.75rem;font-weight:800;color:var(--muted)}

.hm-t small .ic{width:12px;height:12px}

.hm-meet span{flex:1;min-width:0;display:flex;flex-direction:column}

.hm-meet b{font-size:1rem;font-weight:900}
.hm-meet em{font-style:normal;font-size:.8125rem;font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:560px){.hm-sum{grid-template-columns:repeat(3,1fr)}.hm-sum .tk-prog{grid-column:1/-1}.hm-tk{padding:16px}}
.mf-fw{display:flex;flex-direction:column;gap:8px;min-width:0}
.mf-chips{display:flex;flex-wrap:wrap;gap:6px}
.mf-chips button{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.75rem;font-weight:800;cursor:pointer}
.mf-chips button .ic{width:14px;height:14px}
.mf-chips button.on{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}

@media print{.meet-view select.todo-who{appearance:none;-webkit-appearance:none;border:none;background:none;padding:0;min-height:0}.mf-fw{gap:0}}

      if (dr.error) { toast("削除できませんでした"); return; }
      toast("削除しました"); await load(); location.hash = "#/"; return;
    }
    if (e.target.closest("#saveBtn")) { saveTeams(); return; }
    if (e.target.closest("#printBtn")) { window.print(); return; }
    if ((t = e.target.closest("[data-pin]"))) {
      var pid0 = t.dataset.pin, w = where(pid0); if (!w || w.team === "pool") return;
      var tm = draft.teams[w.team]; tm.pinned = tm.pinned || [];
      if (tm.pinned.indexOf(pid0) >= 0) tm.pinned = tm.pinned.filter(function(x){ return x !== pid0; }); else tm.pinned.push(pid0);
      draft.dirty = true; render(); return;
    }
    if ((t = e.target.closest(".m[data-pid]"))) {
      var pid = t.dataset.pid;
      if (selected && selected !== pid) { swap(selected, pid); return; }
      selected = selected === pid ? null : pid; render(); return;
    }
    if ((t = e.target.closest("[data-team]")) && selected) { moveTo(selected, t.dataset.team); return; }
  });
  document.addEventListener("input", function(e){
    seInput(e);
    if (e.target.tagName === "TEXTAREA" && e.target.closest(".edit-form")) autoGrow(e.target);
    if (e.target.id === "attQ") { attQuery = e.target.value; render(); }
    if (e.target.matches && e.target.matches("[data-rl-custom]")) { rl.custom = e.target.value; rl.removed = {}; try { localStorage.setItem("portal_roulette_custom", rl.custom); } catch (x) {} var w = document.getElementById("rlWheel"); if (w) w.innerHTML = wheelSVG(rlItems()); var sr = document.getElementById("slReel"); if (sr) sr.innerHTML = slotStrip(rlItems(), null); var c = document.querySelector(".rl-count b"); if (c) c.textContent = rlItems().length; var b = document.querySelector("[data-rl-spin]"); if (b) b.disabled = rlItems().length < 2; }
  });
  document.addEventListener("change", function(e){
    if (e.target.matches && e.target.matches("[data-balpos]")) { rl_balancePos = e.target.checked; try { localStorage.setItem("portal_balance_pos", rl_balancePos ? "1" : "0"); } catch (x) {} }
    if (e.target.matches && e.target.matches("[data-rl-ev]")) { rl.evId = e.target.value; rl.removed = {}; rl.history = []; render(); }
    if (e.target.matches && e.target.matches("[data-rl-remove]")) { rl.removeWinner = e.target.checked; }
    if (e.target.matches && e.target.matches("[data-rl-draw]")) { rl.draw = +e.target.value; try { localStorage.setItem("portal_roulette_draw", rl.draw); } catch (x) {} if (!rl.spinning) render(); }
    if (e.target.id === "ef-datepick" && e.target.value) { var dp = e.target.value.split("-"); document.getElementById("ef-date").value = (+dp[0]) + "年" + (+dp[1]) + "月" + (+dp[2]) + "日"; }
    if (e.target.id === "teamEv") { draft = null; selected = null; location.hash = "#/teams/" + e.target.value; }
  });
  // 打ち合わせの入力：「・」の自動入力、Enter で次のやること、⌘S で保存
  document.addEventListener("focusin", function(e){ var ta = e.target; if (ta.matches && ta.matches(".meet-form textarea") && !ta.value) { ta.value = "・"; ta.setSelectionRange(1, 1); } });
  document.addEventListener("focusout", function(e){ var ta = e.target; if (ta.matches && ta.matches(".meet-form textarea") && ta.value.trim() === "・") ta.value = ""; });
  document.addEventListener("keydown", function(e){
    if (e.isComposing || e.keyCode === 229) return;
    var tg = e.target;
    if ((e.metaKey || e.ctrlKey) && (e.key === "s" || e.key === "S") && document.querySelector(".meet-form")) { e.preventDefault(); saveMeeting(); return; }
    if (e.key !== "Enter" || e.shiftKey) return;
    if (tg.matches && tg.matches(".meet-form textarea")) {
      var v = tg.value, pos = tg.selectionStart, ls = v.lastIndexOf("\n", pos - 1) + 1, line = v.slice(ls, pos);
      if (line.trim() === "・") { e.preventDefault(); tg.value = v.slice(0, ls) + v.slice(pos); tg.setSelectionRange(ls, ls); tg.dispatchEvent(new Event("input", { bubbles: true })); return; }
      if (/^・/.test(line)) { e.preventDefault(); tg.setRangeText("\n・", pos, tg.selectionEnd, "end"); tg.dispatchEvent(new Event("input", { bubbles: true })); }
      return;
    }
    if (tg.dataset && tg.dataset.todoText !== undefined) {
      e.preventDefault(); readMeetForm(); var ni = +tg.dataset.todoText + 1;
      meetDraft.todos.splice(ni, 0, { text: "", who: "", done: false }); render();
      var nx = document.querySelector('[data-todo-text="' + ni + '"]'); if (nx) nx.focus();
    }
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && tp) { tpClose(); return; }
    if (document.fullscreenElement === app && location.hash.indexOf("#/roulette") === 0 && (e.key === " " || e.key === "Enter")) { e.preventDefault(); if (!document.querySelector(".rl-win")) spin(); }
  });
  document.addEventListener("click", function(e){
    var fsEl = document.fullscreenElement;
    if (fsEl === app && location.hash.indexOf("#/roulette") === 0 && !e.target.closest("button, .rl-win, select, textarea, input") && e.target.closest(".rl-stage")) spin();
  });
  window.addEventListener("beforeprint", function(){
    document.querySelectorAll(".meet-form textarea").forEach(function(t){
      var d = t.nextElementSibling;
      if (!d || !d.classList.contains("ptext")) { d = document.createElement("div"); d.className = "ptext"; t.after(d); }
      d.textContent = t.value;
    });
  });
  document.addEventListener("fullscreenchange", function(){ if (location.hash.indexOf("#/roulette") === 0 && !rl.spinning) render(); });
  window.addEventListener("resize", function(){ if (!rl.spinning) slotSize(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Enter" && e.target.id === "gatePw") tryLogin(document.getElementById("gateGo").dataset.next); });
  // パソコン用: ドラッグで移動
  document.addEventListener("dragstart", function(e){ var m = e.target.closest && e.target.closest(".m[data-pid]"); if (m) { e.dataTransfer.setData("text/plain", m.dataset.pid); e.dataTransfer.effectAllowed = "move"; } });
  document.addEventListener("dragover", function(e){ var z = e.target.closest && e.target.closest("[data-team]"); if (z) { e.preventDefault(); z.classList.add("drop"); } });
  document.addEventListener("dragleave", function(e){ var z = e.target.closest && e.target.closest("[data-team]"); if (z) z.classList.remove("drop"); });
  document.addEventListener("drop", function(e){
    var z = e.target.closest && e.target.closest("[data-team]"); if (!z) return; e.preventDefault();
    var pid = e.dataTransfer.getData("text/plain"); if (!pid) return;
    var onChip = e.target.closest(".m[data-pid]");
    if (onChip && onChip.dataset.pid !== pid && z.dataset.team !== "pending") insertBefore(pid, onChip.dataset.pid); else moveTo(pid, z.dataset.team);
  });
  window.addEventListener("beforeunload", function(e){ if (draft && draft.dirty) { e.preventDefault(); e.returnValue = ""; } });

  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = I(el.dataset.ic); });
  render();
  load().then(render).catch(function(){ app.innerHTML = '<div class="card empty">読み込みに失敗しました。通信を確認して再読み込みしてください。</div>'; });
})();
</script>
</body>
</html>
