<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F2">
<title>親睦会ポータル</title>
<link rel="icon" type="image/png" href="../icon-192x192-any.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7F2; --card:#FFFFFF; --ink:#3B3241; --muted:#8E8494; --line:rgba(59,50,65,.09);
  --peach:#FF9A8B; --peach-soft:#FFE3DD; --mint:#5CC9A7; --mint-soft:#DDF5EC; --lav:#A08CF0; --lav-soft:#ECE7FF;
  --sky:#6BB8F0; --sky-soft:#E0F0FC; --lemon:#F6C453; --lemon-soft:#FFF3D3; --rose:#F27BA5; --rose-soft:#FFE1EC;
  --boy:#5B9BF0; --girl:#F27BA5;
  --shadow:0 18px 40px -26px rgba(90,60,90,.45);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --font-title:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:
  radial-gradient(600px 380px at 0% -5%, #FFE6DF 0%, transparent 70%),
  radial-gradient(600px 420px at 105% 0%, #EEE9FF 0%, transparent 65%),
  var(--bg);
  min-height:100vh; line-height:1.7; -webkit-font-smoothing:antialiased; padding-bottom:calc(84px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- header / nav ---------- */
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,247,242,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--peach),var(--lav));box-shadow:0 8px 18px -8px rgba(255,120,120,.7)}
.logo b{font-family:var(--font-title);font-size:1.12rem;font-weight:900;letter-spacing:.04em}
.logo small{display:block;font-size:.62rem;letter-spacing:.24em;color:var(--muted);font-weight:700;margin-top:-3px}
.top-admin{border:none;background:var(--card);border-radius:999px;padding:7px 14px;font-size:.8rem;font-weight:800;box-shadow:var(--shadow);cursor:pointer}
.top-admin.on{background:var(--ink);color:#fff}
.tabbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;border-radius:24px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 40px -18px rgba(70,40,80,.5);border:1px solid var(--line)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:66px;padding:6px 10px;border-radius:18px;text-decoration:none;font-size:.68rem;font-weight:800;color:var(--muted);transition:background .2s,color .2s}
.tabbar a span{font-size:1.25rem;line-height:1.2}
.tabbar a.on{background:linear-gradient(135deg,var(--peach-soft),var(--lav-soft));color:var(--ink)}

main{max-width:1000px;margin:0 auto;padding:22px 18px 30px}
.view{animation:fadeUp .45s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.page{font-family:var(--font-title);font-size:1.7rem;font-weight:900;margin:.2em 0 .1em;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.section-title{font-family:var(--font-title);font-weight:900;font-size:1.1rem;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:.92rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;border-radius:999px;padding:11px 20px;font-weight:800;font-size:.92rem;background:var(--card);box-shadow:var(--shadow);text-decoration:none;min-height:44px;touch-action:manipulation}
.btn.primary{color:#fff;background:linear-gradient(120deg,var(--peach),var(--rose) 55%,var(--lav))}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:.82rem}
.btn:active{transform:scale(.97)}

/* ---------- home ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.next{position:relative;overflow:hidden;padding:26px 26px 22px;margin-top:6px;color:#fff;border:none;
  background:linear-gradient(130deg,var(--c1,#FF9A8B),var(--c2,#A08CF0))}
.next::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.18)}
.next .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.14em;background:rgba(255,255,255,.25);padding:3px 12px;border-radius:999px}
.next .emoji{position:absolute;right:22px;bottom:12px;font-size:4.6rem;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.next h2{font-family:var(--font-title);font-weight:900;font-size:1.6rem;margin:10px 0 4px;line-height:1.35;max-width:78%}
.next .meta{font-size:.92rem;opacity:.95;display:flex;flex-wrap:wrap;gap:4px 14px}
.next .count{margin-top:14px;display:flex;align-items:baseline;gap:6px;font-weight:800}
.next .count b{font-family:var(--font-title);font-size:2.4rem;line-height:1}
.next .actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.next .actions .btn{background:#fff;color:var(--ink)}
.next .actions .btn.glass{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ev{display:flex;gap:14px;align-items:center;padding:16px 18px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.ev:hover{transform:translateY(-3px)}
.ev .ico{flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem;background:var(--soft,#FFE3DD)}
.ev .t{font-weight:800;line-height:1.4}
.ev .d{font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--mint-soft);color:#2E9C79}
.pill.wait{background:var(--lemon-soft);color:#B48714}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{font-family:var(--font-title);font-size:1.35rem;font-weight:900;margin:0}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:40px;height:40px;border-radius:14px;border:none;background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-size:1.1rem}
.cal{padding:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);padding:4px 0}
.dow.sun{color:#E2677F}.dow.sat{color:#4E8FD8}
.day{min-height:84px;border-radius:16px;padding:6px;background:#FFFBF8;border:1px solid transparent;display:flex;flex-direction:column;gap:3px}
.day.out{opacity:.35}
.day.today{border-color:var(--peach);background:#FFF1EC}
.day .n{font-size:.78rem;font-weight:800}
.day.sun .n{color:#E2677F}.day.sat .n{color:#4E8FD8}
.chip{display:block;font-size:.68rem;font-weight:800;line-height:1.3;padding:3px 6px;border-radius:9px;text-decoration:none;color:var(--ink);background:var(--soft,#FFE3DD);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbd{margin-top:14px;padding:16px 18px}
.tbd h3{margin:0 0 8px;font-size:.95rem}
@media (max-width:620px){.day{min-height:62px;padding:4px}.chip{font-size:0;padding:0;height:8px;border-radius:4px;background:var(--dot,#FF9A8B)}}

/* ---------- event detail ---------- */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:800;font-size:.86rem;color:var(--muted);margin-bottom:10px}
.hero{position:relative;overflow:hidden;padding:30px 28px 26px;border:none;color:#fff;background:linear-gradient(130deg,var(--c1),var(--c2))}
.hero .emoji{position:absolute;right:20px;top:18px;font-size:5rem;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero h1{font-family:var(--font-title);font-weight:900;font-size:1.9rem;line-height:1.35;margin:6px 0 12px;max-width:80%;position:relative}
.facts{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.fact{background:rgba(255,255,255,.24);border-radius:14px;padding:8px 14px;font-size:.9rem;font-weight:700}
.fact small{display:block;font-size:.66rem;letter-spacing:.14em;opacity:.85}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
@media (max-width:480px){.tl::before{left:83px}.tl li{grid-template-columns:72px 1fr;gap:20px}.tl li::before{left:78px}.tl .tm{font-size:.72rem}}
.box{padding:20px 22px}
.box h3{margin:0 0 12px;font-family:var(--font-title);font-size:1.05rem;font-weight:900;display:flex;align-items:center;gap:8px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:103px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--peach-soft),var(--lav-soft))}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:30px;padding:7px 0;position:relative}
.tl li::before{content:"";position:absolute;left:98px;top:14px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--peach)}
.tl li:nth-child(3n+2)::before{border-color:var(--lav)}.tl li:nth-child(3n)::before{border-color:var(--mint)}
.tl .tm{font-weight:800;font-size:.8rem;color:var(--muted);text-align:right;padding-top:2px;line-height:1.5}
.tl .tx{font-size:.93rem}
.notes{white-space:pre-wrap;font-size:.93rem}
.att{display:flex;gap:10px}
.att div{flex:1;border-radius:18px;padding:12px;text-align:center;font-weight:800}
.att b{display:block;font-family:var(--font-title);font-size:1.9rem;line-height:1.1}
.att .p{background:var(--mint-soft);color:#2E9C79}.att .a{background:var(--rose-soft);color:#C94F7E}.att .w{background:#F3F0F5;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#F3F0F5;margin:14px 0 4px}
.bar i{display:block;height:100%}

/* ---------- embedded check-in ---------- */
.embed{position:fixed;inset:0;z-index:60;background:rgba(40,25,45,.42);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.embed .sheet{width:min(1000px,100%);height:min(92vh,100%);background:#fff;border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:sheetUp .35s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.embed .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 20px;border-bottom:1px solid var(--line);font-weight:800}
.embed iframe{flex:1;width:100%;border:0}
.full-embed{height:calc(100vh - 210px);min-height:520px;width:100%;border:0;border-radius:24px;background:#fff;box-shadow:var(--shadow)}

/* ---------- admin ---------- */
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;box-shadow:var(--shadow);gap:2px}
.seg button{border:none;background:none;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:800;color:var(--muted)}
select,input[type=number],input[type=password],input[type=text]{font:inherit;font-size:1rem;font-weight:700;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;min-height:46px}
select:focus,input:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 4px var(--lav-soft)}
.panel{padding:20px 22px;margin-top:14px}
.row-flex{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{border-radius:14px;padding:6px 12px;font-size:.82rem;font-weight:800;background:#F7F4F8}
.stat.b{background:#E6F0FD;color:#2F6FC4}.stat.g{background:var(--rose-soft);color:#C94F7E}.stat.u{background:var(--lemon-soft);color:#A07812}
.warn{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--lemon-soft);color:#8A6A10;font-size:.85rem;font-weight:700}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:18px}
.team{position:relative;overflow:hidden;padding:18px 16px 16px;border-radius:24px;background:#fff;box-shadow:var(--shadow);border:2.5px solid transparent;transition:border-color .15s,transform .15s;min-height:160px}
.team::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--tc)}
.team.drop{border-color:var(--lav);transform:translateY(-2px)}
.team.target{border-color:var(--tc);border-style:dashed}
.team-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.team-name{display:flex;align-items:center;gap:10px;font-family:var(--font-title);font-weight:900;font-size:1.25rem}
.team-dot{width:30px;height:30px;border-radius:11px;background:var(--tc);display:grid;place-items:center;color:#fff;font-size:.95rem;font-weight:900;box-shadow:0 6px 14px -6px var(--tc)}
.team-count{font-size:.82rem;font-weight:800;color:var(--muted);background:#F7F4F8;border-radius:999px;padding:3px 10px;white-space:nowrap}
.members{display:flex;flex-direction:column;gap:7px}
.m{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;font-size:1.05rem;font-weight:800;background:#F8F5F9;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;border:2px solid transparent;min-height:48px}
.m i{width:22px;height:22px;border-radius:50%;background:#D9D2DE;flex:none;display:grid;place-items:center;color:#fff;font-size:.72rem;font-style:normal;font-weight:900}
.m.boy i{background:var(--boy)}.m.girl i{background:var(--girl)}
.m em{margin-left:auto;font-style:normal;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--lemon-soft);color:#A07812}
.m.gone em{background:var(--rose-soft);color:#C94F7E}
.m.sel{border-color:var(--ink);background:#fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.4)}
.m.gone{opacity:.55}.m.gone span{text-decoration:line-through}
.m.pend{background:#fff;border:2px dashed #E7D9A6}
.pool .members,.pend-box .members{flex-direction:row;flex-wrap:wrap}
.pool .m,.pend-box .m{min-height:44px}
.pool{margin-top:18px;padding:16px;border-radius:24px;border:2.5px dashed var(--line);background:rgba(255,255,255,.7)}
.pend-box{margin-top:14px;padding:16px;border-radius:24px;border:2.5px dashed #EAD9A0;background:#FFFBEE}
.pool.drop,.pend-box.drop{border-color:var(--lav)}
.pool.target,.pend-box.target{border-color:var(--peach)}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.box-head b{font-family:var(--font-title);font-size:1.05rem}
.box-head small{display:block;font-size:.78rem;color:var(--muted);font-weight:700}
.print-sheet{display:none}
.hint{font-size:.8rem;color:var(--muted);margin:10px 2px 0}
.gender-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:12px}
.g-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;border-radius:16px;background:#fff;box-shadow:0 8px 20px -18px rgba(0,0,0,.4);border:1px solid var(--line)}
.g-row .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-btns{display:flex;gap:4px;flex:none}
.g-btns button{border:1.5px solid var(--line);background:#fff;border-radius:999px;min-width:46px;min-height:40px;font-weight:800;cursor:pointer;touch-action:manipulation}
.g-btns button.on.boy{background:var(--boy);border-color:var(--boy);color:#fff}
.g-btns button.on.girl{background:var(--girl);border-color:var(--girl);color:#fff}
.gate{max-width:420px;margin:40px auto;padding:30px 26px;text-align:center}
.gate .big{font-size:3rem}
.gate input{width:100%;margin:14px 0 6px;text-align:center}
.err{color:#D2486F;font-size:.85rem;font-weight:700;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;font-size:.86rem;z-index:80;transition:opacity .25s,transform .3s}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- print (teams) : A4 にかわいく ---------- */
@page{size:A4 portrait;margin:12mm}
@media print{
  body{background:#fff;padding:0;font-size:10.5pt}
  .top,.tabbar,.no-print,.toast,.embed,.view>h1.page,.view>.sub,.board,.pool,.pend-box,.warn{display:none!important}
  main{padding:0;max-width:none}
  .print-sheet{display:block}
  .ps-head{position:relative;overflow:hidden;border-radius:18px;padding:14pt 18pt;color:#fff;background:linear-gradient(120deg,#FF9A8B,#F27BA5 55%,#A08CF0)}
  .ps-head .ps-emoji{position:absolute;right:18pt;top:12pt;width:46pt;height:46pt;opacity:.9}
  .ps-head small{font-size:8pt;letter-spacing:.24em;font-weight:800;opacity:.9}
  .ps-head h1{font-family:var(--font-title);font-size:20pt;margin:2pt 0 4pt;font-weight:900}
  .ps-head p{margin:0;font-size:10pt;font-weight:700}
  .ps-sum{display:flex;gap:6pt;margin:8pt 0 10pt;flex-wrap:wrap}
  .ps-sum span{font-size:9pt;font-weight:800;padding:3pt 9pt;border-radius:999px;background:#F7F4F8}
  .ps-grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:8pt}
  .ps-team{break-inside:avoid;border-radius:14px;border:1.5pt solid var(--tc);overflow:hidden;background:#fff}
  .ps-team header{display:flex;align-items:center;justify-content:space-between;padding:6pt 10pt;background:var(--tc);color:#fff}
  .ps-team header b{font-family:var(--font-title);font-size:13pt;font-weight:900}
  .ps-team header span{font-size:8.5pt;font-weight:800;background:rgba(255,255,255,.28);border-radius:999px;padding:1pt 7pt}
  .ps-team ol{list-style:none;margin:0;padding:5pt 10pt 7pt;counter-reset:n}
  .ps-team li{counter-increment:n;display:flex;align-items:center;gap:6pt;padding:3.5pt 0;border-bottom:.6pt dotted #DDD;font-size:11pt;font-weight:800}
  .ps-team li:last-child{border-bottom:none}
  .ps-team li::before{content:counter(n);width:13pt;height:13pt;border-radius:50%;background:var(--tc);color:#fff;font-size:7.5pt;display:grid;place-items:center;flex:none;opacity:.85}
  .ps-team li .g{margin-left:auto;font-size:9pt}
  .ps-team li .g.b{color:#2F6FC4}.ps-team li .g.f{color:#C94F7E}
  .ps-team li.blank{color:#bbb;font-weight:500}
  .ps-pend{margin-top:10pt;break-inside:avoid;border:1.2pt dashed #E2C873;border-radius:12px;padding:6pt 10pt;background:#FFFBEE;font-size:9pt}
  .ps-pend b{font-size:9.5pt}
  .ps-foot{margin-top:8pt;text-align:right;font-size:8pt;color:#999}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- アイコン（線画） ---------- */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.tabbar a span{display:grid;place-items:center;height:26px}
.tabbar a span .ic{width:24px;height:24px}
.logo-mark svg{width:26px;height:26px}
.top-admin{display:inline-flex;align-items:center;gap:6px}
.section-title .ic,.box h3 .ic,.tbd h3 .ic{width:20px;height:20px;color:var(--peach)}
.gate .big .ic{width:52px;height:52px;color:var(--lav)}
.fact .ic{width:16px;height:16px;vertical-align:-.15em;margin-right:2px}
.art{width:100%;height:100%;display:block}
.next .emoji,.hero .emoji{width:96px;height:96px;font-size:0;color:#fff;opacity:.95}
.ev .ico{color:var(--dot,#FF9A8B);padding:9px}
.chip .art{display:inline-block;width:13px;height:13px;vertical-align:-2px;stroke-width:4}

.m .pin-btn{all:unset;cursor:pointer;margin-left:auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#C9C1CF;flex:none}
.m em + .pin-btn{margin-left:4px}
.m .pin-btn .ic{width:17px;height:17px}
.m .pin-btn:hover{background:#fff;color:var(--muted)}
.m .pin-btn.on{color:#fff;background:var(--ink)}
.m.pinned{background:#fff;border-color:rgba(59,50,65,.18)}
.sel-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:35;width:min(560px,calc(100% - 28px));padding:10px 14px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
.sel-banner .btn{background:#fff;color:var(--ink);box-shadow:none}
.edit-form{display:grid;gap:14px}
.edit-form textarea{font:inherit;font-size:1rem;font-weight:600;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:200px;resize:vertical;line-height:1.7}
.edit-form textarea:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 4px var(--lav-soft)}
.edit-form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.edit-form .two{grid-template-columns:1fr}}
.edit-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn.danger{color:#C94F7E;background:#fff}
#ef-datepick{color:transparent;width:52px!important;flex:none;cursor:pointer;position:relative}
#ef-datepick::-webkit-datetime-edit{display:none}
#ef-datepick::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:.6;cursor:pointer;background-position:center;background-size:22px}
@media print{.m .pin-btn{display:none}}
.still .view{animation:none}
.team,.pool,.pend-box{transition:border-color .4s ease}

  function theme(ev){

  function parseSchedule(text){
    return String(text || "").split(/\n/).map(function(l){ return l.trim(); }).filter(Boolean).reduce(function(out, line){
      var m = half(line).match(/^(\d{1,2}[:：]\d{2}(?:\s*[〜~\-]\s*(?:\d{1,2}[:：]\d{2})?)?\s*(?:頃)?)\s*(.*)$/);
      if (m) out.push({ tm: m[1].replace(/\s/g, ""), tx: line.slice(line.length - m[2].length) });
      else if (out.length) out[out.length - 1].tx += " " + line;
      else out.push({ tm: "", tx: line });
      return out;
    }, []);
  }

  async function tryLogin(next){

    if ((await hashPassword(pw)) !== S.passwordHash) { err.textContent = "パスワードが違います"; return; }

  /* ---------- チーム分け ---------- */
  var TEAM_COLORS = ["#FF8A80", "#F6C453", "#5CC9A7", "#6BB8F0", "#A08CF0", "#F27BA5", "#F6A04D", "#4FC3C7", "#9CCC65", "#B39DDB", "#FFB74D", "#90A4AE"];
  var TEAM_NAMES = ["レッド", "イエロー", "グリーン", "ブルー", "パープル", "ピンク", "オレンジ", "ターコイズ", "ライム", "ラベンダー", "サンセット", "グレー"];
  var draft = null, selected = null, busyTeams = false, adminTab = "teams";
  function present(evId){ var a = S.att[evId] || {}; return S.roster.filter(function(r){ return a[r.id] === "present"; }); }
  function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // 男女それぞれ均等に、人数も揃うように配る
  // base: 固定（📌）した人を残したチーム。固定していない人だけを、人数と男女比がそろうように配り直す
  function autoTeams(people, n, base){
    var teams = []; for (var i = 0; i < n; i++) {
      var b0 = base && base[i];
      teams.push({ name: b0 ? b0.name : TEAM_NAMES[i % TEAM_NAMES.length], color: b0 ? b0.color : TEAM_COLORS[i % TEAM_COLORS.length], members: b0 ? (b0.pinned || []).slice() : [], pinned: b0 ? (b0.pinned || []).slice() : [] });
    }
    var pinnedAll = {}; teams.forEach(function(t){ t.pinned.forEach(function(id){ pinnedAll[id] = 1; }); });
    people = people.filter(function(p){ return !pinnedAll[p.id]; });
    var by = { 女: [], 男: [], "": [] };
    shuffle(people).forEach(function(p){ by[p.gender === "女" || p.gender === "男" ? p.gender : ""].push(p); });
    var gcount = function(t, g){ return t.members.filter(function(id){ var p = S.roster.find(function(r){ return r.id === id; }); return p && (p.gender || "") === g; }).length; };
    ["女", "男", ""].forEach(function(g){
      by[g].forEach(function(p){
        var best = shuffle(teams).sort(function(a, b){ return (a.members.length - b.members.length) || (gcount(a, g) - gcount(b, g)); })[0];
        best.members.push(p.id);
      });
    });
    return { teams: teams, pool: [] };
  }
  function emptyTeams(people, n){
    var teams = []; for (var i = 0; i < n; i++) teams.push({ name: TEAM_NAMES[i % TEAM_NAMES.length], color: TEAM_COLORS[i % TEAM_COLORS.length], members: [], pinned: [] });
    return { teams: teams, pool: people.map(function(p){ return p.id; }) };
  }
  function person(id){ return S.roster.find(function(r){ return r.id === id; }); }
  function chipHtml(id, evId, inTeam){
    var p = person(id), a = S.att[evId] || {}, st = a[id] || "pending";
    var g = p && p.gender === "男" ? "boy" : p && p.gender === "女" ? "girl" : "";
    var cls = "m" + (g ? " " + g : "") + (selected === id ? " sel" : "") + (st === "absent" ? " gone" : "") + (st === "pending" && !inTeam ? " pend" : "");
    var tag = st === "absent" ? "<em>欠席</em>" : st === "pending" ? "<em>未入力</em>" : "";
    var pinned = inTeam && draft.teams.some(function(t){ return (t.pinned || []).indexOf(id) >= 0; });
    return '<div class="' + cls + (pinned ? ' pinned' : '') + '" draggable="true" data-pid="' + id + '"><i>' + (g === "boy" ? "♂" : g === "girl" ? "♀" : "") + '</i><span>' + esc(p ? p.name : "（名簿から削除）") + '</span>' + (inTeam ? tag + '<button type="button" class="pin-btn' + (pinned ? ' on' : '') + '" data-pin="' + id + '" title="' + (pinned ? '固定を外す' : 'このチームに固定（シャッフルしても動かない）') + '" aria-label="固定">' + I('pin2') + '</button>' : "") + '</div>';
  }
  function teamStats(t){
    var b = 0, g = 0; t.members.forEach(function(id){ var p = person(id); if (p && p.gender === "男") b++; else if (p && p.gender === "女") g++; });
    return t.members.length + '名' + (b || g ? '（♂' + b + ' ♀' + g + '）' : '');
  }
  function viewTeams(evId){
    if (!isAdmin()) return viewGate("#/teams" + (evId ? "/" + evId : ""));
    var evs = sortedEvents();
    if (!evId && evs.length) evId = (upcoming()[0] || evs[0]).id;
    var ev = S.events.find(function(e){ return e.id === evId; });
    var h = '<div class="view"><h1 class="page">主催者メニュー</h1><p class="sub">チーム分けと、名簿の男女の設定ができます</p>'
      + '<div class="seg no-print"><button data-atab="teams" class="' + (adminTab === "teams" ? "on" : "") + '">' + I('users') + ' チーム分け</button><button data-atab="gender" class="' + (adminTab === "gender" ? "on" : "") + '">' + I('person') + ' 名簿の男女</button></div>';
    if (!S.hasTeams || !S.hasGender) h += '<div class="warn">' + I('alert') + ' データベースの準備がまだです（SQLを1回実行してください）。それまでは' + (!S.hasGender ? '男女の設定と' : '') + (!S.hasTeams ? 'チームの保存' : '') + 'ができません。</div>';
    if (adminTab === "gender") return h + viewGender() + '</div>';
    if (!ev) return h + '<div class="card empty">行事がありません</div></div>';
    var ppl = present(ev.id), saved = S.teams[ev.id];
    if (!draft || draft.evId !== ev.id) draft = saved && saved.teams ? { evId: ev.id, teams: JSON.parse(JSON.stringify(saved.teams)), pool: (saved.pool || []).slice(), dirty: false } : { evId: ev.id, teams: [], pool: [], dirty: false };
    // 保存後に出席になった人は「未割り当て」に入れる
    var placed = {}; draft.teams.forEach(function(t){ t.members.forEach(function(id){ placed[id] = 1; }); }); draft.pool.forEach(function(id){ placed[id] = 1; });
    ppl.forEach(function(p){ if (!placed[p.id] && draft.teams.length) draft.pool.push(p.id); });
    var b = ppl.filter(function(p){ return p.gender === "男"; }).length, g = ppl.filter(function(p){ return p.gender === "女"; }).length, u = ppl.length - b - g;
    var defN = draft.teams.length || Math.max(2, Math.min(12, Math.round(ppl.length / 4) || 2));
    h += '<div class="card panel no-print"><div class="row-flex"><label class="field" style="flex:1;min-width:220px">行事<select id="teamEv">' + evs.map(function(e){ return '<option value="' + e.id + '"' + (e.id === ev.id ? ' selected' : '') + '>' + esc(e.name) + '（' + esc(fmtDate(e)) + '）</option>'; }).join("") + '</select></label>'
      + '<label class="field">チーム数<input type="number" id="teamN" min="2" max="12" value="' + defN + '" style="width:110px"></label>'
      + '<button class="btn primary" id="autoBtn">' + I('dice') + ' 自動で分ける</button><button class="btn" id="manualBtn">' + I('hand') + ' 手動で分ける</button></div>'
      + '<div class="stats"><span class="stat">出席 ' + ppl.length + '名</span><span class="stat b">♂ 男性 ' + b + '名</span><span class="stat g">♀ 女性 ' + g + '名</span>' + (u ? '<span class="stat u">未設定 ' + u + '名</span>' : '') + '</div>'
      + (u ? '<div class="warn">男女が未設定の人が ' + u + '名います。「名簿の男女」で設定すると、男女比もそろえて分けられます。</div>' : '') + '</div>';
    if (!draft.teams.length) return h + '<div class="card empty" style="margin-top:14px">「自動で分ける」でランダムに作るか、「手動で分ける」で空のチームから自分で振り分けられます。</div></div>';
    h += '<div class="row-flex no-print" style="margin-top:16px;justify-content:space-between"><span class="hint" style="margin:0">' + I('info') + ' 名前を押してから<b>別の人の名前</b>を押すと入れ替え（同じチーム内なら順番の入れ替え）、<b>チームの空いた所</b>を押すと移動。' + I('pin2') + 'で固定すると、シャッフルしても動きません。パソコンはドラッグでも動かせます。</span>'
      + '<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="reshuffleBtn">' + I('shuffle') + ' もう一度シャッフル</button><button class="btn sm" id="printBtn">' + I('print') + ' 印刷</button><button class="btn sm primary" id="saveBtn">' + I('save') + ' ' + (draft.dirty ? '保存する' : '保存済み') + '</button></span></div>';
    var inTeam = {}; draft.teams.forEach(function(t){ t.members.forEach(function(id){ inTeam[id] = 1; }); });
    var att = S.att[ev.id] || {};
    var pend = S.roster.filter(function(p){ return !att[p.id] && !inTeam[p.id] && draft.pool.indexOf(p.id) < 0; });
    if (selected) { var sp = person(selected); h += '<div class="sel-banner no-print">「' + esc(sp ? sp.name : '') + '」を選択中 — 入れ替えたい人の名前、または移動先のチームを押してください <button class="btn sm" data-unsel>やめる</button></div>'; }
    h += '<div class="board">' + draft.teams.map(function(t, i){
      return '<div class="team' + (selected ? ' target' : '') + '" data-team="' + i + '" style="--tc:' + t.color + '"><div class="team-head"><span class="team-name"><span class="team-dot">' + (i + 1) + '</span>' + esc(t.name) + '</span><span class="team-count">' + teamStats(t) + '</span></div><div class="members">' + (t.members.length ? t.members.map(function(id){ return chipHtml(id, ev.id, true); }).join("") : '<span class="hint" style="margin:0">ここに名前を入れてください</span>') + '</div></div>';
    }).join("") + '</div>';
    h += '<div class="pool' + (selected ? ' target' : '') + '" data-team="pool"><div class="box-head"><span><b>未割り当て</b><small>出席だけど、まだチームに入っていない人</small></span><span class="team-count">' + draft.pool.length + '名</span></div><div class="members">' + (draft.pool.length ? draft.pool.map(function(id){ return chipHtml(id, ev.id); }).join("") : '<span class="hint" style="margin:0">全員チームに入っています</span>') + '</div></div>';
    h += '<div class="pend-box' + (selected ? ' target' : '') + '" data-team="pending"><div class="box-head"><span><b>出欠が未入力の人</b><small>あとから参加するかもしれない人。参加が決まったら、名前を押してチームへ入れられます</small></span><span class="team-count">' + pend.length + '名</span></div><div class="members">' + (pend.length ? pend.map(function(p){ return chipHtml(p.id, ev.id); }).join("") : '<span class="hint" style="margin:0">未入力の人はいません</span>') + '</div></div>';

  function viewGender(){
    if (!S.roster.length) return '<div class="card empty" style="margin-top:14px">名簿が未登録です（出欠アプリの主催者画面で登録してください）</div>';

        return '<div class="g-row"><span class="nm">' + esc(p.name) + '</span><span class="g-btns"><button class="boy' + (p.gender === "男" ? " on" : "") + '" data-g="男" data-pid="' + p.id + '">男</button><button class="girl' + (p.gender === "女" ? " on" : "") + '" data-g="女" data-pid="' + p.id + '">女</button></span></div>';
      }).join("") + '</div>';
  }
  function printSheet(ev, pend){
    var th = theme(ev), n = draft.teams.length, max = Math.max.apply(null, draft.teams.map(function(t){ return t.members.length; }).concat([0]));
    var cols = n <= 4 ? 2 : 3, rows = Math.max(max, 4);
    var ppl = present(ev.id), b = ppl.filter(function(p){ return p.gender === "男"; }).length, g = ppl.filter(function(p){ return p.gender === "女"; }).length;
    var d = new Date();
    return '<section class="print-sheet"><div class="ps-head"><span class="ps-emoji">' + th.svg + '</span><small>TEAM LIST</small><h1>' + esc(ev.name) + '</h1><p>' + esc(fmtDate(ev)) + (ev.time ? '　' + esc(ev.time) : '') + (ev.location ? '　｜　' + esc(ev.location) : '') + '</p></div>'
      + '<div class="ps-sum"><span>出席 ' + ppl.length + '名</span><span>' + n + 'チーム</span>' + (b || g ? '<span style="color:#2F6FC4">♂ ' + b + '名</span><span style="color:#C94F7E">♀ ' + g + '名</span>' : '') + '</div>'
      + '<div class="ps-grid" style="--cols:' + cols + '">' + draft.teams.map(function(t, i){
        var lis = t.members.map(function(id){ var p = person(id); var gg = p && p.gender === "男" ? '<span class="g b">♂</span>' : p && p.gender === "女" ? '<span class="g f">♀</span>' : ''; return '<li>' + esc(p ? p.name : '') + gg + '</li>'; });
        for (var k = t.members.length; k < rows; k++) lis.push('<li class="blank">　</li>');
        return '<div class="ps-team" style="--tc:' + t.color + '"><header><b>' + (i + 1) + '. ' + esc(t.name) + '</b><span>' + teamStats(t) + '</span></header><ol>' + lis.join("") + '</ol></div>';
      }).join("") + '</div>'
      + (pend.length ? '<div class="ps-pend"><b>出欠未入力（参加が決まったら空いている欄に書き足し）</b>：' + pend.map(function(p){ return esc(p.name); }).join("、") + '</div>' : '')
      + '<div class="ps-foot">作成 ' + d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '　親睦会ポータル</div></section>';
  }
  // 入れ替え・移動を、名前がゆっくり新しい場所へすべるように見せる
  function flipRender(moved){
    var before = {};
    document.querySelectorAll(".board .m[data-pid], .pool .m[data-pid], .pend-box .m[data-pid]").forEach(function(el){ before[el.dataset.pid] = el.getBoundingClientRect(); });
    render();
    if (reduceMotion) return;
    document.querySelectorAll(".board .m[data-pid], .pool .m[data-pid], .pend-box .m[data-pid]").forEach(function(el){
      var b = before[el.dataset.pid], a = el.getBoundingClientRect();
      var hit = moved && moved.indexOf(el.dataset.pid) >= 0;
      if (b) {
        var dx = b.left - a.left, dy = b.top - a.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          el.animate([{ transform: "translate(" + dx + "px," + dy + "px)", zIndex: 5 }, { transform: "none", zIndex: 5 }], { duration: hit ? 1100 : 900, easing: "cubic-bezier(.33,0,.15,1)" });
        }
      } else if (hit) {
        el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, easing: "ease-out" });
      }
      if (hit) el.animate([{ backgroundColor: "#FFF1EC" }, { backgroundColor: "#FFF1EC", offset: .6 }, { backgroundColor: "" }], { duration: 2000, easing: "ease-out" });
    });
  }
  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function where(pid){
    for (var i = 0; i < draft.teams.length; i++) { var k = draft.teams[i].members.indexOf(pid); if (k >= 0) return { list: draft.teams[i].members, i: k, team: i }; }
    var j = draft.pool.indexOf(pid); if (j >= 0) return { list: draft.pool, i: j, team: "pool" };
    return null; // 出欠未入力の枠
  }
  function unpin(pid){ draft.teams.forEach(function(t){ t.pinned = (t.pinned || []).filter(function(x){ return x !== pid; }); }); }
  // 2人の場所を入れ替える（同じチーム内なら順番の入れ替えになる）
  function swap(a, b){
    var wa = where(a), wb = where(b);
    if (!wa && !wb) { selected = b; render(); return; }
    if (wa && wb) { wa.list[wa.i] = b; wb.list[wb.i] = a; if (wa.team !== wb.team) { unpin(a); unpin(b); } }
    else if (wa) { wa.list[wa.i] = b; unpin(a); }
    else { wb.list[wb.i] = a; unpin(b); }
    draft.dirty = true; selected = null; flipRender([a, b]);
  }
  // b の前に a を差し込む（ドラッグ用）
  function insertBefore(a, b){
    if (a === b) return;
    var wb0 = where(b); if (!wb0) { moveTo(a, "pending"); return; }
    var wa = where(a); if (wa) { wa.list.splice(wa.i, 1); if (wa.team !== wb0.team) unpin(a); }
    var wb = where(b); wb.list.splice(wb.i, 0, a);
    draft.dirty = true; selected = null; flipRender([a]);
  }
  function moveTo(pid, target){
    var w0 = where(pid); if (!w0 || w0.team !== (target === "pool" || target === "pending" ? target : +target)) unpin(pid);
    draft.teams.forEach(function(t){ t.members = t.members.filter(function(x){ return x !== pid; }); });
    draft.pool = draft.pool.filter(function(x){ return x !== pid; });
    if (target === "pool") draft.pool.push(pid); else if (target !== "pending") draft.teams[+target].members.push(pid);
    draft.dirty = true; selected = null; flipRender([pid]);
  }
  async function saveTeams(){
    if (!S.hasTeams) { toast("先にSQLを実行してください"); return; }
    busyTeams = true;
    var payload = { event_id: draft.evId, team_count: draft.teams.length, data: { teams: draft.teams, pool: draft.pool }, updated_at: new Date().toISOString() };
    var res = await sb.from("ennokai_teams").upsert(payload, { onConflict: "event_id" });
    busyTeams = false;
    if (res.error) { toast("保存できませんでした"); return; }
    S.teams[draft.evId] = payload.data; draft.dirty = false; toast("チームを保存しました"); render();
  }

  /* ---------- ルーティング ---------- */
  function route(){ return location.hash.replace(/^#\/?/, "").split("/"); }
  var lastRoute = null;
  function render(){
    var routeKey = location.hash;
    app.classList.toggle("still", routeKey === lastRoute);
    lastRoute = routeKey;
    if (!S.loaded) { app.innerHTML = '<div class="empty">読み込み中…</div>'; return; }
    var r = route(), tab = r[0] || "home";
    setTab(tab === "event" || tab === "edit" ? "home" : tab);
    if (tab === "calendar") app.innerHTML = viewCalendar();
    else if (tab === "event") app.innerHTML = viewEvent(r[1]);
    else if (tab === "checkin") { if (!app.querySelector(".full-embed")) app.innerHTML = viewCheckin(); }
    else if (tab === "teams") app.innerHTML = viewTeams(r[1]);
    else if (tab === "edit") app.innerHTML = viewEdit(r[1]);
    else if (tab === "admin") app.innerHTML = viewGate("#/teams");
    else app.innerHTML = viewHome();
  }
  window.addEventListener("hashchange", function(){ selected = null; window.scrollTo(0, 0); render(); });

  /* ---------- 操作 ---------- */
  document.addEventListener("click", async function(e){
    var t;
    if ((t = e.target.closest("[data-checkin]"))) { openCheckin(); return; }
    if ((t = e.target.closest("[data-cal]"))) {
      var d = +t.dataset.cal;
      if (d === 0) { var n = new Date(); calY = n.getFullYear(); calM = n.getMonth() + 1; }
      else { calM += d; if (calM < 1) { calM = 12; calY--; } if (calM > 12) { calM = 1; calY++; } }
      render(); return;
    }
    if (e.target.closest("#adminBtn")) {
      if (isAdmin()) { if (location.hash.indexOf("#/teams") === 0) { try { sessionStorage.removeItem(SESSION_KEY); } catch(x){} toast("主催者モードを終了しました"); location.hash = "#/"; render(); } else location.hash = "#/teams"; }
      else location.hash = "#/admin";
      return;
    }
    if ((t = e.target.closest("#gateGo"))) { tryLogin(t.dataset.next); return; }
    if ((t = e.target.closest("[data-atab]"))) { adminTab = t.dataset.atab; render(); return; }
    if ((t = e.target.closest("[data-g]"))) {
      if (!S.hasGender) { toast("先にSQLを実行してください"); return; }
      var p = person(t.dataset.pid), g = p.gender === t.dataset.g ? null : t.dataset.g, old = p.gender;
      p.gender = g; render();
      var res = await sb.from("ennokai_roster").update({ gender: g }).eq("id", p.id);
      if (res.error) { p.gender = old; render(); toast("保存できませんでした"); }
      return;
    }
    if (e.target.closest("#autoBtn") || e.target.closest("#reshuffleBtn") || e.target.closest("#manualBtn")) {
      var n = Math.max(2, Math.min(12, +document.getElementById("teamN").value || 2));
      var ppl = present(draft.evId);
      if (ppl.length < n) { toast("出席者よりチーム数が多いです"); return; }
      var keepPins = !e.target.closest("#manualBtn") && draft.teams.length === n && draft.teams.some(function(t){ return (t.pinned || []).length; });
      var r = e.target.closest("#manualBtn") ? emptyTeams(ppl, n) : autoTeams(ppl, n, keepPins ? draft.teams : null);
      var hadTeams = draft.teams.length === r.teams.length;
      draft.teams = r.teams; draft.pool = r.pool; draft.dirty = true; selected = null;
      if (hadTeams) flipRender([]); else render();
      toast(e.target.closest("#manualBtn") ? n + "チームの枠を作りました。名前を押して振り分けてください" : keepPins ? "固定した人はそのままで、ほかの人をシャッフルしました" : n + "チームに分けました（保存を押すと確定します）");
      return;
    }
    if (e.target.closest("[data-unsel]")) { selected = null; render(); return; }
    if (e.target.closest("[data-saveev]")) { saveEvent(); return; }
    if ((t = e.target.closest("[data-delev]"))) {
      var dv = S.events.find(function(x){ return x.id === t.dataset.delev; });
      if (!dv || !window.confirm("「" + dv.name + "」を削除します。この行事の出欠記録とチーム分けも消えます。よろしいですか？")) return;
      var dr = await sb.from("ennokai_events").delete().eq("id", dv.id);
      if (dr.error) { toast("削除できませんでした"); return; }
      toast("削除しました"); await load(); location.hash = "#/"; return;
    }
    if (e.target.closest("#saveBtn")) { saveTeams(); return; }
    if (e.target.closest("#printBtn")) { window.print(); return; }
    if ((t = e.target.closest("[data-pin]"))) {
      var pid0 = t.dataset.pin, w = where(pid0); if (!w || w.team === "pool") return;
      var tm = draft.teams[w.team]; tm.pinned = tm.pinned || [];
      if (tm.pinned.indexOf(pid0) >= 0) tm.pinned = tm.pinned.filter(function(x){ return x !== pid0; }); else tm.pinned.push(pid0);
      draft.dirty = true; render(); return;
    }
    if ((t = e.target.closest(".m[data-pid]"))) {
      var pid = t.dataset.pid;
      if (selected && selected !== pid) { swap(selected, pid); return; }
      selected = selected === pid ? null : pid; render(); return;
    }
    if ((t = e.target.closest("[data-team]")) && selected) { moveTo(selected, t.dataset.team); return; }
  });
  document.addEventListener("change", function(e){
    if (e.target.id === "ef-datepick" && e.target.value) { var dp = e.target.value.split("-"); document.getElementById("ef-date").value = (+dp[0]) + "年" + (+dp[1]) + "月" + (+dp[2]) + "日"; }
    if (e.target.id === "teamEv") { draft = null; selected = null; location.hash = "#/teams/" + e.target.value; }
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Enter" && e.target.id === "gatePw") tryLogin(document.getElementById("gateGo").dataset.next); });
  // パソコン用: ドラッグで移動
  document.addEventListener("dragstart", function(e){ var m = e.target.closest && e.target.closest(".m[data-pid]"); if (m) { e.dataTransfer.setData("text/plain", m.dataset.pid); e.dataTransfer.effectAllowed = "move"; } });
  document.addEventListener("dragover", function(e){ var z = e.target.closest && e.target.closest("[data-team]"); if (z) { e.preventDefault(); z.classList.add("drop"); } });
  document.addEventListener("dragleave", function(e){ var z = e.target.closest && e.target.closest("[data-team]"); if (z) z.classList.remove("drop"); });
  document.addEventListener("drop", function(e){
    var z = e.target.closest && e.target.closest("[data-team]"); if (!z) return; e.preventDefault();
    var pid = e.dataTransfer.getData("text/plain"); if (!pid) return;
    var onChip = e.target.closest(".m[data-pid]");
    if (onChip && onChip.dataset.pid !== pid && z.dataset.team !== "pending") insertBefore(pid, onChip.dataset.pid); else moveTo(pid, z.dataset.team);
  });
  window.addEventListener("beforeunload", function(e){ if (draft && draft.dirty) { e.preventDefault(); e.returnValue = ""; } });

  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = I(el.dataset.ic); });
  render();
  load().then(render).catch(function(){ app.innerHTML = '<div class="card empty">読み込みに失敗しました。通信を確認して再読み込みしてください。</div>'; });
})();
</script>
</body>
</html>
