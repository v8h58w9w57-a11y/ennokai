<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F2">
<title>親睦会ポータル</title>
<link rel="icon" type="image/png" href="../icon-192x192-any.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Old+Mincho:wght@700;900&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7F2; --card:#FFFFFF; --card2:#FBF8FA; --glass:rgba(255,255,255,.8); --topbg:rgba(255,247,242,.62); --ink2:#4E4555; --inv:#3B3241; --inv-ink:#fff; --g1:#FFE6DF; --g2:#EEE9FF; --au1:#FFB3A6; --au2:#C4B5FF; --au3:#FFC2DA; --au4:#B9EBDC; --ink:#3B3241; --muted:#6E6475; --line:rgba(59,50,65,.09);
  --peach:#FF9A8B; --peach-soft:#FFE3DD; --mint:#5CC9A7; --mint-soft:#DDF5EC; --lav:#A08CF0; --lav-soft:#ECE7FF;
  --sky:#6BB8F0; --sky-soft:#E0F0FC; --lemon:#F6C453; --lemon-soft:#FFF3D3; --rose:#F27BA5; --rose-soft:#FFE1EC;
  --boy:#5B9BF0; --girl:#F27BA5;
  --shadow:0 18px 40px -26px rgba(90,60,90,.45);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --font-title:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:
  radial-gradient(600px 380px at 0% -5%, var(--g1) 0%, transparent 70%),
  radial-gradient(600px 420px at 105% 0%, var(--g2) 0%, transparent 65%),
  var(--bg);
  min-height:100vh; line-height:1.7; -webkit-font-smoothing:antialiased; word-break:auto-phrase; padding-bottom:calc(84px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- header / nav ---------- */
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;
  background:var(--topbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--peach),var(--lav));box-shadow:0 8px 18px -8px rgba(255,120,120,.7)}
.logo b{font-family:var(--font-title);font-size:1.0625rem;font-weight:900;letter-spacing:.04em}
.logo small{display:block;font-size:.6875rem;letter-spacing:.24em;color:var(--muted);font-weight:700;margin-top:-4px}
.top-admin{border:none;background:var(--card);border-radius:999px;padding:8px 14px;font-size:.8125rem;font-weight:800;box-shadow:var(--shadow);cursor:pointer}
.top-admin.on{background:var(--inv);color:var(--inv-ink)}
.tabbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;border-radius:24px;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 40px -18px rgba(70,40,80,.5);border:1px solid var(--line)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:58px;padding:6px 8px;border-radius:18px;text-decoration:none;font-size:.6875rem;font-weight:800;color:var(--muted);transition:background .2s,color .2s}
.tabbar a span{font-size:1.375rem;line-height:1.2}
.tabbar a.on{background:linear-gradient(135deg,var(--peach-soft),var(--lav-soft));color:var(--ink)}

main{max-width:1000px;margin:0 auto;padding:24px 16px 32px}
.view{animation:fadeUp .45s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.page{font-family:var(--font-title);font-size:1.75rem;font-weight:900;margin:.2em 0 .1em;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.9375rem;margin:0 0 16px}
.card{background:var(--glass);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.section-title{font-family:var(--font-title);font-weight:900;font-size:1.0625rem;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.empty{color:var(--muted);text-align:center;padding:32px 10px;font-size:.9375rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;border-radius:999px;padding:12px 20px;font-weight:800;font-size:.9375rem;background:var(--card);box-shadow:var(--shadow);text-decoration:none;min-height:44px;touch-action:manipulation}
.btn.primary{color:#fff;background:linear-gradient(120deg,var(--peach),var(--rose) 55%,var(--lav))}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;min-height:36px;font-size:.8125rem}
.btn:active{transform:scale(.97)}

/* ---------- home ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.next{position:relative;overflow:hidden;padding:24px 24px 24px;margin-top:6px;color:#fff;border:none;
  background:linear-gradient(130deg,var(--c1,#FF9A8B),var(--c2,#A08CF0))}
.next::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.18)}
.next .tag{display:inline-block;font-size:.6875rem;font-weight:800;letter-spacing:.14em;background:rgba(255,255,255,.25);padding:4px 12px;border-radius:999px}
.next .emoji{position:absolute;right:22px;bottom:12px;font-size:4.6rem;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.next h2{font-family:var(--font-title);font-weight:900;font-size:1.75rem;margin:10px 0 4px;line-height:1.35;max-width:78%}
.next .meta{font-size:.9375rem;opacity:.95;display:flex;flex-wrap:wrap;gap:4px 14px}
.next .count{margin-top:14px;display:flex;align-items:baseline;gap:6px;font-weight:800}
.next .count b{font-family:var(--font-title);font-size:2.5rem;line-height:1}
.next .actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.next .actions .btn{background:var(--card);color:var(--ink)}
.next .actions .btn.glass{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ev{display:flex;gap:14px;align-items:center;padding:16px 16px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.ev:hover{transform:translateY(-3px)}
.ev .ico{flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:1.75rem;background:var(--soft,#FFE3DD)}
.ev .t{font-weight:800;line-height:1.4}
.ev .d{font-size:.8125rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.6875rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--mint-soft);color:#187356}
.pill.wait{background:var(--lemon-soft);color:#8A6508}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.cal-head h2{font-family:var(--font-title);font-size:1.375rem;font-weight:900;margin:0}
.cal-head h2 small{display:block;font-family:inherit;font-size:.75rem;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.cal-nav{display:flex;gap:8px}
.cal-nav button{min-width:40px;height:40px;padding:0 12px;border-radius:14px;border:none;background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font-size:1.0625rem;font-weight:800;font-family:inherit}
.cal-nav button[data-cal="0"]{font-size:.8125rem}
.cal{padding:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:.75rem;font-weight:800;color:var(--muted);padding:4px 0}
.dow.sun{color:#E0577A}.dow.sat{color:#4A86D8}
.day{min-width:0;min-height:88px;border-radius:12px;padding:4px;background:var(--card2);border:1.5px solid transparent;display:flex;flex-direction:column;gap:4px;position:relative}
.day.has{background:color-mix(in srgb,var(--dot,#FF9A8B) 16%,var(--card2));border-color:color-mix(in srgb,var(--dot,#FF9A8B) 45%,transparent);cursor:pointer}
.day.out{opacity:.3}
.day.past:not(.today){opacity:.6}
.day.today{border-color:var(--peach)}
.day .n{font-size:.75rem;font-weight:800;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;line-height:1}
.day.today .n{background:var(--peach);color:#fff}
.day.sun .n{color:#E0577A}.day.sat .n{color:#4A86D8}
.day.today.sun .n,.day.today.sat .n{color:#fff}
.chip{display:flex;align-items:flex-start;gap:4px;font-size:.75rem;font-weight:800;line-height:1.3;padding:4px 6px;border-radius:8px;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--dot,#FF9A8B) 30%,var(--card));box-shadow:inset 3px 0 0 var(--dot,#FF9A8B);min-width:0}
.chip .art{width:14px;height:14px;flex:none;color:color-mix(in srgb,var(--dot) 70%,var(--ink));margin-top:1px}
.chip .tx{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.chip.mt{background:transparent;border:1.5px dashed var(--dot,#A08CF0);box-shadow:none;color:var(--ink2,var(--ink));padding:2px 4px;font-size:.6875rem}
.chip.mt .ic{width:12px;height:12px;flex:none;margin-top:1px;color:var(--dot,#A08CF0)}
.cal-legend{display:flex;gap:16px;justify-content:flex-end;margin-top:12px;font-size:.75rem;font-weight:800;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{display:inline-block;width:18px;height:10px;border-radius:5px}
.lg-ev{background:color-mix(in srgb,#FF9A8B 45%,var(--card));box-shadow:inset 3px 0 0 #FF9A8B}
.lg-mt{border:1.5px dashed #A08CF0}
/* カレンダー画面は横幅いっぱい・高さも画面に合わせる */
main:has(.calv){max-width:1600px}
.calv .day{min-height:max(88px,calc((100dvh - 330px) / 6))}
@media (min-width:1100px){
  .calv{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
  .cal-side{position:sticky;top:88px;max-height:calc(100dvh - 200px);overflow:auto;border-radius:24px}
  .cal-side .agc{margin-top:0}
  .calv .cal-head{margin-bottom:12px}
}
@media (min-width:1400px){.calv{grid-template-columns:minmax(0,1fr) 400px}}
/* この月の予定（一覧） */
.agc{margin-top:16px;padding:16px}
.agc h3{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:1.0625rem}
.agc h3 .ic{width:20px;height:20px;color:var(--peach)}
.agc h3 .cnt{margin-left:auto;font-size:.75rem;font-weight:800;color:var(--muted)}
.ag-g{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent);scroll-margin:96px;border-radius:12px;transition:background-color .2s}
.ag-g:first-of-type{border-top:none;padding-top:0}
.ag-g.flash{animation:agFlash 1.4s ease-out}
@keyframes agFlash{0%,40%{background:color-mix(in srgb,var(--peach) 22%,transparent)}100%{background:transparent}}
.ag-date{text-align:center;line-height:1.1;padding-top:4px}
.ag-date b{display:block;font-size:1.75rem;font-weight:900;font-family:var(--font-title)}
.ag-date small{font-size:.75rem;font-weight:800;color:var(--muted)}
.ag-date.sun b,.ag-date.sun small{color:#E0577A}.ag-date.sat b,.ag-date.sat small{color:#4A86D8}
.ag-items{display:flex;flex-direction:column;gap:8px;min-width:0}
.ag-it{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--dot,#FF9A8B) 18%,var(--card));border:1.5px solid color-mix(in srgb,var(--dot,#FF9A8B) 40%,transparent);min-height:56px;transition:transform .15s ease-out}
.ag-it:active{transform:scale(.98)}
.ag-it.mt{background:transparent;border-style:dashed}
.ag-it.past{opacity:.6}
.ag-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--dot,#FF9A8B);color:#fff}
.ag-ic .art{width:26px;height:26px}
.ag-ic .ic{width:22px;height:22px}
.ag-it.mt .ag-ic{background:color-mix(in srgb,var(--dot,#A08CF0) 22%,var(--card));color:var(--dot,#A08CF0)}
.ag-tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.ag-k{font-size:.6875rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.ag-t{font-size:1rem;font-weight:900;line-height:1.3;word-break:auto-phrase}
.ag-m{font-size:.75rem;font-weight:700;color:var(--ink2,var(--muted));display:flex;flex-wrap:wrap;gap:4px 12px}
.ag-m .ic{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.ag-badge{flex:none;font-size:.75rem;font-weight:900;padding:4px 8px;border-radius:999px;background:var(--card);color:var(--ink);white-space:nowrap}
.ag-badge.hot{background:var(--peach);color:#fff}
.ag-empty{text-align:center;padding:16px 0 4px;color:var(--muted);font-weight:700;font-size:.875rem}
.ag-empty button{margin-top:12px;min-height:44px;padding:8px 16px;border-radius:14px;border:none;background:var(--card2);color:var(--ink);font:inherit;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.ag-empty button .ic{width:16px;height:16px;vertical-align:-3px;margin-left:4px}
@media (max-width:620px){
  main:has(.calv){padding-left:8px;padding-right:8px}
  .calv .cal-head{padding:0 8px}
  .cal{padding:6px 4px}.cal-grid{gap:3px}
  .calv .day{min-height:max(72px,calc((100dvh - 330px) / 6))}
  .day{min-height:72px;padding:2px;border-radius:10px;gap:2px;border-width:1px}
  .day .n{width:22px;height:22px;font-size:.6875rem}
  .chip{padding:2px 1px 2px 3px;font-size:.6875rem;line-height:1.25;letter-spacing:-.02em;border-radius:6px;box-shadow:inset 2px 0 0 var(--dot,#FF9A8B)}
  .chip .tx{-webkit-line-clamp:3}
  .cal .chip .art{display:none}
  .chip.mt{padding:1px;font-size:.6875rem;justify-content:center;text-align:center}
  .chip.mt .ic{display:none}
  .ag-g{grid-template-columns:40px minmax(0,1fr);gap:8px}
  .ag-date b{font-size:1.5rem}
  .ag-it{gap:10px;padding:10px}
}
.tbd{margin-top:14px;padding:16px 16px}
.tbd h3{margin:0 0 8px;font-size:.9375rem}

/* ---------- event detail ---------- */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:800;font-size:.8125rem;color:var(--muted);margin-bottom:10px}
.hero{position:relative;overflow:hidden;padding:32px 28px 24px;border:none;color:#fff;background:linear-gradient(130deg,var(--c1),var(--c2))}
.hero .emoji{position:absolute;right:20px;top:18px;font-size:5rem;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero h1{font-family:var(--font-title);font-weight:900;font-size:1.75rem;line-height:1.35;margin:6px 0 12px;max-width:80%;position:relative}
.facts{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.fact{background:rgba(255,255,255,.24);border-radius:14px;padding:8px 14px;font-size:.9375rem;font-weight:700}
.fact small{display:block;font-size:.6875rem;letter-spacing:.14em;opacity:.85}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
@media (max-width:480px){.tl::before{left:83px}.tl li{grid-template-columns:72px 1fr;gap:20px}.tl li::before{left:78px}.tl .tm{font-size:.6875rem}}
.box{padding:20px 24px}
.box h3{margin:0 0 12px;font-family:var(--font-title);font-size:1.0625rem;font-weight:900;display:flex;align-items:center;gap:8px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:103px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--peach-soft),var(--lav-soft))}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:32px;padding:8px 0;position:relative}
.tl li::before{content:"";position:absolute;left:98px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--peach)}
.tl li:nth-child(3n+2)::before{border-color:var(--lav)}.tl li:nth-child(3n)::before{border-color:var(--mint)}
.tl .tm{font-weight:800;font-size:.8125rem;color:var(--muted);text-align:right;padding-top:2px;line-height:1.5}
.tl .tx{font-size:.9375rem}
.notes{white-space:pre-wrap;font-size:.9375rem}
.att{display:flex;gap:10px}
.att div{flex:1;border-radius:18px;padding:12px;text-align:center;font-weight:800}
.att b{display:block;font-family:var(--font-title);font-size:1.75rem;line-height:1.1}
.att .p{background:var(--mint-soft);color:#2E9C79}.att .a{background:var(--rose-soft);color:#C94F7E}.att .w{background:var(--card2);color:var(--muted)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--card2);margin:14px 0 4px}
.bar i{display:block;height:100%}

/* ---------- embedded check-in ---------- */
.embed{position:fixed;inset:0;z-index:60;background:rgba(40,25,45,.42);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.embed .sheet{width:min(1000px,100%);height:min(92vh,100%);background:var(--card);border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:sheetUp .35s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.embed .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 20px;border-bottom:1px solid var(--line);font-weight:800}
.embed iframe{flex:1;width:100%;border:0}
.full-embed{height:calc(100vh - 210px);min-height:520px;width:100%;border:0;border-radius:24px;background:var(--card);box-shadow:var(--shadow)}

/* ---------- admin ---------- */
.adm-title{display:flex;align-items:center;gap:10px}
.adm-ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,#FF9A8B,#A08CF0);color:#fff}
.adm-ic .ic{width:22px;height:22px}
.adm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.adm-card{display:flex;align-items:center;gap:16px;padding:20px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:2px solid transparent;transition:transform .15s,border-color .15s}
.adm-card:hover{transform:translateY(-2px);border-color:var(--ac)}
.adm-card-ic{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--ac);color:#fff;box-shadow:0 8px 18px -8px var(--ac)}
.adm-card-ic .ic{width:30px;height:30px}
.adm-card-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.adm-card-body b{font-family:var(--font-title);font-weight:900;font-size:1.0625rem}
.adm-card-body b small{font-family:inherit;font-size:.6875rem;font-weight:800;color:var(--muted);margin-left:4px}
.adm-card-body>span{font-size:.8125rem;color:var(--muted);font-weight:700}
.adm-card-body em{font-style:normal;font-size:.75rem;font-weight:800;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,#fff);border-radius:10px;padding:4px 10px;align-self:flex-start;margin-top:2px}
.adm-arrow{flex:none;color:#C9C1CF}
.adm-foot{margin-top:24px;display:flex;justify-content:center}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow);gap:2px}
.seg button{border:none;background:none;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.8125rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--inv);color:var(--inv-ink)}
.field{display:flex;flex-direction:column;gap:6px;font-size:.8125rem;font-weight:800;color:var(--muted)}
select,input[type=number],input[type=password],input[type=text]{font:inherit;font-size:1rem;font-weight:700;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card);min-height:46px}
select:focus,input:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 4px var(--lav-soft)}
.panel{padding:20px 24px;margin-top:14px}
.row-flex{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{border-radius:14px;padding:6px 12px;font-size:.8125rem;font-weight:800;background:var(--card2)}
.stat.b{background:#E6F0FD;color:#2A62AE}.stat.g{background:var(--rose-soft);color:#B23A55}.stat.u{background:var(--lemon-soft);color:#8A6508}
.warn{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--lemon-soft);color:#8A6A10;font-size:.8125rem;font-weight:700}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:16px}
.team{position:relative;overflow:hidden;padding:16px 16px 16px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);border:2.5px solid transparent;transition:border-color .15s,transform .15s;min-height:160px}
.team::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--tc)}
.team.drop{border-color:var(--lav);transform:translateY(-2px)}
.team.target{border-color:var(--tc);border-style:dashed}
.team-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.team-name{display:flex;align-items:center;gap:10px;font-family:var(--font-title);font-weight:900;font-size:1.375rem}
.team-dot{width:30px;height:30px;border-radius:11px;background:var(--tc);display:grid;place-items:center;color:#fff;font-size:.9375rem;font-weight:900;box-shadow:0 6px 14px -6px var(--tc)}
.team-count{font-size:.8125rem;font-weight:800;color:var(--muted);background:var(--card2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.members{display:flex;flex-direction:column;gap:8px}
.m{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;font-size:1.0625rem;font-weight:800;background:var(--card2);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;border:2px solid transparent;min-height:48px}
.m i{width:22px;height:22px;border-radius:50%;background:#D9D2DE;flex:none;display:grid;place-items:center;color:#fff;font-size:.6875rem;font-style:normal;font-weight:900}
.m.boy i{background:var(--boy)}.m.girl i{background:var(--girl)}
.m em{margin-left:auto;font-style:normal;font-size:.6875rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--lemon-soft);color:#A07812}
.m.gone em{background:var(--rose-soft);color:#C94F7E}
.m.sel{border-color:var(--ink);background:var(--card);box-shadow:0 8px 18px -8px rgba(0,0,0,.4)}
.m.gone{opacity:.55}.m.gone span{text-decoration:line-through}
.m.pend{background:var(--card);border:2px dashed #E7D9A6}
.pool .members,.pend-box .members{flex-direction:row;flex-wrap:wrap}
.pool .m,.pend-box .m{min-height:44px}
.pool{margin-top:16px;padding:16px;border-radius:24px;border:2.5px dashed var(--line);background:var(--card2)}
.pend-box{margin-top:14px;padding:16px;border-radius:24px;border:2.5px dashed #EAD9A0;background:var(--card2)}
.pool.drop,.pend-box.drop{border-color:var(--lav)}
.pool.target,.pend-box.target{border-color:var(--peach)}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.box-head b{font-family:var(--font-title);font-size:1.0625rem}
.box-head small{display:block;font-size:.75rem;color:var(--muted);font-weight:700}
.print-sheet{display:none}
.hint{font-size:.8125rem;color:var(--muted);margin:10px 2px 0}
.gender-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:12px}
.g-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--card);box-shadow:0 8px 20px -18px rgba(0,0,0,.4);border:1px solid var(--line)}
.g-row .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-btns{display:flex;gap:4px;flex:none}
.g-btns button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;min-width:46px;min-height:40px;font-weight:800;cursor:pointer;touch-action:manipulation}
.g-btns button.on.boy{background:var(--boy);border-color:var(--boy);color:#fff}
.g-btns button.on.girl{background:var(--girl);border-color:var(--girl);color:#fff}
.gate{max-width:420px;margin:40px auto;padding:32px 24px;text-align:center}
.gate .big{font-size:3rem}
.gate input{width:100%;margin:14px 0 6px;text-align:center}
.err{color:#D2486F;font-size:.8125rem;font-weight:700;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--inv);color:var(--inv-ink);padding:10px 16px;border-radius:999px;font-weight:800;font-size:.8125rem;z-index:80;transition:opacity .25s,transform .3s}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- print (teams) : A4 にかわいく ---------- */
@page{size:A4 portrait;margin:12mm}
@media print{
  body{background:var(--card);padding:0;font-size:10.5pt;min-height:0}
  .top,.tabbar,.no-print,.toast,.embed,.view>h1.page,.view>.sub,.board,.pool,.pend-box,.warn{display:none!important}
  main{padding:0;max-width:none}
  .print-sheet{display:block}
  .ps-head{position:relative;overflow:hidden;border-radius:18px;padding:14pt 18pt;color:#fff;background:linear-gradient(120deg,#FF9A8B,#F27BA5 55%,#A08CF0)}
  .ps-head .ps-emoji{position:absolute;right:18pt;top:12pt;width:46pt;height:46pt;opacity:.9}
  .ps-head small{font-size:8pt;letter-spacing:.24em;font-weight:800;opacity:.9}
  .ps-head h1{font-family:var(--font-title);font-size:20pt;margin:2pt 0 4pt;font-weight:900}
  .ps-head p{margin:0;font-size:10pt;font-weight:700}
  .ps-sum{display:flex;gap:6pt;margin:8pt 0 10pt;flex-wrap:wrap}
  .ps-sum span{font-size:9pt;font-weight:800;padding:3pt 9pt;border-radius:999px;background:var(--card2)}
  .ps-grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:8pt}
  .ps-team{break-inside:avoid;border-radius:14px;border:1.5pt solid var(--tc);overflow:hidden;background:var(--card)}
  .ps-team header{display:flex;align-items:center;justify-content:space-between;padding:6pt 10pt;background:var(--tc);color:#fff}
  .ps-team header b{font-family:var(--font-title);font-size:13pt;font-weight:900}
  .ps-team header span{font-size:8.5pt;font-weight:800;background:rgba(255,255,255,.28);border-radius:999px;padding:1pt 7pt}
  .ps-team ol{list-style:none;margin:0;padding:5pt 10pt 7pt;counter-reset:n}
  .ps-team li{counter-increment:n;display:flex;align-items:center;gap:6pt;padding:3.5pt 0;border-bottom:.6pt dotted #DDD;font-size:11pt;font-weight:800}
  .ps-team li:last-child{border-bottom:none}
  .ps-team li::before{content:counter(n);width:13pt;height:13pt;border-radius:50%;background:var(--tc);color:#fff;font-size:7.5pt;display:grid;place-items:center;flex:none;opacity:.85}
  .ps-team li .g{margin-left:auto;font-size:9pt}
  .ps-team li .g.b{color:#2F6FC4}.ps-team li .g.f{color:#C94F7E}
  .ps-team li.blank{color:#bbb;font-weight:500}
  .ps-pend{margin-top:10pt;break-inside:avoid;border:1.2pt dashed #E2C873;border-radius:12px;padding:6pt 10pt;background:var(--card2);font-size:9pt}
  .ps-pend b{font-size:9.5pt}
  .ps-foot{margin-top:8pt;text-align:right;font-size:8pt;color:#999}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- アイコン（線画） ---------- */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.tabbar a span{display:grid;place-items:center;height:26px}
.tabbar a span .ic{width:24px;height:24px}
.logo-mark svg{width:26px;height:26px}
.top-admin{display:inline-flex;align-items:center;gap:6px}
.section-title .ic,.box h3 .ic,.tbd h3 .ic{width:20px;height:20px;color:var(--peach)}
.gate .big .ic{width:52px;height:52px;color:var(--lav)}
.fact .ic{width:16px;height:16px;vertical-align:-.15em;margin-right:2px}
.art{width:100%;height:100%;display:block}
.next .emoji,.hero .emoji{width:96px;height:96px;font-size:0;color:#fff;opacity:.95}
.ev .ico{color:var(--dot,#FF9A8B);padding:8px}
.chip .art{display:inline-block;width:13px;height:13px;vertical-align:-2px;stroke-width:4}

.m .pin-btn{all:unset;cursor:pointer;margin-left:auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#C9C1CF;flex:none}
.m em + .pin-btn{margin-left:4px}
.m .pin-btn .ic{width:17px;height:17px}
.m .pin-btn:hover{background:var(--card);color:var(--muted)}
.m .pin-btn.on{color:var(--inv-ink);background:var(--inv)}
.m.pinned{background:var(--card);border-color:rgba(59,50,65,.18)}
.sel-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:35;width:min(560px,calc(100% - 28px));padding:10px 14px;border-radius:16px;background:var(--inv);color:var(--inv-ink);font-weight:800;font-size:.9375rem;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
.sel-banner .btn{background:var(--card);color:var(--ink);box-shadow:none}
.edit-form{display:grid;gap:14px}
.edit-form textarea{font:inherit;font-size:1rem;font-weight:600;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:200px;resize:vertical;line-height:1.7}
.edit-form textarea:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 4px var(--lav-soft)}
.edit-form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.edit-form .two{grid-template-columns:1fr}}
.edit-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn.danger{color:#C94F7E;background:var(--card)}
/* ---------- 当日の流れ：ボタンで入力 ---------- */
.se{display:grid;gap:10px;min-width:0}
.se-rows,.se-row,.se-what{min-width:0}
.se-main input{width:100%;min-width:0}
.se-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.se-head > span{font-size:.8125rem;font-weight:800;color:var(--muted)}
.se-head .seg button{min-height:40px}
.se-note{font-size:.8125rem;color:var(--muted);font-weight:700;line-height:1.6}
.se-tpls{display:grid;gap:8px;padding:14px;border-radius:18px;border:2px dashed var(--line);background:var(--card2)}
.se-tpls b{font-size:.8125rem}
.se-tpls div{display:flex;gap:8px;flex-wrap:wrap}
.se-tpls button{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:800;font-size:.9375rem;color:var(--ink);cursor:pointer;touch-action:manipulation}
.se-rows{display:grid;gap:10px}
.se-row{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 24px -22px rgba(80,50,80,.5)}
.se-ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--cs);color:var(--cc);transition:background .2s,color .2s}
.se-ico .ic{width:20px;height:20px}
.se-main{display:grid;gap:8px;min-width:0}
.se-times{display:flex;align-items:center;gap:6px}
.se-times > span{color:var(--muted);font-weight:800}
.se-t{min-height:44px;min-width:84px;padding:6px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-family:var(--font-title);font-weight:900;font-size:1.0625rem;color:var(--cc);cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.se-t small{font-family:var(--font);font-size:.6875rem;color:var(--muted);font-weight:800}
.se-t.empty{color:var(--muted);font-family:var(--font);font-size:.8125rem;font-weight:800}
.se-x{margin-left:auto;width:44px;height:44px;border-radius:14px;border:none;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.se-x:hover{background:#FDEEF3;color:#C94F7E}
.se-what{display:flex;gap:6px}
.se-what input{flex:1;min-width:0}
.se-pick{flex:none;min-height:46px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:800;font-size:.8125rem;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.se-main input.se-sub{font-size:.9375rem;font-weight:600;min-height:42px}
.se-warn{font-size:.75rem;font-weight:800;color:#B3261E}
.se-add{min-height:48px;border-radius:16px;border:2px dashed var(--line);background:var(--card2);font:inherit;font-weight:800;font-size:.9375rem;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.se-add:hover{border-color:var(--lav)}
.se-prev{padding:14px;border-radius:20px;background:linear-gradient(135deg,var(--peach-soft),var(--lav-soft));border:1px solid var(--line)}
.se-prev > b{display:block;font-size:.8125rem;color:var(--muted);margin-bottom:4px}
.se-prev .empty{padding:12px 0}
/* 時刻・候補を選ぶシート */
.tp{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.tp-bg{position:absolute;inset:0;background:rgba(40,28,48,.38)}
.tp-sheet{position:relative;width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:12px;animation:sheetUp .3s cubic-bezier(.16,1,.3,1)}
@media (min-width:700px){.tp{align-items:center}.tp-sheet{border-radius:26px}}
.tp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900}
.tp-head button{width:44px;height:44px;border:none;background:var(--card2);border-radius:14px;font-size:1.0625rem;cursor:pointer;color:var(--ink)}
.tp-now{text-align:center;font-family:var(--font-title);font-weight:900;font-size:2.5rem;letter-spacing:.04em;color:var(--ink)}
.tp-now small{font-family:var(--font);font-size:.9375rem;color:var(--muted)}
.tp-lab{font-size:.75rem;font-weight:800;color:var(--muted)}
.tp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tp-grid button,.tp-dur button,.tp-chips button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:800;font-size:.9375rem;color:var(--ink);cursor:pointer;touch-action:manipulation}
.tp-grid button.dim{color:var(--muted);background:var(--card2)}
.tp-grid button.on,.tp-dur button.on{background:var(--inv);border-color:var(--ink);color:var(--inv-ink)}
.tp-dur{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tp-row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tp-ap{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9375rem;min-height:44px;cursor:pointer}
.tp-ap input{width:22px;height:22px}
.tp-chips{display:flex;flex-wrap:wrap;gap:6px}
.tp-chips button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px}
.tp-chips button i{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--cs);color:var(--cc)}
.tp-chips button i .ic{width:16px;height:16px}
@media (prefers-reduced-motion:reduce){.tp-sheet{animation:none}}
@media print{.tp{display:none}}
#ef-datepick{color:transparent;width:52px!important;flex:none;cursor:pointer;position:relative}
#ef-datepick::-webkit-datetime-edit{display:none}
#ef-datepick::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:.6;cursor:pointer;background-position:center;background-size:22px}
@media print{.m .pin-btn{display:none}}
.still .view{animation:none}
.team,.pool,.pend-box{transition:border-color .4s ease}

/* ---------- 当日の流れ ---------- */
.sched{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;position:relative}
.sched::before{content:"";position:absolute;left:21px;top:24px;bottom:24px;border-left:2px dashed #EADFE6}
.sc{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;position:relative;animation:scIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d)}
.still .sc{animation:none}
@keyframes scIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sc-ico{position:relative;z-index:1;width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:var(--cs);color:var(--cc);box-shadow:0 0 0 5px #fff}
.sc-ico .ic{width:22px;height:22px}
.sc-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px 12px;box-shadow:0 10px 24px -22px rgba(80,50,80,.5);position:relative}
.sc-card::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 3px}
.sc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sc-tm{font-family:var(--font-title);font-weight:900;font-size:1.0625rem;color:var(--cc);display:inline-flex;align-items:baseline;gap:4px;letter-spacing:.02em}
.sc-tm small{font-size:.75rem;color:var(--muted);font-weight:800;letter-spacing:0}
.sc-tag{font-size:.6875rem;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--cs);color:var(--cc)}
.sc-now{font-size:.6875rem;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--cc);color:#fff}
.sc-title{font-weight:900;font-size:1.0625rem;margin-top:4px;line-height:1.5}
.sc-sub{font-size:.8125rem;color:var(--muted);margin-top:2px;line-height:1.65}
.sc.now .sc-card{border-color:var(--cc);box-shadow:0 0 0 4px var(--cs),0 14px 30px -20px var(--cc)}
.sc.now .sc-ico{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--cs)}
@media (max-width:480px){.sc{grid-template-columns:38px 1fr;gap:12px}.sc-ico{width:38px;height:38px;border-radius:14px}.sched::before{left:18px}}

/* ---------- 出欠の確認 ---------- */
.ev-pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}
.ev-pills::-webkit-scrollbar{display:none}
.ev-pill{flex:none;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px 8px 8px;font-weight:800;font-size:.8125rem;cursor:pointer;white-space:nowrap}
.ev-pill-ic{width:26px;height:26px;border-radius:50%;background:var(--cs);color:var(--cc);display:grid;place-items:center;padding:4px}
.ev-pill.on{background:var(--inv);color:var(--inv-ink);border-color:var(--ink)}
.att-hero{display:flex;align-items:center;gap:24px;padding:24px 24px;color:#fff;border:none;background:linear-gradient(130deg,var(--c1),var(--c2));position:relative;overflow:hidden}
.att-hero::after{content:"";position:absolute;right:-50px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}
.att-ring{position:relative;flex:none;width:150px;height:150px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring-bg{stroke:rgba(255,255,255,.28)}
.ring-p{stroke:#fff;transition:stroke-dasharray .8s ease}
.ring-a{stroke:rgba(255,255,255,.55)}
.att-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.att-ring-c b{font-family:var(--font-title);font-size:2.5rem;font-weight:900}
.att-ring-c span{font-size:.8125rem;font-weight:800;opacity:.9}

.att-sec.is-p{--sc:#5CC9A7;--ss:#DDF5EC;--st:#187356}.att-sec.is-a{--sc:#F27BA5;--ss:#FFE1EC;--st:#B23A55}.att-sec.is-w{--sc:#F6C453;--ss:#FFF3D3;--st:#8A6508;background:var(--card2)}

/* ---------- 打ち合わせ ---------- */
.meets{display:flex;flex-direction:column;gap:10px}

.meet-date{flex:none;width:52px;border-radius:14px;background:linear-gradient(160deg,var(--lav),var(--rose));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.meet.past .meet-date{background:#C9C1CF}

.meet-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.meet-top{font-weight:800;font-size:.9375rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meet-badge{font-size:.6875rem;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--lav);color:#fff}

.meet-sum{font-size:.8125rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meet-todo{font-size:.75rem;font-weight:800;color:#2E9C79;display:inline-flex;align-items:center;gap:4px}
.meet-head{position:relative;overflow:hidden;border-radius:24px;padding:24px 24px;color:#fff;background:linear-gradient(130deg,var(--c1),var(--c2));margin-bottom:6px}
.meet-head .tag{display:inline-block;font-size:.6875rem;font-weight:800;letter-spacing:.18em;background:rgba(255,255,255,.25);padding:4px 12px;border-radius:999px}
.meet-head h1{font-family:var(--font-title);font-weight:900;font-size:1.375rem;margin:8px 0 2px}
.meet-head p{margin:0;font-weight:700;opacity:.92}
.todos{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.mh-compact{padding:14px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.mh-compact h1{font-size:1.375rem;margin:0}
.mf2{padding:16px 16px}
.mf2 .field{gap:4px}
.mf-top{display:grid;grid-template-columns:150px 150px 1fr 1.6fr;gap:10px}
.mf-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.mf-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mf-col.pre{padding:12px;border-radius:16px;background:var(--card2);border:1.5px solid #F3D9B8}
.mf-col.pre .field{flex:1}
.mf-h{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--ink);font-size:.8125rem}
.mf-h small{color:var(--muted);font-weight:700;font-size:.75rem}
.mf-col.pre .mf-h .ic{color:#D98A2B}.mf-col.rec .mf-h .ic{color:#4E8FD8}
.mf2 textarea,.edit-form textarea{min-height:110px;overflow:hidden;resize:none}
.mf2 .mf-big{min-height:260px;background:var(--card)}
.mf-todo{margin-top:0}
.mf-todo .todos{margin:4px 0 0}
.mh-acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mh-acts .btn.sm{background:rgba(255,255,255,.92);color:var(--ink);border:none}
.mh-acts .btn.sm.danger{color:#C2415E}
.mh-compact p{margin:0}
.mf2 input[type=date]{height:44px;padding:0 12px;border-radius:14px;border:1.5px solid #EDE6F2;background:var(--card);font:inherit;font-weight:700;color:var(--ink)}
.mf2 + .edit-actions,.mf2 .edit-actions{margin-top:12px}
@media (max-width:760px){.mf-top{grid-template-columns:1fr 1fr}.mf-cols{grid-template-columns:1fr}.mf2 textarea{height:auto;min-height:110px}}
.msec{margin:16px 0 6px;padding:16px 16px 8px;border-radius:20px;border:1.5px solid var(--ms,#EDE6F2);background:var(--mb,#FCFAFE)}
.msec.pre{--ms:#F3D9B8;--mb:#FFFAF2}
.msec.rec{--ms:#D8E4F7;--mb:#F7FAFF}
.msec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.msec-h b{font-family:var(--font-title);font-weight:900;font-size:1.0625rem}
.msec-h small{color:var(--muted);font-weight:700;font-size:.75rem}
.msec.pre .msec-h .ic{color:#D98A2B}.msec.rec .msec-h .ic{color:#4E8FD8}
.ag-no{flex:none;width:24px;height:24px;border-radius:50%;background:#F3D9B8;color:#8A5410;font-weight:900;font-size:.75rem;display:grid;place-items:center}
.ag-row input[data-ag-text]{flex:1;min-width:0}
.ag-row.done input[data-ag-text]{text-decoration:line-through;color:var(--muted)}
.todo-row .todo-due{width:110px;flex:none}
.todo-row{display:flex;gap:8px;align-items:center}
.todo-row input[data-todo-text]{flex:1;min-width:0}
.todo-row .todo-who{width:130px;flex:none}
.todo-chk{width:34px;height:34px;flex:none;border-radius:11px;border:2px solid #D6CEDB;background:var(--card);display:grid;place-items:center;color:#fff;cursor:pointer}
.todo-row.done .todo-chk{background:var(--mint);border-color:var(--mint)}
.todo-row.done input[data-todo-text]{text-decoration:line-through;color:var(--muted)}
.todo-del{width:34px;height:34px;flex:none;border:none;background:none;color:#C9C1CF;cursor:pointer;border-radius:10px}
.todo-del:hover{background:var(--rose-soft);color:#C94F7E}
.open-todo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 4px;border-bottom:1px dashed var(--line);text-decoration:none;font-weight:800}
.open-todo:last-child{border-bottom:none}
.open-todo .todo-chk{width:22px;height:22px;border-radius:7px}
.open-todo .who{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--sky-soft);color:#2F6FC4}
.open-todo small{margin-left:auto;font-size:.75rem;color:var(--muted);font-weight:700}
@media (max-width:560px){.todo-row{flex-wrap:wrap}.todo-row .todo-who,.todo-row .todo-due{width:auto;flex:1}.msec{padding:14px 12px 4px}}
@media print{
  .meet-form{box-shadow:none;border:1px solid #ddd}

  .meet-form textarea{white-space:pre-wrap}
  .todo-del{display:none}
  .meet-head{border-radius:14px}
  /* A4 1枚をちょうど使い切る: 書いた内容の下は罫線の書き込み欄にして、ページ下まで伸ばす */
  .meet-view{display:flex;flex-direction:column;min-height:270mm}
  .meet-view .mf2{flex:1;display:flex;flex-direction:column;padding:12pt 14pt}
  .meet-view .mf-cols{flex:1;grid-template-rows:1fr}
  .meet-view .mf-col.rec .field{flex:1}

  .meet-view .mf-h{flex-wrap:wrap}

  .meet-view .mf-todo .todos,.meet-form .ptext{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.9em - 1.5px),#DDD5E3 calc(1.9em - 1.5px),#DDD5E3 1.9em);-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.ptext{display:none;flex:1;min-height:3.8em;white-space:pre-wrap;word-break:auto-phrase;font-size:.9375rem;font-weight:700;line-height:1.9;color:var(--ink)}

/* ---------- ルーレット ---------- */
.rl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rl-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:24px;align-items:center;margin-top:8px}
@media (max-width:820px){.rl-wrap{grid-template-columns:1fr}}
.rl-stage{position:relative;width:min(100%,560px);aspect-ratio:1;margin:0 auto}
.rl-glow{position:absolute;inset:-6%;border-radius:50%;background:conic-gradient(from 0deg,#FF9A8B,#F6C453,#5CC9A7,#6BB8F0,#A08CF0,#F27BA5,#FF9A8B);filter:blur(28px);opacity:.45;animation:rlGlow 8s linear infinite}
.rl-stage.spinning .rl-glow{opacity:.8;animation-duration:1.4s}
@keyframes rlGlow{to{transform:rotate(360deg)}}
.rl-wheel{position:relative;width:100%;height:100%;filter:drop-shadow(0 22px 34px rgba(70,40,80,.35))}
.wheel-svg{width:100%;height:100%;display:block}
.wheel-rot{transform-origin:210px 210px}
.bulb{fill:#FFF3C4;animation:bulb 1.2s ease-in-out infinite;animation-delay:calc(var(--k) * -.1s)}
.rl-stage.spinning .bulb{animation-duration:.35s}
@keyframes bulb{0%,100%{fill:#FFF3C4;opacity:.55}50%{fill:#FFD54F;opacity:1}}
.rl-pointer{position:absolute;left:50%;top:-2%;z-index:3;width:0;height:0;margin-left:-24px;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid #3B3241;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));transform-origin:50% 0}
.rl-pointer::after{content:"";position:absolute;left:-9px;top:-40px;width:18px;height:18px;border-radius:50%;background:#FFD54F}
.rl-pointer.flick{animation:flick .12s ease-out}
@keyframes flick{0%{transform:rotate(-12deg)}100%{transform:none}}
.rl-go{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;background:linear-gradient(140deg,#FF9A8B,#F27BA5 50%,#A08CF0);color:#fff;font-family:var(--font-title);font-weight:900;font-size:clamp(.85rem,2.4vw,1.25rem);letter-spacing:.06em;cursor:pointer;box-shadow:0 12px 26px -8px rgba(242,123,165,.8);animation:goPulse 1.8s ease-in-out infinite}
.rl-go:disabled{filter:grayscale(.6);opacity:.7;animation:none;cursor:default}
@keyframes goPulse{0%,100%{box-shadow:0 12px 26px -8px rgba(242,123,165,.8),0 0 0 0 rgba(242,123,165,.45)}50%{box-shadow:0 12px 26px -8px rgba(242,123,165,.8),0 0 0 16px rgba(242,123,165,0)}}
.rl-side{padding:20px 24px}
.rl-seg{display:flex;width:100%}
.rl-seg button{flex:1}
.rl-check{display:flex;align-items:center;gap:8px;font-size:.9375rem;font-weight:800;margin-top:14px}
.rl-check input{width:20px;height:20px;accent-color:var(--rose)}
.rl-count{margin-top:12px;font-size:.9375rem;font-weight:800;color:var(--muted)}
.rl-count b{font-family:var(--font-title);font-size:1.375rem;color:var(--ink)}
.link-btn{border:none;background:none;color:var(--rose);font-weight:800;cursor:pointer;text-decoration:underline}
.rl-hist{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rl-hist b{flex-basis:100%;font-size:.8125rem;color:var(--muted)}
.rl-hist span{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--lemon-soft);font-weight:800;font-size:.8125rem}
.rl-hist i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--lemon);color:#fff;display:grid;place-items:center;font-size:.6875rem}
/* 大きく表示: ルーレットだけ */
.rl-exit,.rl-flash,.rl-hint{display:none}
#app:fullscreen{background:radial-gradient(ellipse at 50% 40%,#5B4670 0%,#2A2033 55%,#140F18 100%);padding:0;margin:0;max-width:none;width:100vw;height:100vh;overflow:hidden;display:grid;place-items:center}
#app:fullscreen .rl-view{animation:none}
#app:fullscreen .rl-view .rl-head,#app:fullscreen .rl-view .rl-side{display:none}
#app:fullscreen .rl-view .rl-wrap{display:block;margin:0}
#app:fullscreen .rl-view .rl-stage{width:min(80vh,90vw);margin-top:9vh;cursor:pointer}
#app:fullscreen .rl-view .rl-glow{opacity:.7;filter:blur(46px)}
#app:fullscreen .rl-view .rl-go{font-size:clamp(1.2rem,3vh,2rem)}
#app:fullscreen .rl-view .rl-exit{display:grid;place-items:center;position:fixed;top:18px;right:20px;z-index:20;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:1.75rem;cursor:pointer}
#app:fullscreen .rl-view .rl-hint{display:block;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:rgba(255,255,255,.45);font-size:.8125rem;font-weight:700;z-index:5}
#app:fullscreen .rl-view .rl-flash{display:block;position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.9),rgba(255,230,180,.25) 40%,transparent 70%);opacity:0}
#app:fullscreen .rl-view::before{content:"";position:fixed;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0deg 8deg,transparent 8deg 16deg);animation:rlGlow 60s linear infinite;pointer-events:none}
.rl-flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.rl-stage.landed .rl-wheel{animation:land .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}
.seg.win-seg{stroke:#fff;stroke-width:6;animation:winSeg .9s ease-in-out infinite;filter:brightness(1.15)}
@keyframes winSeg{0%,100%{filter:brightness(1.05)}50%{filter:brightness(1.45) saturate(1.2)}}
.rl-spark{position:fixed;z-index:116;width:12px;height:12px;margin:-6px 0 0 -6px;pointer-events:none;background:var(--c);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark 1.3s cubic-bezier(.15,.9,.3,1) forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(220deg);opacity:0}}
.rl-win.fs{background:rgba(15,10,20,.45)}
.rl-win.fs .rl-card{min-width:min(760px,90vw);padding:6vh 6vw 4vh;border-radius:40px}
.rl-win.fs .rl-card small{font-size:clamp(1rem,2.6vh,1.6rem)}
.rl-win.fs .rl-card b{font-size:clamp(3rem,13vh,8rem)}
.rl-win.fs .rl-card span{font-size:clamp(1rem,3vh,1.8rem)}
.rl-auto{font-size:.8125rem;font-weight:700;color:var(--muted)}
.rl-win .rl-card{animation:winPop .7s cubic-bezier(.16,1.4,.3,1)}
.rl-win .rl-card b{animation:winName 1.4s ease-in-out .7s infinite}
@keyframes winName{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:120}
.rl-win{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:rgba(35,25,40,.55);backdrop-filter:blur(6px);animation:fadeIn .25s}
.rl-card{position:relative;overflow:hidden;text-align:center;padding:32px 40px 24px;border-radius:30px;background:var(--card);min-width:min(420px,88vw);box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:winPop .6s cubic-bezier(.16,1.3,.3,1)}
@keyframes winPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.rl-rays{position:absolute;left:50%;top:44%;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(from 0deg,rgba(246,196,83,.18) 0deg 10deg,transparent 10deg 20deg);animation:rlGlow 12s linear infinite;pointer-events:none}
.rl-card small{position:relative;display:block;font-weight:900;letter-spacing:.2em;color:var(--rose)}
.rl-card b{position:relative;display:block;font-family:var(--font-title);font-weight:900;font-size:clamp(2.2rem,8vw,4rem);line-height:1.2;margin:8px 0 2px;background:linear-gradient(120deg,#FF8A80,#F27BA5 45%,#A08CF0);-webkit-background-clip:text;background-clip:text;color:transparent}
.rl-card span{position:relative;display:block;font-weight:800;color:var(--muted)}
.rl-btns{position:relative;display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.rl-glow,.bulb,.rl-go,.rl-rays{animation:none}}

/* ---------- ルーレット: 盛り上げ演出 ---------- */
.rl-ticker{height:0;overflow:visible;text-align:center;position:relative;z-index:6;pointer-events:none}
.rl-view.is-spinning .rl-ticker{height:auto;margin:4px 0 6px}
.rl-ticker .tk{display:inline-block;font-family:var(--font-title);font-weight:900;font-size:clamp(1.4rem,4vw,2.4rem);padding:4px 24px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);animation:tkIn .12s ease-out}
.rl-ticker .tk.win{background:linear-gradient(120deg,#FF8A80,#F27BA5,#A08CF0);color:#fff}
@keyframes tkIn{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
.dokidoki{display:inline-block;font-family:var(--font-title);font-weight:900;font-size:clamp(1.5rem,4.4vw,2.6rem);color:#F27BA5;animation:heart .55s ease-in-out infinite}
@keyframes heart{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(1.04)}}
.rl-vignette{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(40,0,30,.55) 100%)}
.rl-view.suspense .rl-vignette{opacity:1;animation:heartV .55s ease-in-out infinite}
@keyframes heartV{0%,100%{opacity:.75}30%{opacity:1}}
.rl-view.suspense .rl-wheel{animation:heart .55s ease-in-out infinite}
#app:fullscreen .rl-ticker{position:fixed;left:0;right:0;top:2vh;height:auto;z-index:12}
#app:fullscreen .rl-ticker .tk{font-size:clamp(2rem,6vh,4rem);background:rgba(255,255,255,.95)}
#app:fullscreen .dokidoki{font-size:clamp(2.2rem,7vh,4.6rem);color:#FFD1E3;text-shadow:0 0 24px rgba(242,123,165,.8)}
#app:fullscreen .rl-view.is-spinning .rl-hint{display:none}
.rl-count3{position:fixed;inset:0;z-index:130;display:grid;place-items:center;pointer-events:none}
.rl-count3 b{font-family:var(--font-title);font-weight:900;font-size:clamp(7rem,30vh,18rem);color:#fff;-webkit-text-stroke:6px #F27BA5;paint-order:stroke;text-shadow:0 18px 40px rgba(160,80,140,.55);opacity:0}
.rl-count3.go b{animation:cnt .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes cnt{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.dokidoki,.rl-view.suspense .rl-wheel,.rl-view.suspense .rl-vignette{animation:none}}

/* ---------- ガラガラ抽選機 ---------- */
.rl-style button{font-size:.8125rem;padding:8px 6px}
.gp-stage{aspect-ratio:1/1}
.gp-machine{position:absolute;inset:4% 6% 12%}
.gp-stand{position:absolute;left:14%;right:14%;bottom:0;height:16%;border-radius:18px 18px 10px 10px;background:linear-gradient(180deg,#C98B4E,#8D5A2B);box-shadow:0 10px 20px -8px rgba(0,0,0,.4)}
.gp-legs{position:absolute;left:28%;right:28%;bottom:14%;height:26%;background:linear-gradient(90deg,#A46D3A 0 14%,transparent 14% 86%,#A46D3A 86%);}
.gp-drum{position:absolute;left:50%;top:40%;width:66%;aspect-ratio:1;margin-left:-33%;margin-top:-33%;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);background:radial-gradient(circle at 35% 30%,#FF8A80,#E53950 60%,#B71C3B);box-shadow:inset 0 0 0 10px rgba(255,255,255,.12)}
.gp-face{position:absolute;inset:9%;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.35),rgba(255,255,255,.08) 60%);border:0}
.gp-b{position:absolute;left:var(--x);top:var(--y);width:11%;aspect-ratio:1;margin:-5.5% 0 0 -5.5%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--c) 40%);box-shadow:0 2px 3px rgba(0,0,0,.25);animation:gpJig .5s ease-in-out infinite alternate;animation-delay:var(--d)}
.rl-stage.spinning .gp-b{animation-duration:.14s}
@keyframes gpJig{from{transform:translate(-6px,4px)}to{transform:translate(6px,-6px)}}
.gp-axle{position:absolute;left:50%;top:40%;width:9%;aspect-ratio:1;margin:-4.5% 0 0 -4.5%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE082,#C9A13B);box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:2}
.gp-handle{position:absolute;left:50%;top:40%;width:0;height:0;z-index:3}
.gp-handle span{position:absolute;left:0;top:-4px;width:min(26vh,120px);height:8px;border-radius:8px;background:#5D4037;transform-origin:0 50%}
.gp-handle span::after{content:"";position:absolute;right:-10px;top:-8px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE082,#E0A100)}
.gp-chute{position:absolute;left:62%;top:68%;width:16%;height:9%;background:linear-gradient(180deg,#8D5A2B,#6D4421);border-radius:0 0 12px 12px;transform:skewX(-20deg)}
.gp-tray{position:absolute;left:58%;right:2%;top:80%;height:6%;border-radius:0 0 22px 22px;background:linear-gradient(180deg,#E0B07A,#B47A43);box-shadow:inset 0 4px 6px rgba(0,0,0,.2)}
.gp-out{position:absolute;left:66%;top:70%;z-index:5;opacity:0;pointer-events:none}
.gp-out.go{animation:gpDrop 1.4s cubic-bezier(.3,0,.3,1) forwards}
@keyframes gpDrop{0%{opacity:1;transform:translate(0,0) scale(.5)}35%{transform:translate(4%,14vh) scale(.9)}50%{transform:translate(6%,11vh) scale(.95)}65%{transform:translate(12%,13.5vh) scale(1)}100%{opacity:1;transform:translate(18%,12vh) scale(1.6)}}
#app:fullscreen .gp-out.go{animation-name:gpDropFs}
@keyframes gpDropFs{0%{opacity:1;transform:translate(0,0) scale(.6)}35%{transform:translate(4%,9vh) scale(1)}50%{transform:translate(6%,7vh) scale(1)}65%{transform:translate(12%,9vh) scale(1.1)}100%{opacity:1;transform:translate(18%,8vh) scale(1.9)}}
.gp-ball{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 10%,var(--c) 45%);box-shadow:0 6px 14px rgba(0,0,0,.35);animation:gpRoll 1.4s linear}
.gp-ball b{display:grid;place-items:center;width:70%;height:70%;border-radius:50%;background:var(--card);font-size:9px;font-weight:900;color:#3B3241;text-align:center;line-height:1.1;padding:2px;overflow:hidden}
@keyframes gpRoll{from{transform:rotate(-540deg)}to{transform:none}}
.gp-go{left:22%!important;top:auto!important;bottom:-2%;transform:translate(-50%,0)!important;width:24%!important}
/* ---------- スロット ---------- */
.sl-stage{aspect-ratio:1/1}
.sl-machine{position:absolute;inset:6% 10% 16% 4%;border-radius:36px;background:linear-gradient(170deg,#FF6F91,#C8346B 55%,#7B1E4F);box-shadow:0 30px 60px -24px rgba(120,20,70,.6),inset 0 0 0 8px rgba(255,255,255,.15);padding:10% 8% 8%}
.sl-top{position:absolute;left:50%;top:-6%;transform:translateX(-50%);padding:6px 24px;border-radius:999px;background:linear-gradient(180deg,#FFE082,#F5B400);color:#7B1E4F;font-family:var(--font-title);font-weight:900;letter-spacing:.2em;font-size:clamp(.9rem,2.6vh,1.6rem);box-shadow:0 8px 16px -6px rgba(0,0,0,.4)}
.sl-lights{position:absolute;inset:3%;pointer-events:none}
.sl-lights i{position:absolute;width:3.5%;aspect-ratio:1;border-radius:50%;background:#FFF3C4;animation:bulb 1s ease-in-out infinite;animation-delay:calc(var(--k) * -.12s);left:calc(4% + (var(--k) * 6.8%));top:0}
.sl-lights i:nth-child(n+8){top:auto;bottom:0;left:calc(4% + ((var(--k) - 7) * 13%))}
.rl-stage.spinning .sl-lights i{animation-duration:.3s}
.sl-window{position:relative;height:100%;border-radius:22px;overflow:hidden;background:var(--card);box-shadow:inset 0 10px 18px rgba(0,0,0,.25),inset 0 -10px 18px rgba(0,0,0,.25)}
.sl-window::before,.sl-window::after{content:"";position:absolute;left:0;right:0;height:30%;z-index:2;pointer-events:none}
.sl-window::before{top:0;background:linear-gradient(#fff,rgba(255,255,255,0))}
.sl-window::after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff)}
.sl-reel{will-change:transform}
.sl-window{--row:calc(100% / 3)}
.sl-item{height:var(--rowpx,90px);display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-weight:900;font-size:calc(var(--rowpx,90px) * .38);color:var(--c);border-bottom:2px dashed #F1E8EE;padding:0 14px;text-align:center;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.sl-reel.blur .sl-item{filter:blur(1.5px)}
.sl-item.muted{color:var(--muted);font-size:1rem}
.sl-item.hit{background:linear-gradient(90deg,#FFF3C4,#FFE1EC,#FFF3C4);animation:winName 1s ease-in-out infinite}
.sl-line{position:absolute;left:0;right:0;top:50%;height:var(--rowpx,90px);transform:translateY(-50%);border-top:4px solid #F5B400;border-bottom:4px solid #F5B400;z-index:3;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,0,0,.04)}
.sl-lever{position:absolute;right:-9%;top:22%;width:6%;height:46%;z-index:1}
.sl-lever span{position:absolute;left:50%;bottom:0;width:30%;height:100%;margin-left:-15%;border-radius:8px;background:linear-gradient(90deg,#bbb,#eee,#999);transform-origin:50% 100%}
.sl-lever span::before{content:"";position:absolute;left:50%;top:-14%;width:300%;aspect-ratio:1;margin-left:-150%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF8A80,#D32F2F)}
.sl-lever.pull span{animation:lever .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes lever{0%{transform:none}35%{transform:scaleY(-.6)}100%{transform:none}}
.sl-go{left:50%!important;top:auto!important;bottom:-1%;transform:translate(-50%,0)!important;width:22%!important}
#app:fullscreen .rl-view .gp-stage,#app:fullscreen .rl-view .sl-stage{width:min(80vh,90vw)}

.rl-stage.gp-shake .gp-machine{animation:gpShake .22s ease-in-out infinite}
@keyframes gpShake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-.6deg)}75%{transform:translate(2px,-1px) rotate(.6deg)}}
.rl-stage.gp-hold .gp-chute{animation:chute .5s ease-in-out infinite}
@keyframes chute{0%,100%{filter:none}50%{filter:brightness(1.6) drop-shadow(0 0 12px #FFD54F)}}
.rl-stage.gp-pop .gp-machine{animation:gpPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes gpPop{0%{transform:scale(1)}40%{transform:scale(1.03,0.97)}100%{transform:none}}
.gp-ball.shine{box-shadow:0 0 0 6px rgba(255,255,255,.6),0 0 40px 12px rgba(255,213,79,.9);transition:box-shadow .4s}
.rl-stage.sl-run .sl-top{animation:slTop .5s ease-in-out infinite}
@keyframes slTop{0%,100%{filter:none;transform:translateX(-50%)}50%{filter:brightness(1.3) drop-shadow(0 0 14px #FFD54F);transform:translateX(-50%) scale(1.06)}}
.rl-stage.sl-bump .sl-window{animation:slBump .12s ease-out}
@keyframes slBump{0%{transform:translateY(2px)}100%{transform:none}}
.sl-machine.jackpot{animation:jp .6s ease-in-out 3}
@keyframes jp{0%,100%{box-shadow:0 30px 60px -24px rgba(120,20,70,.6),inset 0 0 0 8px rgba(255,255,255,.15)}50%{box-shadow:0 0 0 10px rgba(255,213,79,.6),0 0 70px 20px rgba(255,213,79,.7),inset 0 0 0 8px rgba(255,255,255,.4)}}
.sl-machine.jackpot .sl-lights i{animation-duration:.15s}

/* ===== 実物っぽい抽選機（ルーレット・ガラガラ・スロット） ===== */
.rl-stage .rl-glow{display:none}
.rl-stage::after{content:"";position:absolute;left:8%;right:8%;bottom:-3%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.18),transparent);z-index:-1}
.rl-wheel{filter:drop-shadow(0 16px 22px rgba(40,25,15,.35))}
.bulb{fill:#FFE9A8}
@keyframes bulb{0%,100%{fill:#8A7440;opacity:1}50%{fill:#FFF3C4;opacity:1}}
.rl-pointer{border-left-width:18px;border-right-width:18px;border-top:40px solid #2B1D14;margin-left:-16px;top:-1%}
.rl-pointer::after{left:-8px;top:-38px;width:16px;height:16px;background:radial-gradient(circle at 35% 30%,#FFF4C8,#C9973A 55%,#7A5216)}
.rl-go{background:#B3261E!important;border:4px solid #F2D37A!important;box-shadow:0 6px 14px -4px rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.2)!important;animation:none!important;letter-spacing:.1em}
.rl-go:active{transform:translate(-50%,-48%) scale(.97)}
/* ガラガラ */
.gp-svg,.sl-svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 18px rgba(40,25,15,.25))}
#gpDrum,#gpHandle{transform-box:view-box;transform-origin:200px 175px}
.rl-stage.gp-shake .gp-svg{animation:gpShake .22s ease-in-out infinite}
.gp-out{position:absolute;left:51%;top:68%;width:0;height:0;z-index:5;opacity:0}
.gp-out.go{animation:gpRollOut 1.4s cubic-bezier(.35,0,.25,1) forwards}
@keyframes gpRollOut{0%{opacity:1;left:51%;top:68%}30%{left:60%;top:76.5%}45%{left:63%;top:75%}60%{left:70%;top:76.5%}100%{opacity:1;left:78%;top:76.5%}}
#app:fullscreen .gp-out.go{animation-name:gpRollOut}
.gp-ball{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;display:block;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--c) 50%,rgba(0,0,0,.35) 100%);box-shadow:0 3px 5px rgba(0,0,0,.35);animation:gpRoll 1.4s linear}
.gp-ball b{position:absolute;left:50%;bottom:150%;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:900;color:#2B1D14;background:var(--card2);border:1.5px solid #2B1D14;border-radius:6px;padding:4px 8px;opacity:0;transition:opacity .3s .9s}
.gp-out.go .gp-ball b{opacity:1}
.gp-ball.shine{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 0 24px 8px rgba(242,211,122,.9)}
.gp-go{left:22%!important;top:auto!important;bottom:4%;transform:translate(-50%,0)!important;width:22%!important}
.rl-stage.gp-hold .gp-svg{animation:none}
/* スロット */
.sl-sign{position:absolute;left:23%;right:28%;top:6.6%;height:8.4%;display:grid;place-items:center;font-family:var(--font-title);font-weight:900;color:#F2D37A;letter-spacing:.2em;font-size:clamp(.8rem,2.4vh,1.5rem);text-shadow:0 0 8px rgba(242,211,122,.6);z-index:2;pointer-events:none}
.rl-stage.sl-run .sl-sign{animation:sign .5s steps(2) infinite}
@keyframes sign{50%{color:#FFF6D8;text-shadow:0 0 16px rgba(255,230,150,.95)}}
.sl-window{position:absolute;left:19%;top:25.5%;width:57%;height:46%;border-radius:8px;overflow:hidden;background:#F6EFDF;box-shadow:inset 0 0 0 2px #2A0A0E}
.sl-window::before,.sl-window::after{display:none}
.sl-curve{position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.08) 26%,rgba(255,255,255,.12) 50%,rgba(0,0,0,.08) 74%,rgba(0,0,0,.55) 100%)}
.sl-item{color:#2B1D14!important;border-bottom:1px solid rgba(43,29,20,.12)!important;font-weight:900}
.sl-item.hit{background:#FFF1C2!important;animation:none!important}
.sl-line{border:none!important;box-shadow:none!important}
.sl-line::before,.sl-line::after{content:"";position:absolute;top:50%;width:0;height:0;margin-top:-8px;border-top:9px solid transparent;border-bottom:9px solid transparent}
.sl-line::before{left:0;border-left:13px solid #B3261E}
.sl-line::after{right:0;border-right:13px solid #B3261E}
#slLever{transform-box:view-box;transform-origin:355px 268px;transition:transform .15s}
.rl-stage.sl-pull #slLever{transform:scaleY(-.5)}
.sl-go{left:46%!important;top:auto!important;bottom:-1%;transform:translate(-50%,0)!important;width:20%!important}
.sl-machine,.sl-top,.sl-lights,.sl-lever{display:none}
.rl-stage.sl-bump .sl-window{animation:slBump .12s ease-out}
.sl-stage.jackpot .sl-svg{animation:jp2 .5s ease-in-out 4}
@keyframes jp2{50%{filter:drop-shadow(0 0 26px rgba(242,211,122,.95)) brightness(1.08)}}

.gp-ball b{width:auto!important;height:auto!important;overflow:visible!important;display:block!important;line-height:1.3!important;border-radius:6px!important}
/* 名前の表示と当選の札を、紙の札・朱色の判子風に */
.rl-ticker .tk{background:var(--card2)!important;color:#2B1D14!important;border:2px solid #2B1D14;border-radius:10px!important;box-shadow:0 4px 0 #2B1D14!important}
.rl-ticker .tk.win{background:#B3261E!important;color:#fff!important;border-color:#7A1410;box-shadow:0 4px 0 #7A1410!important}
.dokidoki{color:#B3261E!important;text-shadow:none!important}
#app:fullscreen .dokidoki{color:#F2D37A!important}
.rl-card{background:var(--card2)!important;border:3px solid #2B1D14;border-radius:14px!important;box-shadow:0 10px 0 #2B1D14,0 30px 60px -20px rgba(0,0,0,.6)!important}
.rl-card::before{content:"";position:absolute;inset:10px;border:1.5px solid #B3261E;border-radius:8px;pointer-events:none}
.rl-rays{display:none}
.rl-card small{color:#B3261E!important;letter-spacing:.3em!important}
.rl-card b{background:none!important;-webkit-text-fill-color:#2B1D14!important;color:#2B1D14!important}
.rl-card b::after{content:"当";position:absolute;right:-1.1em;top:-.35em;width:1.5em;height:1.5em;border-radius:50%;border:3px solid #B3261E;color:#B3261E;-webkit-text-fill-color:#B3261E;font-size:.38em;display:grid;place-items:center;transform:rotate(-12deg);opacity:.85}
.rl-card .btn.primary{background:#B3261E!important}
.rl-count3 b{-webkit-text-stroke:6px #B3261E!important;text-shadow:0 10px 0 rgba(43,29,20,.35)!important}

/* ===== 舞台の演出（幕・スポットライト・電飾） ===== */
.rl-theater{position:relative;width:min(100%,620px);margin:0 auto;border-radius:22px;overflow:hidden;padding:58px 8% 60px;background:radial-gradient(ellipse at 50% 38%,#43213A 0%,#22121E 55%,#120A10 100%);box-shadow:0 26px 50px -30px rgba(30,10,25,.8),inset 0 0 90px rgba(0,0,0,.55);isolation:isolate}
.rl-theater .rl-stage{z-index:3;width:100%}
.th-marquee{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.mq{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-width:7;stroke-dasharray:0 22}
.mq.a{stroke:#FFF3C9;animation:chase 1.6s linear infinite}
.mq.b{stroke:#E2A93B;stroke-dashoffset:11;animation:chase 1.6s linear infinite reverse;opacity:.75}
.rl-view.is-spinning .mq.a,.rl-view.is-spinning .mq.b{animation-duration:.45s}
.rl-view.reveal .mq.a{animation:mqFlash .25s steps(2) infinite}
@keyframes chase{to{stroke-dashoffset:-44}}
@keyframes mqFlash{50%{stroke:#fff;opacity:.3}}
.th-valance{position:absolute;left:0;right:0;top:0;height:40px;z-index:4;background:repeating-linear-gradient(90deg,#8E1324 0 26px,#B71E35 26px 40px,#7A0F1E 40px 52px);border-bottom:5px solid #D9A93B;-webkit-mask:radial-gradient(26px 18px at 26px 100%,transparent 98%,#000) 0 0/52px 100% repeat-x;mask:radial-gradient(26px 18px at 26px 100%,transparent 98%,#000) 0 0/52px 100% repeat-x;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.th-curtain{position:absolute;top:0;bottom:0;width:20%;z-index:4;background:repeating-linear-gradient(90deg,#6A0C19 0 10px,#A3182B 10px 22px,#7E1020 22px 30px);box-shadow:inset -14px 0 24px rgba(0,0,0,.55);transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.th-curtain.l{left:0;border-bottom-right-radius:70% 18%}
.th-curtain.r{right:0;transform:scaleX(-1);border-bottom-right-radius:70% 18%}
.rl-view.is-spinning .th-curtain.l,.rl-view.reveal .th-curtain.l{transform:translateX(-62%)}
.rl-view.is-spinning .th-curtain.r,.rl-view.reveal .th-curtain.r{transform:scaleX(-1) translateX(-62%)}
.th-beam{position:absolute;top:-18%;width:46%;height:136%;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(255,236,190,.42),rgba(255,236,190,0) 78%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);mix-blend-mode:screen;transform-origin:50% 0;animation:sweep 6.5s ease-in-out infinite}
.th-beam.b1{left:-6%;--a:-24deg;--b:6deg}
.th-beam.b2{right:-6%;--a:24deg;--b:-6deg;animation-delay:-3.2s}
@keyframes sweep{0%,100%{transform:rotate(var(--a))}50%{transform:rotate(var(--b))}}
.rl-view.is-spinning .th-beam{animation-duration:1.6s}
.rl-view.reveal .th-beam{animation:none;transition:transform .5s;filter:brightness(1.4)}
.rl-view.reveal .th-beam.b1{transform:rotate(-14deg)}
.rl-view.reveal .th-beam.b2{transform:rotate(14deg)}
.th-floor{position:absolute;left:10%;right:10%;bottom:4%;height:18%;z-index:1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,220,160,.28),transparent)}
.rl-view.reveal .th-floor{background:radial-gradient(closest-side,rgba(255,230,170,.6),transparent)}
/* 待っている間: 少し揺れて「押して」を誘う */
.rl-view:not(.is-spinning):not(.reveal) .rl-wheel{animation:idleSway 4s ease-in-out infinite}
.rl-view:not(.is-spinning):not(.reveal) .gp-svg{animation:idleSway 5s ease-in-out infinite}
@keyframes idleSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.rl-go:not(:disabled)::after{content:"";position:absolute;inset:-10px;border-radius:inherit;border:3px solid #F2D37A;animation:goRing 1.6s ease-out infinite;pointer-events:none}
.gp-go:not(:disabled)::after,.sl-go:not(:disabled)::after{border-radius:50%}
@keyframes goRing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
/* 回転中のスピード線 */

.cd-stage{aspect-ratio:auto!important;min-height:min(70vh,560px)}

.cd{all:unset;cursor:pointer;aspect-ratio:5/7;position:relative;display:block}
