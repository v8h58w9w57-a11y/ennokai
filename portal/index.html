<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F2">
<title>親睦会ポータル</title>
<link rel="icon" type="image/png" href="../icon-192x192-any.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7F2; --card:#FFFFFF; --ink:#3B3241; --muted:#8E8494; --line:rgba(59,50,65,.09);
  --peach:#FF9A8B; --peach-soft:#FFE3DD; --mint:#5CC9A7; --mint-soft:#DDF5EC; --lav:#A08CF0; --lav-soft:#ECE7FF;
  --sky:#6BB8F0; --sky-soft:#E0F0FC; --lemon:#F6C453; --lemon-soft:#FFF3D3; --rose:#F27BA5; --rose-soft:#FFE1EC;
  --boy:#5B9BF0; --girl:#F27BA5;
  --shadow:0 18px 40px -26px rgba(90,60,90,.45);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --font-title:"Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:
  radial-gradient(600px 380px at 0% -5%, #FFE6DF 0%, transparent 70%),
  radial-gradient(600px 420px at 105% 0%, #EEE9FF 0%, transparent 65%),
  var(--bg);
  min-height:100vh; line-height:1.7; -webkit-font-smoothing:antialiased; padding-bottom:calc(84px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- header / nav ---------- */
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,247,242,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--peach),var(--lav));box-shadow:0 8px 18px -8px rgba(255,120,120,.7)}
.logo b{font-family:var(--font-title);font-size:1.12rem;font-weight:900;letter-spacing:.04em}
.logo small{display:block;font-size:.62rem;letter-spacing:.24em;color:var(--muted);font-weight:700;margin-top:-3px}
.top-admin{border:none;background:var(--card);border-radius:999px;padding:7px 14px;font-size:.8rem;font-weight:800;box-shadow:var(--shadow);cursor:pointer}
.top-admin.on{background:var(--ink);color:#fff}
.tabbar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:6px;border-radius:24px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 40px -18px rgba(70,40,80,.5);border:1px solid var(--line)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:58px;padding:6px 8px;border-radius:18px;text-decoration:none;font-size:.68rem;font-weight:800;color:var(--muted);transition:background .2s,color .2s}
.tabbar a span{font-size:1.25rem;line-height:1.2}
.tabbar a.on{background:linear-gradient(135deg,var(--peach-soft),var(--lav-soft));color:var(--ink)}

main{max-width:1000px;margin:0 auto;padding:22px 18px 30px}
.view{animation:fadeUp .45s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.page{font-family:var(--font-title);font-size:1.7rem;font-weight:900;margin:.2em 0 .1em;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.section-title{font-family:var(--font-title);font-weight:900;font-size:1.1rem;margin:28px 0 12px;display:flex;align-items:center;gap:8px}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:.92rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;border-radius:999px;padding:11px 20px;font-weight:800;font-size:.92rem;background:var(--card);box-shadow:var(--shadow);text-decoration:none;min-height:44px;touch-action:manipulation}
.btn.primary{color:#fff;background:linear-gradient(120deg,var(--peach),var(--rose) 55%,var(--lav))}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:.82rem}
.btn:active{transform:scale(.97)}

/* ---------- home ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.next{position:relative;overflow:hidden;padding:26px 26px 22px;margin-top:6px;color:#fff;border:none;
  background:linear-gradient(130deg,var(--c1,#FF9A8B),var(--c2,#A08CF0))}
.next::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.18)}
.next .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.14em;background:rgba(255,255,255,.25);padding:3px 12px;border-radius:999px}
.next .emoji{position:absolute;right:22px;bottom:12px;font-size:4.6rem;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.next h2{font-family:var(--font-title);font-weight:900;font-size:1.6rem;margin:10px 0 4px;line-height:1.35;max-width:78%}
.next .meta{font-size:.92rem;opacity:.95;display:flex;flex-wrap:wrap;gap:4px 14px}
.next .count{margin-top:14px;display:flex;align-items:baseline;gap:6px;font-weight:800}
.next .count b{font-family:var(--font-title);font-size:2.4rem;line-height:1}
.next .actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.next .actions .btn{background:#fff;color:var(--ink)}
.next .actions .btn.glass{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ev{display:flex;gap:14px;align-items:center;padding:16px 18px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.ev:hover{transform:translateY(-3px)}
.ev .ico{flex:none;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem;background:var(--soft,#FFE3DD)}
.ev .t{font-weight:800;line-height:1.4}
.ev .d{font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--mint-soft);color:#2E9C79}
.pill.wait{background:var(--lemon-soft);color:#B48714}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{font-family:var(--font-title);font-size:1.35rem;font-weight:900;margin:0}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:40px;height:40px;border-radius:14px;border:none;background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-size:1.1rem}
.cal{padding:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);padding:4px 0}
.dow.sun{color:#E2677F}.dow.sat{color:#4E8FD8}
.day{min-height:84px;border-radius:16px;padding:6px;background:#FFFBF8;border:1px solid transparent;display:flex;flex-direction:column;gap:3px}
.day.out{opacity:.35}
.day.today{border-color:var(--peach);background:#FFF1EC}
.day .n{font-size:.78rem;font-weight:800}
.day.sun .n{color:#E2677F}.day.sat .n{color:#4E8FD8}
.chip{display:block;font-size:.68rem;font-weight:800;line-height:1.3;padding:3px 6px;border-radius:9px;text-decoration:none;color:var(--ink);background:var(--soft,#FFE3DD);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbd{margin-top:14px;padding:16px 18px}
.tbd h3{margin:0 0 8px;font-size:.95rem}
@media (max-width:620px){.day{min-height:62px;padding:4px}.chip{font-size:0;padding:0;height:8px;border-radius:4px;background:var(--dot,#FF9A8B)}}

/* ---------- event detail ---------- */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:800;font-size:.86rem;color:var(--muted);margin-bottom:10px}
.hero{position:relative;overflow:hidden;padding:30px 28px 26px;border:none;color:#fff;background:linear-gradient(130deg,var(--c1),var(--c2))}
.hero .emoji{position:absolute;right:20px;top:18px;font-size:5rem;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero h1{font-family:var(--font-title);font-weight:900;font-size:1.9rem;line-height:1.35;margin:6px 0 12px;max-width:80%;position:relative}
.facts{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.fact{background:rgba(255,255,255,.24);border-radius:14px;padding:8px 14px;font-size:.9rem;font-weight:700}
.fact small{display:block;font-size:.66rem;letter-spacing:.14em;opacity:.85}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
@media (max-width:480px){.tl::before{left:83px}.tl li{grid-template-columns:72px 1fr;gap:20px}.tl li::before{left:78px}.tl .tm{font-size:.72rem}}
.box{padding:20px 22px}
.box h3{margin:0 0 12px;font-family:var(--font-title);font-size:1.05rem;font-weight:900;display:flex;align-items:center;gap:8px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:103px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--peach-soft),var(--lav-soft))}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:30px;padding:7px 0;position:relative}
.tl li::before{content:"";position:absolute;left:98px;top:14px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--peach)}
.tl li:nth-child(3n+2)::before{border-color:var(--lav)}.tl li:nth-child(3n)::before{border-color:var(--mint)}
.tl .tm{font-weight:800;font-size:.8rem;color:var(--muted);text-align:right;padding-top:2px;line-height:1.5}
.tl .tx{font-size:.93rem}
.notes{white-space:pre-wrap;font-size:.93rem}
.att{display:flex;gap:10px}
.att div{flex:1;border-radius:18px;padding:12px;text-align:center;font-weight:800}
.att b{display:block;font-family:var(--font-title);font-size:1.9rem;line-height:1.1}
.att .p{background:var(--mint-soft);color:#2E9C79}.att .a{background:var(--rose-soft);color:#C94F7E}.att .w{background:#F3F0F5;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#F3F0F5;margin:14px 0 4px}
.bar i{display:block;height:100%}

/* ---------- embedded check-in ---------- */
.embed{position:fixed;inset:0;z-index:60;background:rgba(40,25,45,.42);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.embed .sheet{width:min(1000px,100%);height:min(92vh,100%);background:#fff;border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:sheetUp .35s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.embed .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 10px 20px;border-bottom:1px solid var(--line);font-weight:800}
.embed iframe{flex:1;width:100%;border:0}
.full-embed{height:calc(100vh - 210px);min-height:520px;width:100%;border:0;border-radius:24px;background:#fff;box-shadow:var(--shadow)}

/* ---------- admin ---------- */
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;box-shadow:var(--shadow);gap:2px}
.seg button{border:none;background:none;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.86rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:800;color:var(--muted)}
select,input[type=number],input[type=password],input[type=text]{font:inherit;font-size:1rem;font-weight:700;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;min-height:46px}
select:focus,input:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 4px var(--lav-soft)}
.panel{padding:20px 22px;margin-top:14px}
.row-flex{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{border-radius:14px;padding:6px 12px;font-size:.82rem;font-weight:800;background:#F7F4F8}
.stat.b{background:#E6F0FD;color:#2F6FC4}.stat.g{background:var(--rose-soft);color:#C94F7E}.stat.u{background:var(--lemon-soft);color:#A07812}
.warn{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--lemon-soft);color:#8A6A10;font-size:.85rem;font-weight:700}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:18px}
.team{position:relative;overflow:hidden;padding:18px 16px 16px;border-radius:24px;background:#fff;box-shadow:var(--shadow);border:2.5px solid transparent;transition:border-color .15s,transform .15s;min-height:160px}
.team::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--tc)}
.team.drop{border-color:var(--lav);transform:translateY(-2px)}
.team.target{border-color:var(--tc);border-style:dashed}
.team-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.team-name{display:flex;align-items:center;gap:10px;font-family:var(--font-title);font-weight:900;font-size:1.25rem}
.team-dot{width:30px;height:30px;border-radius:11px;background:var(--tc);display:grid;place-items:center;color:#fff;font-size:.95rem;font-weight:900;box-shadow:0 6px 14px -6px var(--tc)}
.team-count{font-size:.82rem;font-weight:800;color:var(--muted);background:#F7F4F8;border-radius:999px;padding:3px 10px;white-space:nowrap}
.members{display:flex;flex-direction:column;gap:7px}
.m{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;font-size:1.05rem;font-weight:800;background:#F8F5F9;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;border:2px solid transparent;min-height:48px}
.m i{width:22px;height:22px;border-radius:50%;background:#D9D2DE;flex:none;display:grid;place-items:center;color:#fff;font-size:.72rem;font-style:normal;font-weight:900}
.m.boy i{background:var(--boy)}.m.girl i{background:var(--girl)}
.m em{margin-left:auto;font-style:normal;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--lemon-soft);color:#A07812}
.m.gone em{background:var(--rose-soft);color:#C94F7E}
.m.sel{border-color:var(--ink);background:#fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.4)}
.m.gone{opacity:.55}.m.gone span{text-decoration:line-through}
.m.pend{background:#fff;border:2px dashed #E7D9A6}
.pool .members,.pend-box .members{flex-direction:row;flex-wrap:wrap}
.pool .m,.pend-box .m{min-height:44px}
.pool{margin-top:18px;padding:16px;border-radius:24px;border:2.5px dashed var(--line);background:rgba(255,255,255,.7)}
.pend-box{margin-top:14px;padding:16px;border-radius:24px;border:2.5px dashed #EAD9A0;background:#FFFBEE}
.pool.drop,.pend-box.drop{border-color:var(--lav)}
.pool.target,.pend-box.target{border-color:var(--peach)}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.box-head b{font-family:var(--font-title);font-size:1.05rem}
.box-head small{display:block;font-size:.78rem;color:var(--muted);font-weight:700}
.print-sheet{display:none}
.hint{font-size:.8rem;color:var(--muted);margin:10px 2px 0}
.gender-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:12px}
.g-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;border-radius:16px;background:#fff;box-shadow:0 8px 20px -18px rgba(0,0,0,.4);border:1px solid var(--line)}
.g-row .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-btns{display:flex;gap:4px;flex:none}
.g-btns button{border:1.5px solid var(--line);background:#fff;border-radius:999px;min-width:46px;min-height:40px;font-weight:800;cursor:pointer;touch-action:manipulation}
.g-btns button.on.boy{background:var(--boy);border-color:var(--boy);color:#fff}
.g-btns button.on.girl{background:var(--girl);border-color:var(--girl);color:#fff}
.gate{max-width:420px;margin:40px auto;padding:30px 26px;text-align:center}
.gate .big{font-size:3rem}
.gate input{width:100%;margin:14px 0 6px;text-align:center}
.err{color:#D2486F;font-size:.85rem;font-weight:700;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;font-size:.86rem;z-index:80;transition:opacity .25s,transform .3s}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- print (teams) : A4 にかわいく ---------- */
@page{size:A4 portrait;margin:12mm}
@media print{
  body{background:#fff;padding:0;font-size:10.5pt}
  .top,.tabbar,.no-print,.toast,.embed,.view>h1.page,.view>.sub,.board,.pool,.pend-box,.warn{display:none!important}
  main{padding:0;max-width:none}
  .print-sheet{display:block}
  .ps-head{position:relative;overflow:hidden;border-radius:18px;padding:14pt 18pt;color:#fff;background:linear-gradient(120deg,#FF9A8B,#F27BA5 55%,#A08CF0)}
  .ps-head .ps-emoji{position:absolute;right:18pt;top:12pt;width:46pt;height:46pt;opacity:.9}
  .ps-head small{font-size:8pt;letter-spacing:.24em;font-weight:800;opacity:.9}
  .ps-head h1{font-family:var(--font-title);font-size:20pt;margin:2pt 0 4pt;font-weight:900}
  .ps-head p{margin:0;font-size:10pt;font-weight:700}
  .ps-sum{display:flex;gap:6pt;margin:8pt 0 10pt;flex-wrap:wrap}
  .ps-sum span{font-size:9pt;font-weight:800;padding:3pt 9pt;border-radius:999px;background:#F7F4F8}
  .ps-grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:8pt}
  .ps-team{break-inside:avoid;border-radius:14px;border:1.5pt solid var(--tc);overflow:hidden;background:#fff}
  .ps-team header{display:flex;align-items:center;justify-content:space-between;padding:6pt 10pt;background:var(--tc);color:#fff}
  .ps-team header b{font-family:var(--font-title);font-size:13pt;font-weight:900}
  .ps-team header span{font-size:8.5pt;font-weight:800;background:rgba(255,255,255,.28);border-radius:999px;padding:1pt 7pt}
  .ps-team ol{list-style:none;margin:0;padding:5pt 10pt 7pt;counter-reset:n}
  .ps-team li{counter-increment:n;display:flex;align-items:center;gap:6pt;padding:3.5pt 0;border-bottom:.6pt dotted #DDD;font-size:11pt;font-weight:800}
  .ps-team li:last-child{border-bottom:none}
  .ps-team li::before{content:counter(n);width:13pt;height:13pt;border-radius:50%;background:var(--tc);color:#fff;font-size:7.5pt;display:grid;place-items:center;flex:none;opacity:.85}
  .ps-team li .g{margin-left:auto;font-size:9pt}
  .ps-team li .g.b{color:#2F6FC4}.ps-team li .g.f{color:#C94F7E}
  .ps-team li.blank{color:#bbb;font-weight:500}
  .ps-pend{margin-top:10pt;break-inside:avoid;border:1.2pt dashed #E2C873;border-radius:12px;padding:6pt 10pt;background:#FFFBEE;font-size:9pt}
  .ps-pend b{font-size:9.5pt}
  .ps-foot{margin-top:8pt;text-align:right;font-size:8pt;color:#999}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- アイコン（線画） ---------- */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.tabbar a span{display:grid;place-items:center;height:26px}
.tabbar a span .ic{width:24px;height:24px}
.logo-mark svg{width:26px;height:26px}
.top-admin{display:inline-flex;align-items:center;gap:6px}
.section-title .ic,.box h3 .ic,.tbd h3 .ic{width:20px;height:20px;color:var(--peach)}
.gate .big .ic{width:52px;height:52px;color:var(--lav)}
.fact .ic{width:16px;height:16px;vertical-align:-.15em;margin-right:2px}
.art{width:100%;height:100%;display:block}
.next .emoji,.hero .emoji{width:96px;height:96px;font-size:0;color:#fff;opacity:.95}
.ev .ico{color:var(--dot,#FF9A8B);padding:9px}
.chip .art{display:inline-block;width:13px;height:13px;vertical-align:-2px;stroke-width:4}

.m .pin-btn{all:unset;cursor:pointer;margin-left:auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#C9C1CF;flex:none}
.m em + .pin-btn{margin-left:4px}
.m .pin-btn .ic{width:17px;height:17px}
.m .pin-btn:hover{background:#fff;color:var(--muted)}
.m .pin-btn.on{color:#fff;background:var(--ink)}
.m.pinned{background:#fff;border-color:rgba(59,50,65,.18)}
.sel-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:35;width:min(560px,calc(100% - 28px));padding:10px 14px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
.sel-banner .btn{background:#fff;color:var(--ink);box-shadow:none}
.edit-form{display:grid;gap:14px}
.edit-form textarea{font:inherit;font-size:1rem;font-weight:600;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:200px;resize:vertical;line-height:1.7}
.edit-form textarea:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 4px var(--lav-soft)}
.edit-form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.edit-form .two{grid-template-columns:1fr}}
.edit-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn.danger{color:#C94F7E;background:#fff}
#ef-datepick{color:transparent;width:52px!important;flex:none;cursor:pointer;position:relative}
#ef-datepick::-webkit-datetime-edit{display:none}
#ef-datepick::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:.6;cursor:pointer;background-position:center;background-size:22px}
@media print{.m .pin-btn{display:none}}
.still .view{animation:none}
.team,.pool,.pend-box{transition:border-color .4s ease}

/* ---------- 当日の流れ ---------- */
.sched{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;position:relative}
.sched::before{content:"";position:absolute;left:21px;top:24px;bottom:24px;border-left:2px dashed #EADFE6}
.sc{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;position:relative;animation:scIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d)}
.still .sc{animation:none}
@keyframes scIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sc-ico{position:relative;z-index:1;width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:var(--cs);color:var(--cc);box-shadow:0 0 0 5px #fff}
.sc-ico .ic{width:22px;height:22px}
.sc-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 14px 11px;box-shadow:0 10px 24px -22px rgba(80,50,80,.5);position:relative}
.sc-card::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 3px}
.sc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sc-tm{font-family:var(--font-title);font-weight:900;font-size:1.08rem;color:var(--cc);display:inline-flex;align-items:baseline;gap:5px;letter-spacing:.02em}
.sc-tm small{font-size:.76rem;color:var(--muted);font-weight:800;letter-spacing:0}
.sc-tag{font-size:.66rem;font-weight:800;letter-spacing:.06em;padding:2px 9px;border-radius:999px;background:var(--cs);color:var(--cc)}
.sc-now{font-size:.66rem;font-weight:900;padding:2px 9px;border-radius:999px;background:var(--cc);color:#fff}
.sc-title{font-weight:900;font-size:1.02rem;margin-top:3px;line-height:1.5}
.sc-sub{font-size:.84rem;color:var(--muted);margin-top:2px;line-height:1.65}
.sc.now .sc-card{border-color:var(--cc);box-shadow:0 0 0 4px var(--cs),0 14px 30px -20px var(--cc)}
.sc.now .sc-ico{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--cs)}
@media (max-width:480px){.sc{grid-template-columns:38px 1fr;gap:12px}.sc-ico{width:38px;height:38px;border-radius:14px}.sched::before{left:18px}}

/* ---------- 出欠の確認 ---------- */
.ev-pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}
.ev-pills::-webkit-scrollbar{display:none}
.ev-pill{flex:none;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px 7px 8px;font-weight:800;font-size:.86rem;cursor:pointer;white-space:nowrap}
.ev-pill-ic{width:26px;height:26px;border-radius:50%;background:var(--cs);color:var(--cc);display:grid;place-items:center;padding:5px}
.ev-pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.att-hero{display:flex;align-items:center;gap:26px;padding:24px 26px;color:#fff;border:none;background:linear-gradient(130deg,var(--c1),var(--c2));position:relative;overflow:hidden}
.att-hero::after{content:"";position:absolute;right:-50px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}
.att-ring{position:relative;flex:none;width:150px;height:150px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring-bg{stroke:rgba(255,255,255,.28)}
.ring-p{stroke:#fff;transition:stroke-dasharray .8s ease}
.ring-a{stroke:rgba(255,255,255,.55)}
.att-ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.att-ring-c b{font-family:var(--font-title);font-size:2.4rem;font-weight:900}
.att-ring-c span{font-size:.82rem;font-weight:800;opacity:.9}
.att-ring-c small{font-size:.7rem;font-weight:800;letter-spacing:.2em;opacity:.85;margin-top:2px}
.att-info{position:relative;z-index:1;min-width:0}
.att-info .tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.18em;background:rgba(255,255,255,.25);padding:3px 11px;border-radius:999px}
.att-info h2{font-family:var(--font-title);font-weight:900;font-size:1.45rem;margin:8px 0 2px;line-height:1.35}
.att-info p{margin:0;font-size:.88rem;opacity:.95}
.att-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.85rem;font-weight:800}
.att-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
.att-legend .lp{background:#fff}.att-legend .la{background:rgba(255,255,255,.55)}.att-legend .lw{background:rgba(255,255,255,.25);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.att-legend b{font-family:var(--font-title);font-size:1.05rem}
.att-pct{background:rgba(255,255,255,.22);border-radius:999px;padding:1px 10px}
.att-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.att-actions .btn{background:#fff;color:var(--ink)}
.att-actions .btn.glass{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.att-search{margin:18px 0 4px}
.att-search input{width:100%;border-radius:999px;padding-left:20px}
.att-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px;align-items:start}
@media (max-width:820px){.att-grid{grid-template-columns:1fr}.att-hero{flex-direction:column;align-items:flex-start}}
.att-sec{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
.att-sec::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--sc)}
.att-sec.is-p{--sc:#5CC9A7;--ss:#DDF5EC}.att-sec.is-a{--sc:#F27BA5;--ss:#FFE1EC}.att-sec.is-w{--sc:#F6C453;--ss:#FFF3D3;background:#FFFDF6}
.att-sec header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.att-sec header b{font-family:var(--font-title);font-size:1.1rem}
.att-dot{width:12px;height:12px;border-radius:50%;background:var(--sc)}
.att-n{margin-left:auto;font-weight:900;font-family:var(--font-title);color:var(--sc);font-size:1.05rem}
.att-sec header small{flex-basis:100%;font-size:.75rem;color:var(--muted);font-weight:700;margin-top:-4px}
.nchips{display:flex;flex-wrap:wrap;gap:7px}
.nchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 7px;border-radius:999px;background:var(--ss);font-weight:800;font-size:.92rem}
.nchip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.68rem;font-weight:900;color:#fff;background:#D4CBD9}
.nchip.boy i{background:var(--boy)}.nchip.girl i{background:var(--girl)}
.att-sec.is-w .nchip{background:#fff;border:1.5px dashed #EAD9A0}

/* ---------- 打ち合わせ ---------- */
.meets{display:flex;flex-direction:column;gap:10px}
.meet{display:flex;gap:14px;align-items:stretch;padding:12px 14px;border-radius:18px;background:#FCFAFB;border:1px solid var(--line);text-decoration:none;transition:transform .2s,box-shadow .2s}
.meet:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.meet.past{opacity:.72}
.meet.next-meet{background:#fff;border-color:rgba(160,140,240,.5);box-shadow:0 0 0 3px var(--lav-soft)}
.meet-date{flex:none;width:52px;border-radius:14px;background:linear-gradient(160deg,var(--lav),var(--rose));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.meet.past .meet-date{background:#C9C1CF}
.meet-date b{font-family:var(--font-title);font-size:1.45rem;font-weight:900}
.meet-date small{font-size:.66rem;font-weight:800;margin-top:3px}
.meet-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.meet-top{font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meet-badge{font-size:.66rem;font-weight:900;padding:2px 9px;border-radius:999px;background:var(--lav);color:#fff}
.meet-badge.done{background:#E8E3EC;color:var(--muted)}
.meet-sum{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meet-todo{font-size:.76rem;font-weight:800;color:#2E9C79;display:inline-flex;align-items:center;gap:4px}
.meet-head{position:relative;overflow:hidden;border-radius:24px;padding:22px 24px;color:#fff;background:linear-gradient(130deg,var(--c1),var(--c2));margin-bottom:6px}
.meet-head .tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.18em;background:rgba(255,255,255,.25);padding:3px 11px;border-radius:999px}
.meet-head h1{font-family:var(--font-title);font-weight:900;font-size:1.5rem;margin:8px 0 2px}
.meet-head p{margin:0;font-weight:700;opacity:.92}
.todos{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px}
.todo-row{display:flex;gap:8px;align-items:center}
.todo-row input[data-todo-text]{flex:1;min-width:0}
.todo-row .todo-who{width:130px;flex:none}
.todo-chk{width:34px;height:34px;flex:none;border-radius:11px;border:2px solid #D6CEDB;background:#fff;display:grid;place-items:center;color:#fff;cursor:pointer}
.todo-row.done .todo-chk{background:var(--mint);border-color:var(--mint)}
.todo-row.done input[data-todo-text]{text-decoration:line-through;color:var(--muted)}
.todo-del{width:34px;height:34px;flex:none;border:none;background:none;color:#C9C1CF;cursor:pointer;border-radius:10px}
.todo-del:hover{background:var(--rose-soft);color:#C94F7E}
.open-todo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 4px;border-bottom:1px dashed var(--line);text-decoration:none;font-weight:800}
.open-todo:last-child{border-bottom:none}
.open-todo .todo-chk{width:22px;height:22px;border-radius:7px}
.open-todo .who{font-size:.74rem;padding:2px 9px;border-radius:999px;background:var(--sky-soft);color:#2F6FC4}
.open-todo small{margin-left:auto;font-size:.74rem;color:var(--muted);font-weight:700}
@media (max-width:560px){.todo-row{flex-wrap:wrap}.todo-row .todo-who{width:auto;flex:1}}
@media print{
  .meet-form{box-shadow:none;border:1px solid #ddd}
  .meet-form input,.meet-form textarea{border:none;padding:0;min-height:0;resize:none;box-shadow:none}
  .meet-form textarea{white-space:pre-wrap}
  .todo-del{display:none}
  .meet-head{border-radius:14px}
}

/* ---------- ルーレット ---------- */
.rl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rl-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:22px;align-items:center;margin-top:8px}
@media (max-width:820px){.rl-wrap{grid-template-columns:1fr}}
.rl-stage{position:relative;width:min(100%,560px);aspect-ratio:1;margin:0 auto}
.rl-glow{position:absolute;inset:-6%;border-radius:50%;background:conic-gradient(from 0deg,#FF9A8B,#F6C453,#5CC9A7,#6BB8F0,#A08CF0,#F27BA5,#FF9A8B);filter:blur(28px);opacity:.45;animation:rlGlow 8s linear infinite}
.rl-stage.spinning .rl-glow{opacity:.8;animation-duration:1.4s}
@keyframes rlGlow{to{transform:rotate(360deg)}}
.rl-wheel{position:relative;width:100%;height:100%;filter:drop-shadow(0 22px 34px rgba(70,40,80,.35))}
.wheel-svg{width:100%;height:100%;display:block}
.wheel-rot{transform-origin:210px 210px}
.bulb{fill:#FFF3C4;animation:bulb 1.2s ease-in-out infinite;animation-delay:calc(var(--k) * -.1s)}
.rl-stage.spinning .bulb{animation-duration:.35s}
@keyframes bulb{0%,100%{fill:#FFF3C4;opacity:.55}50%{fill:#FFD54F;opacity:1}}
.rl-pointer{position:absolute;left:50%;top:-2%;z-index:3;width:0;height:0;margin-left:-22px;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid #3B3241;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));transform-origin:50% 0}
.rl-pointer::after{content:"";position:absolute;left:-9px;top:-40px;width:18px;height:18px;border-radius:50%;background:#FFD54F}
.rl-pointer.flick{animation:flick .12s ease-out}
@keyframes flick{0%{transform:rotate(-12deg)}100%{transform:none}}
.rl-go{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;background:linear-gradient(140deg,#FF9A8B,#F27BA5 50%,#A08CF0);color:#fff;font-family:var(--font-title);font-weight:900;font-size:clamp(.85rem,2.4vw,1.25rem);letter-spacing:.06em;cursor:pointer;box-shadow:0 12px 26px -8px rgba(242,123,165,.8);animation:goPulse 1.8s ease-in-out infinite}
.rl-go:disabled{filter:grayscale(.6);opacity:.7;animation:none;cursor:default}
@keyframes goPulse{0%,100%{box-shadow:0 12px 26px -8px rgba(242,123,165,.8),0 0 0 0 rgba(242,123,165,.45)}50%{box-shadow:0 12px 26px -8px rgba(242,123,165,.8),0 0 0 16px rgba(242,123,165,0)}}
.rl-side{padding:20px 22px}
.rl-seg{display:flex;width:100%}
.rl-seg button{flex:1}
.rl-check{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:800;margin-top:14px}
.rl-check input{width:20px;height:20px;accent-color:var(--rose)}
.rl-count{margin-top:12px;font-size:.88rem;font-weight:800;color:var(--muted)}
.rl-count b{font-family:var(--font-title);font-size:1.3rem;color:var(--ink)}
.link-btn{border:none;background:none;color:var(--rose);font-weight:800;cursor:pointer;text-decoration:underline}
.rl-hist{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rl-hist b{flex-basis:100%;font-size:.8rem;color:var(--muted)}
.rl-hist span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:999px;background:var(--lemon-soft);font-weight:800;font-size:.86rem}
.rl-hist i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--lemon);color:#fff;display:grid;place-items:center;font-size:.7rem}
/* 大きく表示: ルーレットだけ */
.rl-exit,.rl-flash,.rl-hint{display:none}
#app:fullscreen{background:radial-gradient(ellipse at 50% 40%,#5B4670 0%,#2A2033 55%,#140F18 100%);padding:0;margin:0;max-width:none;width:100vw;height:100vh;overflow:hidden;display:grid;place-items:center}
#app:fullscreen .rl-view{animation:none}
#app:fullscreen .rl-view .rl-head,#app:fullscreen .rl-view .rl-side{display:none}
#app:fullscreen .rl-view .rl-wrap{display:block;margin:0}
#app:fullscreen .rl-view .rl-stage{width:min(80vh,90vw);margin-top:9vh;cursor:pointer}
#app:fullscreen .rl-view .rl-glow{opacity:.7;filter:blur(46px)}
#app:fullscreen .rl-view .rl-go{font-size:clamp(1.2rem,3vh,2rem)}
#app:fullscreen .rl-view .rl-exit{display:grid;place-items:center;position:fixed;top:18px;right:20px;z-index:20;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:1.6rem;cursor:pointer}
#app:fullscreen .rl-view .rl-hint{display:block;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:rgba(255,255,255,.45);font-size:.8rem;font-weight:700;z-index:5}
#app:fullscreen .rl-view .rl-flash{display:block;position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.9),rgba(255,230,180,.25) 40%,transparent 70%);opacity:0}
#app:fullscreen .rl-view::before{content:"";position:fixed;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.035) 0deg 8deg,transparent 8deg 16deg);animation:rlGlow 60s linear infinite;pointer-events:none}
.rl-flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.rl-stage.landed .rl-wheel{animation:land .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}
.seg.win-seg{stroke:#fff;stroke-width:6;animation:winSeg .9s ease-in-out infinite;filter:brightness(1.15)}
@keyframes winSeg{0%,100%{filter:brightness(1.05)}50%{filter:brightness(1.45) saturate(1.2)}}
.rl-spark{position:fixed;z-index:116;width:12px;height:12px;margin:-6px 0 0 -6px;pointer-events:none;background:var(--c);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark 1.3s cubic-bezier(.15,.9,.3,1) forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(220deg);opacity:0}}
.rl-win.fs{background:rgba(15,10,20,.45)}
.rl-win.fs .rl-card{min-width:min(760px,90vw);padding:6vh 6vw 4vh;border-radius:40px}
.rl-win.fs .rl-card small{font-size:clamp(1rem,2.6vh,1.6rem)}
.rl-win.fs .rl-card b{font-size:clamp(3rem,13vh,8rem)}
.rl-win.fs .rl-card span{font-size:clamp(1rem,3vh,1.8rem)}
.rl-auto{font-size:.85rem;font-weight:700;color:var(--muted)}
.rl-win .rl-card{animation:winPop .7s cubic-bezier(.16,1.4,.3,1)}
.rl-win .rl-card b{animation:winName 1.4s ease-in-out .7s infinite}
@keyframes winName{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:120}
.rl-win{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:rgba(35,25,40,.55);backdrop-filter:blur(6px);animation:fadeIn .25s}
.rl-card{position:relative;overflow:hidden;text-align:center;padding:34px 40px 26px;border-radius:30px;background:#fff;min-width:min(420px,88vw);box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:winPop .6s cubic-bezier(.16,1.3,.3,1)}
@keyframes winPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.rl-rays{position:absolute;left:50%;top:44%;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(from 0deg,rgba(246,196,83,.18) 0deg 10deg,transparent 10deg 20deg);animation:rlGlow 12s linear infinite;pointer-events:none}
.rl-card small{position:relative;display:block;font-weight:900;letter-spacing:.2em;color:var(--rose)}

/* ---------- ルーレット: 盛り上げ演出 ---------- */

@keyframes cnt{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.dokidoki,.rl-view.suspense .rl-wheel,.rl-view.suspense .rl-vignette{animation:none}}

/* ---------- ガラガラ抽選機 ---------- */
.rl-style button{font-size:.8rem;padding:8px 6px}
.gp-stage{aspect-ratio:1/1}
.gp-machine{position:absolute;inset:4% 6% 12%}
.gp-stand{position:absolute;left:14%;right:14%;bottom:0;height:16%;border-radius:18px 18px 10px 10px;background:linear-gradient(180deg,#C98B4E,#8D5A2B);box-shadow:0 10px 20px -8px rgba(0,0,0,.4)}

.gp-drum{position:absolute;left:50%;top:40%;width:66%;aspect-ratio:1;margin-left:-33%;margin-top:-33%;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);background:radial-gradient(circle at 35% 30%,#FF8A80,#E53950 60%,#B71C3B);box-shadow:inset 0 0 0 10px rgba(255,255,255,.12)}
.gp-face{position:absolute;inset:9%;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.35),rgba(255,255,255,.08) 60%);border:0}
.gp-b{position:absolute;left:var(--x);top:var(--y);width:11%;aspect-ratio:1;margin:-5.5% 0 0 -5.5%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--c) 40%);box-shadow:0 2px 3px rgba(0,0,0,.25);animation:gpJig .5s ease-in-out infinite alternate;animation-delay:var(--d)}
.rl-stage.spinning .gp-b{animation-duration:.14s}
@keyframes gpJig{from{transform:translate(-6px,4px)}to{transform:translate(6px,-6px)}}
.gp-axle{position:absolute;left:50%;top:40%;width:9%;aspect-ratio:1;margin:-4.5% 0 0 -4.5%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE082,#C9A13B);box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:2}
.gp-handle{position:absolute;left:50%;top:40%;width:0;height:0;z-index:3}

.gp-handle span::after{content:"";position:absolute;right:-10px;top:-8px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE082,#E0A100)}
.gp-chute{position:absolute;left:62%;top:68%;width:16%;height:9%;background:linear-gradient(180deg,#8D5A2B,#6D4421);border-radius:0 0 12px 12px;transform:skewX(-20deg)}
.gp-tray{position:absolute;left:58%;right:2%;top:80%;height:6%;border-radius:0 0 22px 22px;background:linear-gradient(180deg,#E0B07A,#B47A43);box-shadow:inset 0 4px 6px rgba(0,0,0,.2)}
.gp-out{position:absolute;left:66%;top:70%;z-index:5;opacity:0;pointer-events:none}
.gp-out.go{animation:gpDrop 1.4s cubic-bezier(.3,0,.3,1) forwards}
@keyframes gpDrop{0%{opacity:1;transform:translate(0,0) scale(.5)}35%{transform:translate(4%,14vh) scale(.9)}50%{transform:translate(6%,11vh) scale(.95)}65%{transform:translate(12%,13.5vh) scale(1)}100%{opacity:1;transform:translate(18%,12vh) scale(1.6)}}
#app:fullscreen .gp-out.go{animation-name:gpDropFs}
@keyframes gpDropFs{0%{opacity:1;transform:translate(0,0) scale(.6)}35%{transform:translate(4%,9vh) scale(1)}50%{transform:translate(6%,7vh) scale(1)}65%{transform:translate(12%,9vh) scale(1.1)}100%{opacity:1;transform:translate(18%,8vh) scale(1.9)}}
.gp-ball{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 10%,var(--c) 45%);box-shadow:0 6px 14px rgba(0,0,0,.35);animation:gpRoll 1.4s linear}
.gp-ball b{display:grid;place-items:center;width:70%;height:70%;border-radius:50%;background:#fff;font-size:9px;font-weight:900;color:#3B3241;text-align:center;line-height:1.1;padding:2px;overflow:hidden}
@keyframes gpRoll{from{transform:rotate(-540deg)}to{transform:none}}
.gp-go{left:22%!important;top:auto!important;bottom:-2%;transform:translate(-50%,0)!important;width:24%!important}
/* ---------- スロット ---------- */
.sl-stage{aspect-ratio:1/1}
.sl-machine{position:absolute;inset:6% 10% 16% 4%;border-radius:36px;background:linear-gradient(170deg,#FF6F91,#C8346B 55%,#7B1E4F);box-shadow:0 30px 60px -24px rgba(120,20,70,.6),inset 0 0 0 8px rgba(255,255,255,.15);padding:10% 8% 8%}
.sl-top{position:absolute;left:50%;top:-6%;transform:translateX(-50%);padding:6px 26px;border-radius:999px;background:linear-gradient(180deg,#FFE082,#F5B400);color:#7B1E4F;font-family:var(--font-title);font-weight:900;letter-spacing:.2em;font-size:clamp(.9rem,2.6vh,1.6rem);box-shadow:0 8px 16px -6px rgba(0,0,0,.4)}
.sl-lights{position:absolute;inset:3%;pointer-events:none}
.sl-lights i{position:absolute;width:3.5%;aspect-ratio:1;border-radius:50%;background:#FFF3C4;animation:bulb 1s ease-in-out infinite;animation-delay:calc(var(--k) * -.12s);left:calc(4% + (var(--k) * 6.8%));top:0}
.sl-lights i:nth-child(n+8){top:auto;bottom:0;left:calc(4% + ((var(--k) - 7) * 13%))}
.rl-stage.spinning .sl-lights i{animation-duration:.3s}
.sl-window{position:relative;height:100%;border-radius:22px;overflow:hidden;background:#fff;box-shadow:inset 0 10px 18px rgba(0,0,0,.25),inset 0 -10px 18px rgba(0,0,0,.25)}
.sl-window::before,.sl-window::after{content:"";position:absolute;left:0;right:0;height:30%;z-index:2;pointer-events:none}
.sl-window::before{top:0;background:linear-gradient(#fff,rgba(255,255,255,0))}
.sl-window::after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff)}
.sl-reel{will-change:transform}
.sl-window{--row:calc(100% / 3)}
.sl-item{height:var(--rowpx,90px);display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-weight:900;font-size:calc(var(--rowpx,90px) * .38);color:var(--c);border-bottom:2px dashed #F1E8EE;padding:0 14px;text-align:center;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.sl-reel.blur .sl-item{filter:blur(1.5px)}
.sl-item.muted{color:var(--muted);font-size:1rem}
.sl-item.hit{background:linear-gradient(90deg,#FFF3C4,#FFE1EC,#FFF3C4);animation:winName 1s ease-in-out infinite}
.sl-line{position:absolute;left:0;right:0;top:50%;height:var(--rowpx,90px);transform:translateY(-50%);border-top:4px solid #F5B400;border-bottom:4px solid #F5B400;z-index:3;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,0,0,.04)}
.sl-lever{position:absolute;right:-9%;top:22%;width:6%;height:46%;z-index:1}
.sl-lever span{position:absolute;left:50%;bottom:0;width:30%;height:100%;margin-left:-15%;border-radius:8px;background:linear-gradient(90deg,#bbb,#eee,#999);transform-origin:50% 100%}
.sl-lever span::before{content:"";position:absolute;left:50%;top:-14%;width:300%;aspect-ratio:1;margin-left:-150%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF8A80,#D32F2F)}
.sl-lever.pull span{animation:lever .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes lever{0%{transform:none}35%{transform:scaleY(-.6)}100%{transform:none}}
.sl-go{left:50%!important;top:auto!important;bottom:-1%;transform:translate(-50%,0)!important;width:22%!important}
#app:fullscreen .rl-view .gp-stage,#app:fullscreen .rl-view .sl-stage{width:min(80vh,90vw)}

.rl-stage.gp-shake .gp-machine{animation:gpShake .22s ease-in-out infinite}
@keyframes gpShake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-.6deg)}75%{transform:translate(2px,-1px) rotate(.6deg)}}
.rl-stage.gp-hold .gp-chute{animation:chute .5s ease-in-out infinite}
@keyframes chute{0%,100%{filter:none}50%{filter:brightness(1.6) drop-shadow(0 0 12px #FFD54F)}}
.rl-stage.gp-pop .gp-machine{animation:gpPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes gpPop{0%{transform:scale(1)}40%{transform:scale(1.03,0.97)}100%{transform:none}}
.gp-ball.shine{box-shadow:0 0 0 6px rgba(255,255,255,.6),0 0 40px 12px rgba(255,213,79,.9);transition:box-shadow .4s}
.rl-stage.sl-run .sl-top{animation:slTop .5s ease-in-out infinite}
@keyframes slTop{0%,100%{filter:none;transform:translateX(-50%)}50%{filter:brightness(1.3) drop-shadow(0 0 14px #FFD54F);transform:translateX(-50%) scale(1.06)}}
.rl-stage.sl-bump .sl-window{animation:slBump .12s ease-out}
@keyframes slBump{0%{transform:translateY(2px)}100%{transform:none}}
.sl-machine.jackpot{animation:jp .6s ease-in-out 3}
@keyframes jp{0%,100%{box-shadow:0 30px 60px -24px rgba(120,20,70,.6),inset 0 0 0 8px rgba(255,255,255,.15)}50%{box-shadow:0 0 0 10px rgba(255,213,79,.6),0 0 70px 20px rgba(255,213,79,.7),inset 0 0 0 8px rgba(255,255,255,.4)}}
.sl-machine.jackpot .sl-lights i{animation-duration:.15s}

/* ===== 実物っぽい抽選機（ルーレット・ガラガラ・スロット） ===== */
.rl-stage .rl-glow{display:none}
.rl-stage::after{content:"";position:absolute;left:8%;right:8%;bottom:-3%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.18),transparent);z-index:-1}
.rl-wheel{filter:drop-shadow(0 16px 22px rgba(40,25,15,.35))}

.gp-svg,.sl-svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 18px rgba(40,25,15,.25))}

.rl-stage.gp-shake .gp-svg{animation:gpShake .22s ease-in-out infinite}
.gp-out{position:absolute;left:51%;top:68%;width:0;height:0;z-index:5;opacity:0}

@keyframes gpRollOut{0%{opacity:1;left:51%;top:68%}30%{left:60%;top:76.5%}45%{left:63%;top:75%}60%{left:70%;top:76.5%}100%{opacity:1;left:78%;top:76.5%}}

.gp-ball{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;display:block;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--c) 50%,rgba(0,0,0,.35) 100%);box-shadow:0 3px 5px rgba(0,0,0,.35);animation:gpRoll 1.4s linear}
.gp-ball b{position:absolute;left:50%;bottom:150%;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:900;color:#2B1D14;background:#FFFDF6;border:1.5px solid #2B1D14;border-radius:6px;padding:3px 9px;opacity:0;transition:opacity .3s .9s}

/* ===== 舞台の演出（幕・スポットライト・電飾） ===== */
.rl-theater{position:relative;width:min(100%,620px);margin:0 auto;border-radius:22px;overflow:hidden;padding:58px 8% 60px;background:radial-gradient(ellipse at 50% 38%,#43213A 0%,#22121E 55%,#120A10 100%);box-shadow:0 26px 50px -30px rgba(30,10,25,.8),inset 0 0 90px rgba(0,0,0,.55);isolation:isolate}

@keyframes chase{to{stroke-dashoffset:-44}}
@keyframes mqFlash{50%{stroke:#fff;opacity:.3}}
.th-valance{position:absolute;left:0;right:0;top:0;height:40px;z-index:4;background:repeating-linear-gradient(90deg,#8E1324 0 26px,#B71E35 26px 40px,#7A0F1E 40px 52px);border-bottom:5px solid #D9A93B;-webkit-mask:radial-gradient(26px 18px at 26px 100%,transparent 98%,#000) 0 0/52px 100% repeat-x;mask:radial-gradient(26px 18px at 26px 100%,transparent 98%,#000) 0 0/52px 100% repeat-x;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.th-curtain{position:absolute;top:0;bottom:0;width:20%;z-index:4;background:repeating-linear-gradient(90deg,#6A0C19 0 10px,#A3182B 10px 22px,#7E1020 22px 30px);box-shadow:inset -14px 0 24px rgba(0,0,0,.55);transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.th-curtain.l{left:0;border-bottom-right-radius:70% 18%}

    var ppl = present(ev.id), b = ppl.filter(function(p){ return p.gender === "男"; }).length, g = ppl.filter(function(p){ return p.gender === "女"; }).length;
    var d = new Date();
    return '<section class="print-sheet"><div class="ps-head"><span class="ps-emoji">' + th.svg + '</span><small>TEAM LIST</small><h1>' + esc(ev.name) + '</h1><p>' + esc(fmtDate(ev)) + (ev.time ? '　' + esc(ev.time) : '') + (ev.location ? '　｜　' + esc(ev.location) : '') + '</p></div>'
      + '<div class="ps-sum"><span>出席 ' + ppl.length + '名</span><span>' + n + 'チーム</span>' + (b || g ? '<span style="color:#2F6FC4">♂ ' + b + '名</span><span style="color:#C94F7E">♀ ' + g + '名</span>' : '') + '</div>'
      + '<div class="ps-grid" style="--cols:' + cols + '">' + draft.teams.map(function(t, i){
        var lis = t.members.map(function(id){ var p = person(id); var gg = p && p.gender === "男" ? '<span class="g b">♂</span>' : p && p.gender === "女" ? '<span class="g f">♀</span>' : ''; return '<li>' + esc(p ? p.name : '') + gg + '</li>'; });
        for (var k = t.members.length; k < rows; k++) lis.push('<li class="blank">　</li>');
        return '<div class="ps-team" style="--tc:' + t.color + '"><header><b>' + (i + 1) + '. ' + esc(t.name) + '</b><span>' + teamStats(t) + '</span></header><ol>' + lis.join("") + '</ol></div>';
      }).join("") + '</div>'
      + (pend.length ? '<div class="ps-pend"><b>出欠未入力（参加が決まったら空いている欄に書き足し）</b>：' + pend.map(function(p){ return esc(p.name); }).join("、") + '</div>' : '')
      + '<div class="ps-foot">作成 ' + d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '　親睦会ポータル</div></section>';
  }
  // 入れ替え・移動を、名前がゆっくり新しい場所へすべるように見せる
  function flipRender(moved){
    var before = {};
    document.querySelectorAll(".board .m[data-pid], .pool .m[data-pid], .pend-box .m[data-pid]").forEach(function(el){ before[el.dataset.pid] = el.getBoundingClientRect(); });
    render();
    if (reduceMotion) return;
    document.querySelectorAll(".board .m[data-pid], .pool .m[data-pid], .pend-box .m[data-pid]").forEach(function(el){
      var b = before[el.dataset.pid], a = el.getBoundingClientRect();
      var hit = moved && moved.indexOf(el.dataset.pid) >= 0;
      if (b) {
        var dx = b.left - a.left, dy = b.top - a.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          el.animate([{ transform: "translate(" + dx + "px," + dy + "px)", zIndex: 5 }, { transform: "none", zIndex: 5 }], { duration: hit ? 1100 : 900, easing: "cubic-bezier(.33,0,.15,1)" });
        }
      } else if (hit) {
        el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, easing: "ease-out" });
      }
      if (hit) el.animate([{ backgroundColor: "#FFF1EC" }, { backgroundColor: "#FFF1EC", offset: .6 }, { backgroundColor: "" }], { duration: 2000, easing: "ease-out" });
    });
  }
  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function where(pid){
    for (var i = 0; i < draft.teams.length; i++) { var k = draft.teams[i].members.indexOf(pid); if (k >= 0) return { list: draft.teams[i].members, i: k, team: i }; }
    var j = draft.pool.indexOf(pid); if (j >= 0) return { list: draft.pool, i: j, team: "pool" };
    return null; // 出欠未入力の枠
  }
  function unpin(pid){ draft.teams.forEach(function(t){ t.pinned = (t.pinned || []).filter(function(x){ return x !== pid; }); }); }
  // 2人の場所を入れ替える（同じチーム内なら順番の入れ替えになる）
  function swap(a, b){
    var wa = where(a), wb = where(b);
    if (!wa && !wb) { selected = b; render(); return; }
    if (wa && wb) { wa.list[wa.i] = b; wb.list[wb.i] = a; if (wa.team !== wb.team) { unpin(a); unpin(b); } }
    else if (wa) { wa.list[wa.i] = b; unpin(a); }
    else { wb.list[wb.i] = a; unpin(b); }
    draft.dirty = true; selected = null; flipRender([a, b]);
  }
  // b の前に a を差し込む（ドラッグ用）
  function insertBefore(a, b){
    if (a === b) return;
    var wb0 = where(b); if (!wb0) { moveTo(a, "pending"); return; }
    var wa = where(a); if (wa) { wa.list.splice(wa.i, 1); if (wa.team !== wb0.team) unpin(a); }
    var wb = where(b); wb.list.splice(wb.i, 0, a);
    draft.dirty = true; selected = null; flipRender([a]);
  }
  function moveTo(pid, target){
    var w0 = where(pid); if (!w0 || w0.team !== (target === "pool" || target === "pending" ? target : +target)) unpin(pid);
    draft.teams.forEach(function(t){ t.members = t.members.filter(function(x){ return x !== pid; }); });
    draft.pool = draft.pool.filter(function(x){ return x !== pid; });
    if (target === "pool") draft.pool.push(pid); else if (target !== "pending") draft.teams[+target].members.push(pid);
    draft.dirty = true; selected = null; flipRender([pid]);
  }
  async function saveTeams(){
    if (!S.hasTeams) { toast("先にSQLを実行してください"); return; }
    busyTeams = true;
    var payload = { event_id: draft.evId, team_count: draft.teams.length, data: { teams: draft.teams, pool: draft.pool }, updated_at: new Date().toISOString() };
    var res = await sb.from("ennokai_teams").upsert(payload, { onConflict: "event_id" });
    busyTeams = false;
    if (res.error) { toast("保存できませんでした"); return; }
    S.teams[draft.evId] = payload.data; draft.dirty = false; toast("チームを保存しました"); render();
  }

  /* ---------- ルーティング ---------- */
  function route(){ return location.hash.replace(/^#\/?/, "").split("/"); }
  var lastRoute = null;
  function render(){
    var routeKey = location.hash;
    app.classList.toggle("still", routeKey === lastRoute);
    lastRoute = routeKey;
    if (!S.loaded) { app.innerHTML = '<div class="empty">読み込み中…</div>'; return; }
    var r = route(), tab = r[0] || "home";
    setTab(tab === "event" || tab === "edit" ? "home" : tab === "meeting" ? "teams" : tab);
    if (tab === "calendar") app.innerHTML = viewCalendar();
    else if (tab === "event") app.innerHTML = viewEvent(r[1]);
    else if (tab === "checkin") { var hadFocus = document.activeElement && document.activeElement.id === "attQ"; app.innerHTML = viewCheckin(); if (hadFocus) { var qi = document.getElementById("attQ"); qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); } }
    else if (tab === "teams") app.innerHTML = viewTeams(r[1]);
    else if (tab === "edit") app.innerHTML = viewEdit(r[1]);
    else if (tab === "meeting") app.innerHTML = viewMeeting(r[1], r[2]);
    else if (tab === "roulette") { if (!rl.spinning) { app.innerHTML = viewRoulette(); requestAnimationFrame(slotSize); } }
    else if (tab === "admin") app.innerHTML = viewGate("#/teams");
    else app.innerHTML = viewHome();
  }
  window.addEventListener("hashchange", function(){ selected = null; window.scrollTo(0, 0); render(); });

  /* ---------- 操作 ---------- */
  document.addEventListener("click", async function(e){
    var t;
    if ((t = e.target.closest("[data-checkin]"))) { openCheckin(); return; }
    if ((t = e.target.closest("[data-cal]"))) {
      var d = +t.dataset.cal;
      if (d === 0) { var n = new Date(); calY = n.getFullYear(); calM = n.getMonth() + 1; }
      else { calM += d; if (calM < 1) { calM = 12; calY--; } if (calM > 12) { calM = 1; calY++; } }
      render(); return;
    }
    if (e.target.closest("#adminBtn")) {
      if (isAdmin()) { if (location.hash.indexOf("#/teams") === 0) { try { sessionStorage.removeItem(SESSION_KEY); } catch(x){} toast("主催者モードを終了しました"); location.hash = "#/"; render(); } else location.hash = "#/teams"; }
      else location.hash = "#/admin";
      return;
    }
    if ((t = e.target.closest("#gateGo"))) { tryLogin(t.dataset.next); return; }
    if ((t = e.target.closest("[data-atab]"))) { adminTab = t.dataset.atab; render(); return; }
    if ((t = e.target.closest("[data-g]"))) {
      if (!S.hasGender) { toast("先にSQLを実行してください"); return; }
      var p = person(t.dataset.pid), g = p.gender === t.dataset.g ? null : t.dataset.g, old = p.gender;
      p.gender = g; render();
      var res = await sb.from("ennokai_roster").update({ gender: g }).eq("id", p.id);
      if (res.error) { p.gender = old; render(); toast("保存できませんでした"); }
      return;
    }
    if (e.target.closest("#autoBtn") || e.target.closest("#reshuffleBtn") || e.target.closest("#manualBtn")) {
      var n = Math.max(2, Math.min(12, +document.getElementById("teamN").value || 2));
      var ppl = present(draft.evId);
      if (ppl.length < n) { toast("出席者よりチーム数が多いです"); return; }
      var keepPins = !e.target.closest("#manualBtn") && draft.teams.length === n && draft.teams.some(function(t){ return (t.pinned || []).length; });
      var r = e.target.closest("#manualBtn") ? emptyTeams(ppl, n) : autoTeams(ppl, n, keepPins ? draft.teams : null);
      var hadTeams = draft.teams.length === r.teams.length;
      draft.teams = r.teams; draft.pool = r.pool; draft.dirty = true; selected = null;
      if (hadTeams) flipRender([]); else render();
      toast(e.target.closest("#manualBtn") ? n + "チームの枠を作りました。名前を押して振り分けてください" : keepPins ? "固定した人はそのままで、ほかの人をシャッフルしました" : n + "チームに分けました（保存を押すと確定します）");
      return;
    }
    if ((t = e.target.closest("[data-card]"))) { pickCard(t); return; }
    if (e.target.closest("[data-rl-spin]")) { spin(); return; }
    if ((t = e.target.closest("[data-rl-style]"))) { if (rl.spinning) return; rl.style = t.dataset.rlStyle; try { localStorage.setItem("portal_roulette_style", rl.style); } catch (x) {} render(); return; }
    if ((t = e.target.closest("[data-rl-mode]"))) { rl.mode = t.dataset.rlMode; rl.removed = {}; rl.history = []; render(); return; }
    if (e.target.closest("[data-rl-reset]")) { rl.removed = {}; rl.history = []; render(); return; }
    if (e.target.closest("[data-rl-full]")) { if (document.fullscreenElement) document.exitFullscreen(); else if (app.requestFullscreen) app.requestFullscreen().catch(function(){}); return; }
    if ((t = e.target.closest("[data-attev-link]"))) { attEvId = t.dataset.attevLink; }
    if ((t = e.target.closest("[data-attev]"))) { attEvId = t.dataset.attev; render(); return; }
    if (e.target.closest("[data-unsel]")) { selected = null; render(); return; }
    if (e.target.closest("[data-saveev]")) { saveEvent(); return; }
    if (e.target.closest("[data-meet-save]")) { saveMeeting(); return; }
    if (e.target.closest("[data-meet-print]")) { window.print(); return; }
    if (e.target.closest("[data-todo-add]")) { readMeetForm(); meetDraft.todos = meetDraft.todos || []; meetDraft.todos.push({ text: "", who: "", done: false }); render(); var ins = document.querySelectorAll("[data-todo-text]"); if (ins.length) ins[ins.length - 1].focus(); return; }
    if ((t = e.target.closest("[data-todo-done]"))) { readMeetForm(); var td = meetDraft.todos[+t.dataset.todoDone]; td.done = !td.done; render(); return; }
    if ((t = e.target.closest("[data-todo-del]"))) { readMeetForm(); meetDraft.todos.splice(+t.dataset.todoDel, 1); render(); return; }
    if ((t = e.target.closest("[data-meet-del]"))) {
      if (!window.confirm("この打ち合わせの記録を削除します。よろしいですか？")) return;
      var md = await sb.from("ennokai_meetings").delete().eq("id", t.dataset.meetDel);
      if (md.error) { toast("削除できませんでした"); return; }
      var evBack = meetDraft && meetDraft.event_id; meetDraft = null; toast("削除しました"); await load(); location.hash = evBack ? "#/event/" + evBack : "#/teams"; return;
    }
    if ((t = e.target.closest("[data-delev]"))) {
      var dv = S.events.find(function(x){ return x.id === t.dataset.delev; });
      if (!dv || !window.confirm("「" + dv.name + "」を削除します。この行事の出欠記録とチーム分けも消えます。よろしいですか？")) return;
      var dr = await sb.from("ennokai_events").delete().eq("id", dv.id);
      if (dr.error) { toast("削除できませんでした"); return; }
      toast("削除しました"); await load(); location.hash = "#/"; return;
    }
    if (e.target.closest("#saveBtn")) { saveTeams(); return; }
    if (e.target.closest("#printBtn")) { window.print(); return; }
    if ((t = e.target.closest("[data-pin]"))) {
      var pid0 = t.dataset.pin, w = where(pid0); if (!w || w.team === "pool") return;
      var tm = draft.teams[w.team]; tm.pinned = tm.pinned || [];
      if (tm.pinned.indexOf(pid0) >= 0) tm.pinned = tm.pinned.filter(function(x){ return x !== pid0; }); else tm.pinned.push(pid0);
      draft.dirty = true; render(); return;
    }
    if ((t = e.target.closest(".m[data-pid]"))) {
      var pid = t.dataset.pid;
      if (selected && selected !== pid) { swap(selected, pid); return; }
      selected = selected === pid ? null : pid; render(); return;
    }
    if ((t = e.target.closest("[data-team]")) && selected) { moveTo(selected, t.dataset.team); return; }
  });
  document.addEventListener("input", function(e){
    if (e.target.id === "attQ") { attQuery = e.target.value; render(); }
    if (e.target.matches && e.target.matches("[data-rl-custom]")) { rl.custom = e.target.value; rl.removed = {}; try { localStorage.setItem("portal_roulette_custom", rl.custom); } catch (x) {} var w = document.getElementById("rlWheel"); if (w) w.innerHTML = wheelSVG(rlItems()); var sr = document.getElementById("slReel"); if (sr) sr.innerHTML = slotStrip(rlItems(), null); var c = document.querySelector(".rl-count b"); if (c) c.textContent = rlItems().length; var b = document.querySelector("[data-rl-spin]"); if (b) b.disabled = rlItems().length < 2; }
  });
  document.addEventListener("change", function(e){
    if (e.target.matches && e.target.matches("[data-rl-ev]")) { rl.evId = e.target.value; rl.removed = {}; rl.history = []; render(); }
    if (e.target.matches && e.target.matches("[data-rl-remove]")) { rl.removeWinner = e.target.checked; }
    if (e.target.matches && e.target.matches("[data-rl-draw]")) { rl.draw = +e.target.value; try { localStorage.setItem("portal_roulette_draw", rl.draw); } catch (x) {} if (!rl.spinning) render(); }
    if (e.target.id === "ef-datepick" && e.target.value) { var dp = e.target.value.split("-"); document.getElementById("ef-date").value = (+dp[0]) + "年" + (+dp[1]) + "月" + (+dp[2]) + "日"; }
    if (e.target.id === "teamEv") { draft = null; selected = null; location.hash = "#/teams/" + e.target.value; }
  });
  document.addEventListener("keydown", function(e){
    if (document.fullscreenElement === app && location.hash.indexOf("#/roulette") === 0 && (e.key === " " || e.key === "Enter")) { e.preventDefault(); if (!document.querySelector(".rl-win")) spin(); }
  });
  document.addEventListener("click", function(e){
    var fsEl = document.fullscreenElement;
    if (fsEl === app && location.hash.indexOf("#/roulette") === 0 && !e.target.closest("button, .rl-win, select, textarea, input") && e.target.closest(".rl-stage")) spin();
  });
  document.addEventListener("fullscreenchange", function(){ if (location.hash.indexOf("#/roulette") === 0 && !rl.spinning) render(); });
  window.addEventListener("resize", function(){ if (!rl.spinning) slotSize(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Enter" && e.target.id === "gatePw") tryLogin(document.getElementById("gateGo").dataset.next); });
  // パソコン用: ドラッグで移動
  document.addEventListener("dragstart", function(e){ var m = e.target.closest && e.target.closest(".m[data-pid]"); if (m) { e.dataTransfer.setData("text/plain", m.dataset.pid); e.dataTransfer.effectAllowed = "move"; } });
  document.addEventListener("dragover", function(e){ var z = e.target.closest && e.target.closest("[data-team]"); if (z) { e.preventDefault(); z.classList.add("drop"); } });
  document.addEventListener("dragleave", function(e){ var z = e.target.closest && e.target.closest("[data-team]"); if (z) z.classList.remove("drop"); });
  document.addEventListener("drop", function(e){
    var z = e.target.closest && e.target.closest("[data-team]"); if (!z) return; e.preventDefault();
    var pid = e.dataTransfer.getData("text/plain"); if (!pid) return;
    var onChip = e.target.closest(".m[data-pid]");
    if (onChip && onChip.dataset.pid !== pid && z.dataset.team !== "pending") insertBefore(pid, onChip.dataset.pid); else moveTo(pid, z.dataset.team);
  });
  window.addEventListener("beforeunload", function(e){ if (draft && draft.dirty) { e.preventDefault(); e.returnValue = ""; } });

  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = I(el.dataset.ic); });
  render();
  load().then(render).catch(function(){ app.innerHTML = '<div class="card empty">読み込みに失敗しました。通信を確認して再読み込みしてください。</div>'; });
})();
</script>
</body>
</html>
